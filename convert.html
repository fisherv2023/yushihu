<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>FBX → GLB Converter</title></head><body>
<h2>FBX to GLB Pose Converter</h2>
<p>Drop FBX files. Extracts frame 0.5s as static GLB.</p>
<pre id="out" style="background:#111;color:#0f0;padding:10px;font:12px monospace;white-space:pre-wrap;max-height:70vh;overflow:auto"></pre>
<button onclick="document.getElementById('fbxInput').click()" style="padding:10px 20px;font-size:14px">Select FBX files</button>
<input type="file" id="fbxInput" multiple accept=".fbx" style="display:none">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';

let out=document.getElementById('out');
let fbxInput=document.getElementById('fbxInput');

fbxInput.addEventListener('change',async e=>{
 for(let f of e.target.files){
  if(!f.name.endsWith('.fbx'))continue;
  let poseName=f.name.replace(/\.fbx$/i,'').replace(/\s+/g,'_').toLowerCase();
  out.textContent+='Converting: '+f.name+' → '+poseName+'.glb\n';
  let url=URL.createObjectURL(f);
  try{
   let fbx=await new FBXLoader().loadAsync(url);
   // Manually apply first frame of animation to bones
   let clips=fbx.animations||[];
   if(clips.length>0){
    // Build bone lookup
    let boneMap={};
    fbx.traverse(o=>{if(o.isBone)boneMap[o.name]=o});
    let clip=clips[0];
    clip.tracks.forEach(track=>{
     let name=track.name.replace('.quaternion','').replace('.position','');
     let bone=boneMap[name];if(!bone)return;
     // Find keyframe at ~0.5 seconds
     let qi=0;
     for(let i=0;i<track.times.length;i++){if(track.times[i]>=0.5){qi=i;break}}
     if(track.name.includes('quaternion')){
      let vals=track.values;
      if(qi*4+3<vals.length){
       bone.quaternion.set(vals[qi*4],vals[qi*4+1],vals[qi*4+2],vals[qi*4+3]);
      }
     }
     if(track.name.includes('.position')){
      let vals=track.values;
      if(qi*3+2<vals.length){
       bone.position.set(vals[qi*3],vals[qi*3+1],vals[qi*3+2]);
      }
     }
    });
   }
   let exporter=new GLTFExporter();
   let result=await exporter.parseAsync(fbx,{binary:true});
   let blob=new Blob([result],{type:'application/octet-stream'});
    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=poseName+'.glb';
    a.click();
    out.textContent+='  ✓ Saved as '+poseName+'.glb ('+(result.byteLength/1024).toFixed(1)+'KB)\n';
    out.textContent+='  → Move this file to models/poses/ folder\n\n';
  }catch(err){out.textContent+='  ✗: '+err.message+'\n'}
  URL.revokeObjectURL(url);
 }
});
</script>
</body></html>
