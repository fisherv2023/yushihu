<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Pose Extractor</title></head><body>
<h2>1. Load GLB model first, 2. Then drop FBX animation files</h2>
<pre id="out" style="background:#111;color:#0f0;padding:10px;font:12px monospace;white-space:pre-wrap;max-height:80vh;overflow:auto"></pre>
<button onclick="document.getElementById('fbxInput').click()" style="padding:10px 20px;font-size:14px">Select FBX files</button>
<input type="file" id="fbxInput" multiple accept=".fbx" style="display:none">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

let out=document.getElementById('out');
let fbxInput=document.getElementById('fbxInput');
let glbBones={},scene,bones={};

// Load GLB model
out.textContent='Loading xbot.glb...\n';
let glbLoader=new GLTFLoader();
let glbModel=await glbLoader.loadAsync('models/xbot.glb');
scene=glbModel.scene;
scene.traverse(o=>{if(o.isBone){bones[o.name]=o}});
out.textContent+='GLB loaded. Bones: '+Object.keys(bones).length+'\n\n';

fbxInput.addEventListener('change',async e=>{
 let files=e.target.files;
 for(let f of files){
  if(!f.name.endsWith('.fbx'))continue;
  out.textContent+='\nProcessing: '+f.name+'\n';
  let url=URL.createObjectURL(f);
  let fbxLoader=new FBXLoader();
  try{
   let fbxObj=await fbxLoader.loadAsync(url);
   let clips=fbxObj.animations||[];
   out.textContent+=clips.length+' clip(s)\n';

   // Map FBX bones to GLB bones by name
   let mixer=new THREE.AnimationMixer(scene);
   let action=mixer.clipAction(clips[0]);
   action.play();

   // Sampler at multiple time points to find good pose
   let times=[0, 0.3, 0.5, 1.0];
   for(let t of times){
    mixer.setTime(t);
    mixer.update(0);

    let pose={};
    Object.entries(bones).forEach(([name,bone])=>{
     let q=bone.quaternion;
     if(q.x!==0||q.y!==0||q.z!==0||q.w!==1)
      pose[name]={w:+q.w.toFixed(6),x:+q.x.toFixed(6),y:+q.y.toFixed(6),z:+q.z.toFixed(6)};
    });

    let nz=Object.keys(pose).length;
    if(nz>0){
     out.textContent+='\n--- t='+t+'s ('+nz+' bones) ---\n';
     out.textContent+=JSON.stringify(pose,null,2)+'\n';
    }
   }

   action.stop();
  }catch(err){out.textContent+='Error: '+err.message+'\n'}
  URL.revokeObjectURL(url);
 }
});
</script>
</body></html>
