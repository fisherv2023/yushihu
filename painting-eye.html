<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>画眼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:#fff; font-family:-apple-system,sans-serif; overflow:hidden; touch-action:manipulation; }
  canvas { display:block; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1; }

  .top { position:fixed; top:0; left:0; right:0; z-index:10; padding:12px 16px; display:flex; justify-content:space-between; pointer-events:none; }
  .top .ml { font-size:15px; font-weight:600; letter-spacing:0.02em; text-shadow:0 1px 3px rgba(0,0,0,.5); }

  /* 模式选择器 */
  .mode-selector { position:fixed; bottom:20px; left:16px; z-index:20; }
  .mode-current { padding:8px 16px; border-radius:20px; border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.45); backdrop-filter:blur(12px); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .mode-current .arrow { font-size:10px; opacity:.6; transition:transform .2s; }
  .mode-current.open .arrow { transform:rotate(180deg); }
  .mode-menu { position:absolute; bottom:48px; left:0; background:rgba(0,0,0,.6); backdrop-filter:blur(12px); border-radius:12px; border:1px solid rgba(255,255,255,.15); padding:4px; display:none; min-width:100px; }
  .mode-menu.show { display:block; }
  .mode-option { padding:8px 14px; font-size:13px; border-radius:8px; cursor:pointer; }
  .mode-option:hover { background:rgba(255,255,255,.1); }
  .mode-option.active { background:rgba(255,255,255,.15); }

  /* 右侧滑杆 */
  .slider-panel { position:fixed; top:15vh; right:6px; bottom:22vh; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .slider-label { font-size:11px; opacity:.5; writing-mode:vertical-rl; letter-spacing:1px; }
  .slider { -webkit-appearance:none; width:min(42vh,220px); height:4px; border-radius:3px; background:rgba(255,255,255,.22); writing-mode:bt-lr; transform:rotate(-90deg); transform-origin:center; }
  .slider::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:#fff; border:2px solid rgba(0,0,0,.2); }
  .slider-value { font-size:12px; font-variant-numeric:tabular-nums; opacity:.75; }

  /* 辅助工具 */
  .aux-tools { position:fixed; bottom:22vh; right:10px; z-index:20; display:flex; flex-direction:column; gap:8px; }
  .aux-btn { width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.4); backdrop-filter:blur(10px); display:flex; align-items:center;justify-content:center; font-size:13px; cursor:pointer; opacity:.6; transition:.2s; }
  .aux-btn.active { opacity:1; border-color:rgba(255,255,255,.5); }

  /* 拍照按钮 */
  .cap-btn { width:56px; height:56px; border-radius:50%; border:3px solid #fff; background:rgba(255,255,255,.2); backdrop-filter:blur(10px); position:fixed; bottom:36px; left:50%; transform:translateX(-50%); z-index:30; cursor:pointer; }
  .cap-btn::after { content:''; width:44px; height:44px; border-radius:50%; background:#fff; }

  /* 拍照后操作 */
  .action-bar { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:30; display:none; gap:16px; }
  .action-bar.show { display:flex; }
  .action-btn { padding:8px 20px; border-radius:22px; border:1px solid rgba(255,255,255,.3); background:rgba(0,0,0,.45); backdrop-filter:blur(10px); font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="top">
  <span class="ml" id="modeLabel">模糊</span>
  <span style="opacity:.6">画眼</span>
</div>

<!-- 模式选择器 -->
<div class="mode-selector" id="modeSelector">
  <div class="mode-current" id="modeCurrent">
    <span id="currentModeText">模糊</span>
    <span class="arrow">▼</span>
  </div>
  <div class="mode-menu" id="modeMenu">
    <div class="mode-option" data-mode="0">模糊</div>
    <div class="mode-option" data-mode="1">马赛克</div>
    <div class="mode-option" data-mode="2">色块</div>
    <div class="mode-option" data-mode="3">灰度</div>
    <div class="mode-option" data-mode="4">原图</div>
  </div>
</div>

<!-- 右侧滑杆 -->
<div class="slider-panel" id="sliderPanel">
  <span class="slider-label" id="sliderLabel">强度</span>
  <input type="range" class="slider" id="slider" min="1" max="10" value="4" oninput="updateLevel()">
  <span class="slider-value" id="sliderValue">4</span>
</div>

<!-- 辅助工具 -->
<div class="aux-tools">
  <div class="aux-btn" id="gridBtn" onclick="toggleGrid()" title="三等分线">▦</div>
  <div class="aux-btn" id="frameBtn" onclick="toggleFrame()" title="3:4取景框">⬜</div>
</div>

<!-- 拍照按钮 -->
<div class="cap-btn" id="capBtn" onclick="capture()"></div>

<!-- 拍照后操作 -->
<div class="action-bar" id="actionBar">
  <div class="action-btn" onclick="retake()">重拍</div>
  <div class="action-btn" onclick="save()">保存</div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

let mode = 0, level = 4, videoTex, canvasTex, vid, gridOn = false, frameOn = false;
const MODE_NAMES = ['模糊', '马赛克', '色块', '灰度', '原图'];

const canvas = document.getElementById('c');
const modeLabel = document.getElementById('modeLabel');
const capBtn = document.getElementById('capBtn');
const actionBar = document.getElementById('actionBar');
const sliderPanel = document.getElementById('sliderPanel');
const slider = document.getElementById('slider');
const sliderValue = document.getElementById('sliderValue');
const sliderLabel = document.getElementById('sliderLabel');
const modeCurrent = document.getElementById('modeCurrent');
const modeMenu = document.getElementById('modeMenu');
const gridBtn = document.getElementById('gridBtn');
const frameBtn = document.getElementById('frameBtn');

const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  tDiffuse: { value: null },
  uMode: { value: 0 },
  uLevel: { value: 4 },
  uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `varying vec2 v; void main() { v = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform int uMode; uniform float uLevel; uniform vec2 uRes;
    varying vec2 v;
    vec4 blur(sampler2D t,vec2 uv,float r){vec4 c=vec4(0);float s=0.;int R=int(r*12.);for(int x=-12;x<=12;x++)for(int y=-12;y<=12;y++){if(abs(x)+abs(y)>R)continue;c+=texture2D(t,uv+vec2(x,y)/uRes);s+=1.;}return c/s;}
    vec4 mosaic(sampler2D t,vec2 uv,float r){float g=max(2.,2.+r*40.);vec2 q=floor(uv*g*vec2(uRes.x/uRes.y,1.))/(g*vec2(uRes.x/uRes.y,1.));return texture2D(t,q);}
    vec4 poster(sampler2D t,vec2 uv,float r){
      vec4 c=vec4(0);float s=0.;int R=2;for(int x=-2;x<=2;x++)for(int y=-2;y<=2;y++){c+=texture2D(t,uv+vec2(x,y)/uRes);s+=1.;}c/=s;
      float n = pow(2., floor(uLevel)); c.rgb = floor(c.rgb * n + .5) / n; return c;
    }
    vec4 gray(sampler2D t,vec2 uv,float r){vec4 c=texture2D(t,uv);float g=dot(c.rgb,vec3(.299,.587,.114));return mix(c,vec4(vec3(g),c.a),r/10.);}
    vec4 original(sampler2D t,vec2 uv,float r){return texture2D(t,uv);}
    void main(){
      vec4 col;
      if(uMode==0)col=blur(tDiffuse,v,uLevel);
      else if(uMode==1)col=mosaic(tDiffuse,v,uLevel);
      else if(uMode==2)col=poster(tDiffuse,v,uLevel);
      else if(uMode==3)col=gray(tDiffuse,v,uLevel);
      else col=original(tDiffuse,v,uLevel);
      gl_FragColor = col;
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

const defaultCanvas = document.createElement('canvas');
defaultCanvas.width = 2; defaultCanvas.height = 2;
defaultCanvas.getContext('2d').fillStyle = '#1a1a1a';
defaultCanvas.getContext('2d').fillRect(0, 0, 2, 2);
uniforms.tDiffuse.value = new THREE.CanvasTexture(defaultCanvas);

function render() {
  uniforms.uMode.value = mode;
  uniforms.uLevel.value = level;
  renderer.render(scene, camera);
  requestAnimationFrame(render);
}
render();

function updateUI() {
  document.getElementById('modeLabel').textContent = MODE_NAMES[mode];
  document.querySelectorAll('.mode-option').forEach(el => {
    el.classList.toggle('active', +el.dataset.mode === mode);
  });
  slider.value = level;
  document.getElementById('sliderValue').textContent = level;
  document.getElementById('sliderLabel').textContent = MODE_NAMES[mode] + ' 强度';
}

// 模式切换
modeCurrent.addEventListener('click', () => {
  modeMenu.classList.toggle('show');
  modeCurrent.classList.toggle('open');
});

document.querySelectorAll('.mode-option').forEach(el => {
  el.addEventListener('click', () => {
    mode = +el.dataset.mode;
    updateUI();
    modeMenu.classList.remove('show');
    modeCurrent.classList.remove('open');
    sliderPanel.style.display = 'flex';
  });
});

// 双击隐藏/显示滑杆
let lastTap = 0;
document.addEventListener('click', (e) => {
  if (e.target.closest('.mode-selector') || e.target.closest('.cap-btn') || e.target.closest('.action-btn')) return;
  const now = Date.now();
  if (now - lastTap < 300) {
    sliderPanel.style.display = sliderPanel.style.display === 'none' ? 'flex' : 'none';
  }
  lastTap = now;
});

// 滑杆
window.updateLevel = function() {
  level = +slider.value;
  document.getElementById('sliderValue').textContent = level;
};

// 拍照
window.capture = function() {
  if (!vid) return;
  const w = vid.videoWidth || window.innerWidth;
  const h = vid.videoHeight || window.innerHeight;
  const tc = document.createElement('canvas');
  tc.width = w; tc.height = h;
  const ctx = tc.getContext('2d', { colorSpace: 'srgb' });
  ctx.drawImage(vid, 0, 0, w, h);
  canvasTex = new THREE.CanvasTexture(tc);
  canvasTex.colorSpace = THREE.SRGBColorSpace;
  uniforms.tDiffuse.value = canvasTex;
  capBtn.style.display = 'none';
  actionBar.classList.add('show');
};

window.retake = function() {
  if (videoTex) uniforms.tDiffuse.value = videoTex;
  capBtn.style.display = 'flex';
  actionBar.classList.remove('show');
};

window.save = function() {
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');
  if (navigator.share) {
    fetch(url).then(r => r.blob()).then(blob => {
      const file = new File([blob], 'painting-eye.png', { type: 'image/png' });
      navigator.share({ files: [file] }).catch(() => fallbackSave(url));
    }).catch(() => fallbackSave(url));
  } else {
    fallbackSave(url);
  }
};

function fallbackSave(url) {
  const w = window.open('');
  w.document.write(`<img src="${url}" style="width:100%"><p style="text-align:center;color:#666;font-size:14px;margin-top:10px">长按图片保存到相册</p>`);
}

// 井字线
window.toggleGrid = function() {
  gridOn = !gridOn;
  // 这里可以加 overlay 逻辑
  gridBtn.classList.toggle('active', gridOn);
};

// 取景框
window.toggleFrame = function() {
  frameOn = !frameOn;
  frameBtn.classList.toggle('active', frameOn);
};

// 初始化
updateUI();
</script>
</body>
</html>
