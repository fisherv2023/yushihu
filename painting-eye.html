<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
.top{position:fixed;top:12px;left:16px;z-index:10;pointer-events:none}
.top span{font-size:14px;font-weight:600;letter-spacing:.03em;text-shadow:0 1px 3px rgba(0,0,0,.5)}

.cap-btn{width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;display:none;flex-shrink:0}
.cap-btn::after{content:'';position:absolute;top:5px;left:5px;width:44px;height:44px;border-radius:50%;background:#fff}

.mode-sel{position:relative}
.mode-cur{padding:6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;min-width:96px;justify-content:center}
.mode-cur .arr{font-size:9px;opacity:.5;transition:transform .2s}
.mode-cur.open .arr{transform:rotate(180deg)}
.mode-menu{position:absolute;bottom:38px;left:-4px;background:rgba(0,0,0,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;border:1px solid rgba(255,255,255,.12);padding:4px;display:none;min-width:90px}
.mode-menu.show{display:block}
.mode-opt{padding:6px 12px;font-size:12px;border-radius:8px;cursor:pointer}
.mode-opt:active{background:rgba(255,255,255,.08)}
.mode-opt.sel{background:rgba(255,255,255,.12)}
.aux{display:flex;gap:6px}
.aux-btn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;opacity:.45;transition:.2s}
.aux-btn.on{opacity:1;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.1)}
.bottom-bar{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:20px}
.group-l,.group-r{display:flex;align-items:center;gap:8px}

.slider-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:4px;width:70vw;max-width:320px}
.slider{appearance:none;-webkit-appearance:none;flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.3);transition:width .1s,height .1s}

.act{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:30;display:none;gap:12px}
.act.show{display:flex}
.act-btn{padding:6px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;cursor:pointer}

/* PAL palette overlay */
.palette{position:fixed;top:48px;right:12px;z-index:15;display:none;flex-direction:column;gap:4px}
.palette.show{display:flex}
.palette .swatch{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.2);box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .15s}
.palette .swatch:active{transform:scale(1.2)}

.perm{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.perm .icon{font-size:48px;margin-bottom:18px}
.perm .title{font-size:19px;font-weight:600;margin-bottom:6px}
.perm .desc{font-size:13px;opacity:.55;margin-bottom:22px;text-align:center;line-height:1.5}
.perm .btn{padding:13px 36px;border-radius:24px;border:none;background:#fff;color:#111;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:18px}
.perm .help{font-size:11px;opacity:.35;text-align:center;line-height:1.7;display:none}
.perm .help a{color:#6ab;text-decoration:none}

.fv{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}.fv.show{display:block}
.fv .fm{position:absolute;inset:0;background:transparent}
.fv .rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.fv .rings div{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.fv .rings .r1{width:28vmin;height:28vmin}
.fv .rings .r2{width:36vmin;height:36vmin}
.fv .rings .r3{width:72vmin;height:72vmin}
.gv{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}.gv.show{display:block}
.gl{position:absolute;background:rgba(255,255,255,.08)}.gl.h{left:0;right:0;height:1px}.gl.v{top:0;bottom:0;width:1px}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;padding:9px 18px;border-radius:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;display:none;animation:fade 2s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
/* Loading screen */
.load{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .5s}
.load.done{opacity:0;pointer-events:none}
.load .pulse{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.12);animation:breathe 2s ease-in-out infinite}
.load .p1{width:60px;height:60px;animation-delay:0s}
.load .p2{width:100px;height:100px;animation-delay:.4s}
.load .p3{width:150px;height:150px;animation-delay:.8s}
.load .core{position:relative;z-index:1;width:36px;height:36px;filter:drop-shadow(0 0 8px rgba(255,255,255,.4))}
.load .core svg{width:100%;height:100%}
.load .name{position:absolute;top:calc(50% + 75px);left:50%;transform:translateX(-50%);font-size:13px;font-weight:500;letter-spacing:.15em;opacity:.5;white-space:nowrap}
@keyframes breathe{0%,100%{transform:scale(.85);opacity:.3}50%{transform:scale(1.1);opacity:.7}}
</style>
</head>

      for(int x=-30;x<=30;x++)for(int y=-30;y<=30;y++){if(abs(x)+abs(y)>R)continue;c+=texture2D(t,uv+vec2(x,y)/uRes);s+=1.;}return c/s;
    }
    vec4 mosaic(sampler2D t,vec2 uv,float r){float g=max(2.,2.+r*40.);vec2 q=floor(uv*g*vec2(uRes.x/uRes.y,1.))/(g*vec2(uRes.x/uRes.y,1.));return texture2D(t,q);}
    vec4 poster(sampler2D t,vec2 uv,float r){
      vec4 best=texture2D(t,uv);float bestCnt=0.;
      float range=r*.5; // r=1..10 → range=0.5..5
      for(int x=-4;x<=4;x+=2)for(int y=-4;y<=4;y+=2){
        vec4 c=texture2D(t,uv+vec2(x,y)*range/uRes);
        float cnt=0.;
        for(int x2=-4;x2<=4;x2+=2)for(int y2=-4;y2<=4;y2+=2){
          vec4 c2=texture2D(t,uv+vec2(x2,y2)*range/uRes);
          if(length(c.rgb-c2.rgb)<.15)cnt+=1.;
        }
        if(cnt>bestCnt){bestCnt=cnt;best=c;}
      }
      float n=pow(2.,floor(uLevel));
      best.rgb=floor(best.rgb*n+.5)/n;
      return best;
    }
    vec4 gray(sampler2D t,vec2 uv,float r){vec4 c=texture2D(t,uv);float g=dot(c.rgb,vec3(.299,.587,.114));return mix(c,vec4(vec3(g),c.a),r/10.);}
    float lum(vec4 c){return dot(c.rgb,vec3(.2126,.7152,.0722));}
    vec4 edge(sampler2D t,vec2 uv,float r){
      float th=0.05+0.2*r/10.;vec2 o=1./uRes;
      float tl=lum(texture2D(t,uv+vec2(-o.x,o.y))),t_=lum(texture2D(t,uv+vec2(0.,o.y))),tr=lum(texture2D(t,uv+vec2(o.x,o.y)));
      float l=lum(texture2D(t,uv+vec2(-o.x,0.))),r_=lum(texture2D(t,uv+vec2(o.x,0.)));
      float bl=lum(texture2D(t,uv+vec2(-o.x,-o.y))),b_=lum(texture2D(t,uv+vec2(0.,-o.y))),br=lum(texture2D(t,uv+vec2(o.x,-o.y)));
      float gx=-tl+tr-2.*l+2.*r_-bl+br,gy=tl+2.*t_+tr-bl-2.*b_-br;
      return mix(vec4(1.),vec4(0.,0.,0.,1.),step(th,sqrt(gx*gx+gy*gy)));
    }
    // TONE: value zones — shadows blue, midtones clear, highlights warm
    vec4 tone(sampler2D t,vec2 uv,float r){
      vec4 c=texture2D(t,uv);
      float l=lum(c);
      float t1=.25+r*.02; // shadow cutoff grows with level
      float t2=.55+r*.03; // highlight cutoff grows with level
      if(l<t1) return mix(c,vec4(.1,.2,.5,1.),.6); // shadow → blue overlay
      if(l>t2) return mix(c,vec4(.9,.7,.3,1.),.5); // highlight → warm gold overlay
      return c; // midtone → untouched
    }
    vec4 duo(sampler2D t,vec2 uv,float r){
      vec4 c=texture2D(t,uv);float l=dot(c.rgb,vec3(.299,.587,.114));
      return vec4(vec3(step(.1+.8*r/10.,l)),1.);
    }
    vec2 fitUV(vec2 uv){float tr=uTexSize.x/uTexSize.y;float sr=uRes.x/uRes.y;if(tr>sr){float s=sr/tr;uv.y=(uv.y-.5)/s+.5;}else{float s=tr/sr;uv.x=(uv.x-.5)/s+.5;}return uv;}
    vec4 orig(sampler2D t,vec2 uv,float r){return texture2D(t,uv);}
    void main(){
      vec2 uv=uFit==1?fitUV(v):v;if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.){gl_FragColor=vec4(0.);return;}
      vec2 sUv=clamp(uv,0.,1.);
      vec4 col;
      if(uMode==0)col=blur(tDiffuse,sUv,uLevel);
      else if(uMode==1)col=mosaic(tDiffuse,sUv,uLevel);
      else if(uMode==2)col=poster(tDiffuse,sUv,uLevel);
      else if(uMode==3)col=gray(tDiffuse,sUv,uLevel);
      else if(uMode==4)col=edge(tDiffuse,sUv,uLevel);
      else if(uMode==5)col=tone(tDiffuse,sUv,uLevel);
      else if(uMode==6)col=duo(tDiffuse,sUv,uLevel);
      else col=orig(tDiffuse,sUv,uLevel);
      gl_FragColor=col;
    }`
});

// PAL: sample the current frame and show top 5 colors
window.tP=function(){pOn=!pOn;pal.classList.toggle('show',pOn);palBtn.classList.toggle('on',pOn);};
let palTimer;
function updatePalette(){
  if(!pOn||!vid) return;
  // sample grid of pixels from the current frame
  r.render(s,cam);
  const px=new Uint8Array(4);
  const map={}; // color bucket
  const step=8; // sample every 8th pixel
  const w=innerWidth,h=innerHeight;
  const gl=r.getContext();
  const totalPixels=Math.floor(w/step)*Math.floor(h/step);
  // Read pixels in batches
  const sampleSize=Math.min(40,Math.floor(w/step));
  for(let sy=0;sy<Math.min(30,Math.floor(h/step));sy++){
    for(let sx=0;sx<sampleSize;sx++){
      const x=sx*step,y=sy*step;
      gl.readPixels(x,h-y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
      const r=Math.round(px[0]/32)*32,g=Math.round(px[1]/32)*32,b=Math.round(px[2]/32)*32;
      const key=r+','+g+','+b;
      map[key]=(map[key]||0)+1;
    }
  }
  // top 5 by frequency
  const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5);
  for(let i=0;i<5;i++){
    const sw=document.getElementById('sw'+i);
    if(sorted[i]){const [k]=sorted[i];sw.style.background='rgb('+k+')';sw.style.display='block';}
    else sw.style.display='none';
  }
}
setInterval(updatePalette,800);

function detectEnv(){const ua=navigator.userAgent;let os='',br='',isSafari=false;if(/iPhone|iPad|iPod/.test(ua)){os='iOS';isSafari=!!/Safari/.test(ua)&&!/CriOS|FxiOS|OPiOS|mercury/.test(ua);}else if(/Android/.test(ua))os='Android';else os='Desktop';if(/Firefox|FxiOS/.test(ua))br='Firefox';else if(/CriOS/.test(ua))br='Chrome(iOS)';else if(/Chrome/.test(ua)&&!/Edg/.test(ua))br='Chrome';else if(isSafari)br='Safari';else br='browser';if(os==='iOS'){permGuide.innerHTML='<b>Settings → Apps → '+br+'</b><br>Allow Camera';}else if(os==='Android'){permGuide.innerHTML='<b>Settings → Apps → '+br+'</b><br>Permissions → Camera → Allow';}else{permGuide.innerHTML='Check browser camera permissions';}}

async function startCam(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
    vid=document.createElement('video');vid.srcObject=st;vid.setAttribute('playsinline','');vid.setAttribute('webkit-playsinline','');vid.muted=true;
    await vid.play();
    vt=new THREE.VideoTexture(vid);vt.colorSpace=THREE.SRGBColorSpace;u.tDiffuse.value=vt;
    perm.style.display='none';u.uFit.value=0;capBtn.style.display='flex';
  }catch(e){console.error(e);detectEnv();permHelp.style.display='block';permBtn.textContent='Retry';}
}
permBtn.addEventListener('click',startCam);
if(!('ontouchstart' in window)) setTimeout(startCam,500);

document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){mode=(mode+7)%8;upd();}if(e.key==='ArrowDown'){mode=(mode+1)%8;upd();}if(e.key==='ArrowLeft'){level=Math.max(1,level-1);slider.value=level;upd();}if(e.key==='ArrowRight'){level=Math.min(10,level+1);slider.value=level;upd();}if(e.key===' '){e.preventDefault();snap();}if(e.key==='r')retake();if(e.key==='s')save();});

addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);u.uRes.value.set(innerWidth,innerHeight);});
