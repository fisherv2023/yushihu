<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Painting Eye</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
.top{position:fixed;top:12px;left:16px;z-index:10;pointer-events:none}
.top span{font-size:14px;font-weight:600;letter-spacing:.03em;text-shadow:0 1px 3px rgba(0,0,0,.5)}

/* layout: everything relative to capture button */
.cap-btn{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:30;width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;display:none}
.cap-btn::after{content:'';position:absolute;top:5px;left:5px;width:44px;height:44px;border-radius:50%;background:#fff}

/* mode menu - left of capture */
.mode-sel{position:fixed;bottom:48px;left:calc(50% - 80px);transform:translateX(-50%);z-index:20}
.mode-cur{padding:6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.mode-cur .arr{font-size:9px;opacity:.5;transition:transform .2s}
.mode-cur.open .arr{transform:rotate(180deg)}
.mode-menu{position:absolute;bottom:38px;left:-4px;background:rgba(0,0,0,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;border:1px solid rgba(255,255,255,.12);padding:4px;display:none;min-width:90px}
.mode-menu.show{display:block}
.mode-opt{padding:6px 12px;font-size:12px;border-radius:8px;cursor:pointer}
.mode-opt:active{background:rgba(255,255,255,.08)}
.mode-opt.sel{background:rgba(255,255,255,.12)}

/* aux - right of capture */
.aux{position:fixed;bottom:48px;right:calc(50% - 80px);transform:translateX(50%);z-index:20;display:flex;gap:6px}
.aux-btn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;opacity:.45;transition:.2s}
.aux-btn.on{opacity:1;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.1)}

/* horizontal slider below capture */
.slider-bar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:4px;width:70vw;max-width:320px}
.slider{appearance:none;-webkit-appearance:none;flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.3);transition:width .1s,height .1s}

/* action bar */
.act{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);z-index:30;display:none;gap:12px}
.act.show{display:flex}
.act-btn{padding:6px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;cursor:pointer}

/* perm overlay */
.perm{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.perm .icon{font-size:48px;margin-bottom:18px}
.perm .title{font-size:19px;font-weight:600;margin-bottom:6px}
.perm .desc{font-size:13px;opacity:.55;margin-bottom:22px;text-align:center;line-height:1.5}
.perm .btn{padding:13px 36px;border-radius:24px;border:none;background:#fff;color:#111;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:18px}
.perm .help{font-size:11px;opacity:.35;text-align:center;line-height:1.7;display:none}
.perm .help a{color:#6ab;text-decoration:none}

/* frame overlay → three concentric circles */
.fv{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}.fv.show{display:block}
.fv .fm{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.fv .rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.fv .rings div{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.fv .rings .r1{width:18vmin;height:18vmin}
.fv .rings .r2{width:24vmin;height:24vmin}
.fv .rings .r3{width:48vmin;height:48vmin}
/* grid */
.gv{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}.gv.show{display:block}
.gl{position:absolute;background:rgba(255,255,255,.08)}.gl.h{left:0;right:0;height:1px}.gl.v{top:0;bottom:0;width:1px}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;padding:9px 18px;border-radius:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;display:none;animation:fade 2s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top"><span id="mL">BLUR 4</span></div>

<div class="perm" id="perm">
  <div class="icon">📷</div><div class="title">Camera Access</div>
  <div class="desc">Painting Eye needs camera<br>to assist art observation</div>
  <button class="btn" id="permBtn">Allow Camera</button>
  <div class="help" id="permHelp"><div id="permGuide"></div><p style="margin-top:14px"><a href="javascript:location.reload()">Refresh after enabling</a></p></div>
</div>

<div class="gv" id="grid"><div class="gl h" style="top:33%"></div><div class="gl h" style="top:66%"></div><div class="gl v" style="left:33%"></div><div class="gl v" style="left:66%"></div></div>
<div class="fv" id="frame"><div class="fm"></div><div class="rings"><div class="r1"></div><div class="r2"></div><div class="r3"></div></div></div>

<div class="mode-sel" id="mSel">
  <div class="mode-cur" id="mCur"><span id="mText">BLUR</span><span class="arr">▼</span></div>
  <div class="mode-menu" id="mMenu">
    <div class="mode-opt sel" data-m="0">BLUR</div>
    <div class="mode-opt" data-m="1">MOSAIC</div>
    <div class="mode-opt" data-m="2">POSTER</div>
    <div class="mode-opt" data-m="3">GRAY</div>
    <div class="mode-opt" data-m="4">ORIGINAL</div>
  </div>
</div>

<div class="cap-btn" id="capBtn" onclick="snap()"></div>

<div class="aux" id="aux">
  <div class="aux-btn" id="gridBtn" onclick="tG()">▦</div>
  <div class="aux-btn" id="frameBtn" onclick="tF()">⬜</div>
</div>

<div class="slider-bar" id="sBar">
  <input type="range" class="slider" id="slider" min="1" max="10" value="4" oninput="onS()">
</div>

<div class="act" id="act">
  <div class="act-btn" onclick="retake()">Retake</div>
  <div class="act-btn" onclick="save()">Save</div>
</div>

<div class="toast" id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

let mode=0,level=4,vt,ct,vid,gOn=false,fOn=false;
const N=['BLUR','MOSAIC','POSTER','GRAY','ORIGINAL'];
const canvas=document.getElementById('c');
const capBtn=document.getElementById('capBtn');
const act=document.getElementById('act');
const sBar=document.getElementById('sBar');
const slider=document.getElementById('slider');
const mSel=document.getElementById('mSel'),aux=document.getElementById('aux');
const gridBtn=document.getElementById('gridBtn'),frameBtn=document.getElementById('frameBtn');
const grid=document.getElementById('grid'),frame=document.getElementById('frame');
const perm=document.getElementById('perm'),permBtn=document.getElementById('permBtn');
const permHelp=document.getElementById('permHelp'),permGuide=document.getElementById('permGuide');
const toast=document.getElementById('toast');

const r=new THREE.WebGLRenderer({canvas,preserveDrawingBuffer:true,antialias:false});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);
const s=new THREE.Scene(),cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const u={tDiffuse:{value:null},uMode:{value:0},uLevel:{value:4},uRes:{value:new THREE.Vector2(innerWidth,innerHeight)}};
const mat=new THREE.ShaderMaterial({uniforms:u,
  vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform int uMode;uniform float uLevel;uniform vec2 uRes;
    varying vec2 v;
    vec4 blur(sampler2D t,vec2 uv,float r){
      // r=1..10 → R=1..30 (much wider range, each level distinct)
      vec4 c=vec4(0);float s=0.;int R=int(r*3.);
      for(int x=-30;x<=30;x++)for(int y=-30;y<=30;y++){if(abs(x)+abs(y)>R)continue;c+=texture2D(t,uv+vec2(x,y)/uRes);s+=1.;}return c/s;
    }
    vec4 mosaic(sampler2D t,vec2 uv,float r){float g=max(2.,2.+r*40.);vec2 q=floor(uv*g*vec2(uRes.x/uRes.y,1.))/(g*vec2(uRes.x/uRes.y,1.));return texture2D(t,q);}
    vec4 poster(sampler2D t,vec2 uv,float r){vec4 c=texture2D(t,uv);float n=pow(2.,floor(uLevel));c.rgb=floor(c.rgb*n+.5)/n;return c;}
    vec4 gray(sampler2D t,vec2 uv,float r){vec4 c=texture2D(t,uv);float g=dot(c.rgb,vec3(.299,.587,.114));return mix(c,vec4(vec3(g),c.a),r/10.);}
    vec4 orig(sampler2D t,vec2 uv,float r){return texture2D(t,uv);}
    void main(){
      vec4 col;
      if(uMode==0)col=blur(tDiffuse,v,uLevel);
      else if(uMode==1)col=mosaic(tDiffuse,v,uLevel);
      else if(uMode==2)col=poster(tDiffuse,v,uLevel);
      else if(uMode==3)col=gray(tDiffuse,v,uLevel);
      else col=orig(tDiffuse,v,uLevel);
      gl_FragColor=col;
    }`
});
s.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
const dc=document.createElement('canvas');dc.width=2;dc.height=2;dc.getContext('2d').fillStyle='#1a1a1a';dc.getContext('2d').fillRect(0,0,2,2);
u.tDiffuse.value=new THREE.CanvasTexture(dc);
(function R(){u.uMode.value=mode;u.uLevel.value=level;r.render(s,cam);requestAnimationFrame(R)})();

function upd(){document.getElementById('mL').textContent=N[mode]+' '+level;document.querySelectorAll('.mode-opt').forEach(e=>e.classList.toggle('sel',+e.dataset.m===mode));document.getElementById('mText').textContent=N[mode];slider.value=level;slider.style.setProperty('--sz',(12+level*2)+'px');}

// slider thumb size changes with level
window.onS=function(){level=+slider.value;slider.style.setProperty('--sz',(12+level*2)+'px');upd();};
const style=document.createElement('style');style.textContent='.slider::-webkit-slider-thumb{width:var(--sz,14px);height:var(--sz,14px)}';document.head.appendChild(style);

window.snap=function(){if(!vid)return;const w=vid.videoWidth||innerWidth,h=vid.videoHeight||innerHeight;const tc=document.createElement('canvas');tc.width=w;tc.height=h;const ctx=tc.getContext('2d',{colorSpace:'srgb'});ctx.drawImage(vid,0,0,w,h);ct=new THREE.CanvasTexture(tc);ct.colorSpace=THREE.SRGBColorSpace;u.tDiffuse.value=ct;capBtn.style.display='none';act.classList.add('show');};
window.retake=function(){if(vt)u.tDiffuse.value=vt;capBtn.style.display='flex';act.classList.remove('show');};
window.save=function(){r.render(s,cam);const url=r.domElement.toDataURL('image/png');if(navigator.share){fetch(url).then(r=>r.blob()).then(b=>navigator.share({files:[new File([b],'painting-eye.png',{type:'image/png'})]}).catch(()=>fb(url))).catch(()=>fb(url));}else fb(url);};
function fb(url){const w=window.open('');w.document.write('<img src="'+url+'" style="width:100%"><p style="text-align:center;color:#666;font-size:13px;margin-top:10px">Long press to save</p>');showT('Long press to save');}
function showT(t){toast.textContent=t;toast.style.display='block';toast.style.animation='none';toast.offsetHeight;toast.style.animation='fade 2s forwards';setTimeout(()=>toast.style.display='none',2000);}
window.tG=function(){gOn=!gOn;grid.classList.toggle('show',gOn);gridBtn.classList.toggle('on',gOn);};
window.tF=function(){fOn=!fOn;frame.classList.toggle('show',fOn);frameBtn.classList.toggle('on',fOn);};

document.getElementById('mCur').addEventListener('click',()=>{document.getElementById('mMenu').classList.toggle('show');document.getElementById('mCur').classList.toggle('open');});
document.querySelectorAll('.mode-opt').forEach(e=>{e.addEventListener('click',()=>{mode=+e.dataset.m;upd();document.getElementById('mMenu').classList.remove('show');document.getElementById('mCur').classList.remove('open');});});

// double-tap: hide everything except capture button
let lt=0;document.addEventListener('click',e=>{if(e.target.closest('#capBtn,.act-btn,#perm'))return;const n=Date.now();if(n-lt<300){const els=[sBar,mSel,aux];els.forEach(el=>el.style.display=el.style.display==='none'?'':'none');}lt=n;});

function detectEnv(){const ua=navigator.userAgent;let os='',br='',isSafari=false;if(/iPhone|iPad|iPod/.test(ua)){os='iOS';isSafari=!!/Safari/.test(ua)&&!/CriOS|FxiOS|OPiOS|mercury/.test(ua);}else if(/Android/.test(ua))os='Android';else os='Desktop';if(/Firefox|FxiOS/.test(ua))br='Firefox';else if(/CriOS/.test(ua))br='Chrome(iOS)';else if(/Chrome/.test(ua)&&!/Edg/.test(ua))br='Chrome';else if(isSafari)br='Safari';else br='browser';if(os==='iOS'){permGuide.innerHTML='<b>Settings → Apps → '+br+'</b><br>Allow Camera';}else if(os==='Android'){permGuide.innerHTML='<b>Settings → Apps → '+br+'</b><br>Permissions → Camera → Allow';}else{permGuide.innerHTML='Check browser camera permissions';}}

async function startCam(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
    vid=document.createElement('video');vid.srcObject=st;vid.setAttribute('playsinline','');vid.setAttribute('webkit-playsinline','');vid.muted=true;
    await vid.play();
    vt=new THREE.VideoTexture(vid);vt.colorSpace=THREE.SRGBColorSpace;u.tDiffuse.value=vt;
    perm.style.display='none';capBtn.style.display='flex';
  }catch(e){console.error(e);detectEnv();permHelp.style.display='block';permBtn.textContent='Retry';}
}
permBtn.addEventListener('click',startCam);
if(!('ontouchstart' in window)) setTimeout(startCam,500);

document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){mode=(mode+4)%5;upd();}if(e.key==='ArrowDown'){mode=(mode+1)%5;upd();}if(e.key==='ArrowLeft'){level=Math.max(1,level-1);slider.value=level;upd();}if(e.key==='ArrowRight'){level=Math.min(10,level+1);slider.value=level;upd();}if(e.key===' '){e.preventDefault();snap();}if(e.key==='r')retake();if(e.key==='s')save();});

addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);u.uRes.value.set(innerWidth,innerHeight);});
upd();
</script>
</body>
</html>
