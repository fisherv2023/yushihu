<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>FBX Bone Extractor</title>
<style>body{background:#111;color:#fff;font:13px monospace;padding:20px;white-space:pre-wrap}</style></head><body>
<div id="out"></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

const out=document.getElementById('out');
(async()=>{
 out.textContent='Loading FBX...';
 let loader=new FBXLoader();
 let obj=await loader.loadAsync('models/Standing Idle.fbx');

 // Find animation clips
 let clips=obj.animations||[];
 let mixer=new THREE.AnimationMixer(obj);

 let result=[];
 // Log all bones
 obj.traverse(o=>{
  if(o.isBone){
   let q=o.quaternion;
   result.push(`${o.name}:  {x:${q.x.toFixed(4)}, y:${q.y.toFixed(4)}, z:${q.z.toFixed(4)}, w:${q.w.toFixed(4)}}`);
  }
 });

 // If there are animations, advance to frame 1 and capture again
 if(clips.length>0){
  let action=mixer.clipAction(clips[0]);
  action.play();
  mixer.update(0.016); // advance one frame
  result.push('\n--- After 1 frame ---');
  obj.traverse(o=>{
   if(o.isBone){
    let q=o.quaternion;
    result.push(`${o.name}:  {x:${q.x.toFixed(4)}, y:${q.y.toFixed(4)}, z:${q.z.toFixed(4)}, w:${q.w.toFixed(4)}}`);
   }
  });
 }

 // Also try to extract as Euler
 let result2=['\n--- As Euler (T-pose) ---'];
 obj.traverse(o=>{
  if(o.isBone){
   let e=new THREE.Euler().setFromQuaternion(o.quaternion);
   result2.push(`${o.name}:  {x:${e.x.toFixed(4)}, y:${e.y.toFixed(4)}, z:${e.z.toFixed(4)}}`);
  }
 });

 out.textContent='Bones: '+result.filter(l=>l.includes('mixamorig')).length+'\n'+result.join('\n')+'\n'+result2.join('\n');
})();
</script>
</body></html>
