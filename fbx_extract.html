<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>FBX Extractor</title></head><body>
<h2>Drop FBX files here</h2>
<pre id="out" style="background:#111;color:#0f0;padding:10px;font:12px monospace;white-space:pre-wrap"></pre>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

let out=document.getElementById('out');
document.body.addEventListener('dragover',e=>e.preventDefault());
document.body.addEventListener('drop',async e=>{
 e.preventDefault();
 let files=e.dataTransfer.files;
 for(let f of files){
  if(!f.name.endsWith('.fbx'))continue;
  out.textContent+='\nLoading: '+f.name+'...\n';
  let url=URL.createObjectURL(f);
  let loader=new FBXLoader();
  try{
   let obj=await loader.loadAsync(url);
   let bones={};
   obj.traverse(o=>{
    if(o.isBone){
     let e=new THREE.Euler().setFromQuaternion(o.quaternion);
     bones[o.name]={
      rx:+e.x.toFixed(4),ry:+e.y.toFixed(4),rz:+e.z.toFixed(4),
      px:+o.position.x.toFixed(3),py:+o.position.y.toFixed(3),pz:+o.position.z.toFixed(3)
     };
    }
   });
   out.textContent+=f.name+' — '+Object.keys(bones).length+' bones\n';
   out.textContent+=JSON.stringify(bones,null,2);
   out.textContent+='\n\n';
  }catch(err){out.textContent+='Error: '+err.message+'\n'}
  URL.revokeObjectURL(url);
 }
});
</script>
</body></html>
