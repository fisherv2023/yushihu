<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>FBX Extractor v3</title></head><body>
<h2>Drop FBX files here</h2>
<pre id="out" style="background:#111;color:#0f0;padding:10px;font:12px monospace;white-space:pre-wrap"></pre>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

let out=document.getElementById('out');
document.body.addEventListener('dragover',e=>e.preventDefault());
document.body.addEventListener('drop',async e=>{
 e.preventDefault();
 let files=e.dataTransfer.files;
 for(let f of files){
  if(!f.name.endsWith('.fbx'))continue;
  out.textContent+='\n'+f.name+'...\n';
  let url=URL.createObjectURL(f);
  let loader=new FBXLoader();
  try{
   let obj=await loader.loadAsync(url);

   // Build bone lookup
   let boneMap={};
   obj.traverse(o=>{if(o.isBone)boneMap[o.name]=o});

   let clips=obj.animations||[];
   out.textContent+=clips.length+' animation clip(s)\n';

   // Find the bone that HAS non-zero quaternion
   // by examining clip tracks at t=0.5 (deeper into animation)
   if(clips.length>0){
    let clip=clips[0];
    let bones={};
    clip.tracks.forEach(track=>{
     let name=track.name.replace('.quaternion','');
     let times=track.times;
     let values=track.values;
     // Get value at ~1 second
     let idx=0;
     for(let i=0;i<times.length;i++){
      if(times[i]>=0.5){idx=i;break}
     }
     // Quaternion tracks: 4 values per keyframe
     if(track.name.includes('quaternion')){
      let qi=idx*4;
      if(qi+3<values.length){
       let q=new THREE.Quaternion(values[qi],values[qi+1],values[qi+2],values[qi+3]);
       let e=new THREE.Euler().setFromQuaternion(q, 'YXZ');
       bones[name]={
        rx:+e.x.toFixed(4),ry:+e.y.toFixed(4),rz:+e.z.toFixed(4)
       };
      }
     }
    });
    // Only show non-zero bones
    let nz={};
    Object.entries(bones).forEach(([k,v])=>{
     if(v.rx!==0||v.ry!==0||v.rz!==0)nz[k]=v;
    });
    out.textContent+=Object.keys(nz).length+' non-zero bones at t=0.5s\n';
    out.textContent+=JSON.stringify(nz,null,2);
   }
   out.textContent+='\n\n';
  }catch(err){out.textContent+='Error: '+err+'\n'}
  URL.revokeObjectURL(url);
 }
});
</script>
</body></html>
