<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Double Exposure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
/* top-left label */
.ml{position:fixed;top:12px;left:16px;z-index:10;font-size:14px;font-weight:600;letter-spacing:.03em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
/* mode selector / exit */
.mode-cur{padding:6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;min-width:80px;justify-content:center;color:#fff}
/* capture button */
.cap-wrap{position:absolute;left:50%;transform:translateX(-50%)}
.cap-btn{position:relative;width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cap-btn::after{content:'';position:absolute;top:5px;left:5px;width:44px;height:44px;border-radius:50%;background:#fff}
/* bottom bar */
.bottom-bar{position:fixed;bottom:48px;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.group-l{display:flex;align-items:center;gap:8px}
.group-r{display:flex;align-items:center;gap:8px}
.aux-btn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;opacity:.45;transition:.2s}
/* slider */
.slider-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;width:70vw;max-width:320px}
.slider{appearance:none;-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.15);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
/* act buttons (retake/save) */
.act{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:30;display:none;gap:12px}
.act.show{display:flex}
.act-btn{padding:6px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;cursor:pointer}
/* permission overlay */
.perm{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92)}
.perm h2{font-size:20px;font-weight:600;margin-bottom:8px}
.perm .byline{font-size:13px;opacity:.5;margin-bottom:20px}
.perm .btn{padding:14px 40px;border-radius:24px;border:none;background:#fff;color:#111;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ml" id="modeLabel">EXPO</div>
<div class="perm" id="perm">
  <h2>Double Exposure</h2>
  <div class="byline">Capture 2 frames · choose blend mode</div>
  <button class="btn" id="permBtn">Allow Camera</button>
</div>
<div class="act" id="act">
  <div class="act-btn" id="btnRetake">Retake</div>
  <div class="act-btn" id="btnSave">Save</div>
</div>
<div class="bottom-bar" id="bBar">
  <div class="group-l">
    <div class="mode-cur" id="exitBtn">← EXIT</div>
  </div>
  <div class="cap-wrap" id="capWrap">
    <div class="cap-btn" id="capBtn"></div>
  </div>
  <div class="group-r" id="aux">
    <div class="aux-btn" id="switchBtn" title="Flip Camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></div>
    <div class="aux-btn" id="uploadBtn" title="Upload Photo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M24 19H21V23H19V19H16L20 15L24 19ZM21.0078 3C21.5555 3 21.9999 3.44482 22 3.99316V13H20V5H4V18.999L14 9L17 12V14.8291L14 11.8281L6.82715 19H14V21H2.99219C2.44451 21 2.00013 20.5552 2 20.0068V3.99316C2.00013 3.44463 2.45577 3 2.99219 3H21.0078ZM8 7C9.10457 7 10 7.89543 10 9C10 10.1046 9.10457 11 8 11C6.89543 11 6 10.1046 6 9C6 7.89543 6.89543 7 8 7Z"/></svg></div>
  </div>
</div>
<div class="slider-bar" id="sBar">
  <input type="range" class="slider" id="modeSlider" min="0" max="5" value="0" step="1">
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const MODES = ['Normal', 'Screen', 'Multiply', 'Overlay', 'Lighten', 'Darken'];
const MODE_LABELS_CN = ['Normal', 'Screen', 'Multiply', 'Overlay', 'Lighten', 'Darken'];

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: canvas, preserveDrawingBuffer: true, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera3D = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

let video, stream, facingMode = 'environment', videoTexture;
let composing = false;
let layers = [];
let selMode = 0;

const vidCanvas = document.createElement('canvas');
const vidCtx = vidCanvas.getContext('2d');

function getMode() {
  return parseInt(document.getElementById('modeSlider').value);
}

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 4096 }, height: { ideal: 2160 } }
    });
    video = document.createElement('video');
    video.srcObject = stream; video.playsInline = true;
    await video.play();
    document.getElementById('perm').style.display = 'none';
    document.getElementById('bBar').style.display = 'flex';
    document.getElementById('sBar').style.display = 'block';
    // Preserve capture status if already in progress
    if (layers.length === 0) document.getElementById('modeLabel').textContent = 'EXPO';

    if (videoTexture) videoTexture.dispose();
    videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.NoColorSpace;
    videoTexture.minFilter = THREE.LinearFilter; videoTexture.magFilter = THREE.LinearFilter;
  } catch (err) {
    console.error('Camera:', err);
  }
}
document.getElementById('permBtn').addEventListener('click', startCam);

// ── Composite shader ──
const compositeVert = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`;
const compositeFrag = `precision highp float; varying vec2 vUv;
uniform sampler2D uTexA, uTexB; uniform int uMode;
void main(){
  vec4 a = texture2D(uTexA, vUv);
  vec4 b = texture2D(uTexB, vUv);
  vec4 outColor;
  if(uMode == 0) outColor = b;          // Normal (just show B)
  if(uMode == 1) outColor = vec4(1.) - (vec4(1.)-a)*(vec4(1.)-b); // Screen
  if(uMode == 2) outColor = a * b;       // Multiply
  if(uMode == 3) {                       // Overlay
    vec4 lo = 2.*a*b;
    vec4 hi = vec4(1.) - 2.*(vec4(1.)-a)*(vec4(1.)-b);
    outColor = mix(lo, hi, step(0.5, b));
  }
  if(uMode == 4) outColor = max(a, b);  // Lighten
  if(uMode == 5) outColor = min(a, b);  // Darken
  gl_FragColor = outColor;
}`;
const compositeMat = new THREE.ShaderMaterial({
  vertexShader: compositeVert, fragmentShader: compositeFrag,
  uniforms: {
    uTexA: { value: null }, uTexB: { value: null }, uMode: { value: 0 }
  }
});

// ── Camera display shader ──
const displayVert = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`;
const displayFrag = `precision highp float; varying vec2 vUv;
uniform sampler2D uCamera;
void main(){
  gl_FragColor = texture2D(uCamera, vUv);
}`;
const displayMat = new THREE.ShaderMaterial({
  vertexShader: displayVert, fragmentShader: displayFrag,
  uniforms: { uCamera: { value: null } }
});

const fullQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), displayMat);
scene.add(fullQuad);

// ── Capture ──
document.getElementById('capBtn').addEventListener('click', () => {
  if (!video || !video.videoWidth || layers.length >= 2) return;
  // Ensure video is playing and has a stable frame
  if (video.paused) video.play().catch(() => {});
  if (video.readyState < 2) return; // not enough data yet, try next click
  const w = video.videoWidth, h = video.videoHeight;
  const maxTexSize = 1920;
  const scale = Math.min(1, maxTexSize / Math.max(w, h));
  const tw = Math.round(w * scale), th = Math.round(h * scale);
  const cap = document.createElement('canvas');
  cap.width = tw; cap.height = th;
  cap.getContext('2d').drawImage(video, 0, 0, tw, th);
  // Verify capture is valid (not a corrupt/striped frame)
  var px = cap.getContext('2d').getImageData(tw>>1, th>>1, 1, 1).data;
  if (px[0] === 0 && px[1] === 0 && px[2] === 0) return; // black center = bad frame, retry
  const tex = new THREE.CanvasTexture(cap);
  tex.colorSpace = THREE.NoColorSpace;
  tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
  layers.push({ texture: tex, canvas: cap });

  if (layers.length === 1) {
    document.getElementById('modeLabel').textContent = 'EXPO 1/2';
    window.parent.postMessage({type:'expoStatus', text:'EXPO 1/2'}, '*');
  }

  if (layers.length === 2) {
    composing = true;
    document.getElementById('modeLabel').textContent = 'EXPO ' + MODE_LABELS_CN[getMode()];
    window.parent.postMessage({type:'expoStatus', text:'EXPO ' + MODE_LABELS_CN[getMode()]}, '*');
    document.getElementById('sBar').style.display = 'block';
    document.getElementById('act').classList.add('show');
  }
});

// ── Mode slider ──
document.getElementById('modeSlider').addEventListener('input', () => {
  selMode = getMode();
  compositeMat.uniforms.uMode.value = selMode;
  document.getElementById('modeLabel').textContent = 'EXPO ' + MODE_LABELS_CN[selMode];
  if (window.self !== window.top) {
    window.parent.postMessage({type:'expoMode', text: MODE_LABELS_CN[selMode]}, '*');
  }
});

// ── Retake ──
document.getElementById('btnRetake').addEventListener('click', () => {
  layers.forEach(l => { l.texture.dispose(); });
  layers = [];
  composing = false;
  selMode = 0;
  // Release GPU uniform references
  compositeMat.uniforms.uTexA.value = null;
  compositeMat.uniforms.uTexB.value = null;
  compositeMat.uniforms.uMode.value = 0;
  document.getElementById('modeSlider').value = 0;
  document.getElementById('act').classList.remove('show');
  document.getElementById('modeLabel').textContent = 'EXPO';
  document.getElementById('sBar').style.display = 'none';
  document.getElementById('uploadBtn').classList.remove('on');
  fullQuad.material = displayMat;
  renderer.render(scene, camera3D);
});

// ── Save (Web Share API) ──
document.getElementById('btnSave').addEventListener('click', async () => {
  renderer.render(scene, camera3D);
  const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
  if (navigator.share) {
    try {
      await navigator.share({ files: [new File([blob], 'expo.png', { type: 'image/png' })] });
    } catch(e) {
      const link = document.createElement('a');
      link.download = 'expo-' + Date.now() + '.png';
      link.href = URL.createObjectURL(blob);
      link.click();
    }
  } else {
    const link = document.createElement('a');
    link.download = 'expo-' + Date.now() + '.png';
    link.href = URL.createObjectURL(blob);
    link.click();
  }
});

// ── EXIT ──
document.getElementById('exitBtn').addEventListener('click', () => {
  if (window.self !== window.top) {
    window.parent.postMessage({type:'exit'}, '*');
  }
});

// ── Switch Camera ──
document.getElementById('switchBtn').addEventListener('click', async () => {
  const s = stream;
  if (s) s.getTracks().forEach(t => t.stop());
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  await startCam();
});

// ── Upload Photo ──
document.getElementById('uploadBtn').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = (e) => {
    const file = e.target.files[0];
    document.body.removeChild(input);
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const maxU = 1920;
      const scU = Math.min(1, maxU / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scU); c.height = Math.round(img.height * scU);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.NoColorSpace;
      tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
      layers.push({ texture: tex, canvas: c });
      document.getElementById('uploadBtn').classList.add('on');

      if (layers.length === 1) {
        composing = false;
        compositeMat.uniforms.uTexA.value = null;
        compositeMat.uniforms.uTexB.value = null;
        document.getElementById('modeLabel').textContent = 'EXPO 1/2';
        window.parent.postMessage({type:'expoStatus', text:'EXPO 1/2'}, '*');
        document.getElementById('act').classList.remove('show');
        document.getElementById('sBar').style.display = 'none';
      }

      if (layers.length === 2) {
        composing = true;
        document.getElementById('modeLabel').textContent = 'EXPO ' + MODE_LABELS_CN[getMode()];
        window.parent.postMessage({type:'expoStatus', text:'EXPO ' + MODE_LABELS_CN[getMode()]}, '*');
        document.getElementById('sBar').style.display = 'block';
        document.getElementById('act').classList.add('show');
      }
    };
    img.src = URL.createObjectURL(file);
  };
  input.click();
});

// ── Render loop ──
function render(now) {
  requestAnimationFrame(render);
  if (!composing && (!video || !video.videoWidth)) return;

  if (videoTexture) videoTexture.needsUpdate = true;

  if (composing && layers.length === 2) {
    compositeMat.uniforms.uTexA.value = layers[0].texture;
    compositeMat.uniforms.uTexB.value = layers[1].texture;
    compositeMat.uniforms.uMode.value = selMode;
    fullQuad.material = compositeMat;
  } else {
    displayMat.uniforms.uCamera.value = videoTexture;
    fullQuad.material = displayMat;
  }

  renderer.render(scene, camera3D);
}

// Auto-start camera when embedded in painting-eye
if (window.self !== window.top) startCam();
requestAnimationFrame(render);

addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
</script>
<script>
// Handle postMessage from painting-eye iframe integration
window.addEventListener('message', function(e) {
  if (e.data.type === 'slider') {
    var slider = document.getElementById('modeSlider');
    if (slider) {
      slider.value = Math.round((e.data.value - 1) / 4 * 5);
      slider.dispatchEvent(new Event('input'));
    }
  }
  if (e.data.type === 'capture') {
    var btn = document.getElementById('capBtn');
    if (btn) btn.click();
  }
  if (e.data.type === 'license') {
    try { localStorage.setItem('pe_license', e.data.key); } catch(_) {}
  }
});

// Embedded in painting-eye: hide own UI
if (window.self !== window.top) {
  // Auto-activate from localStorage (set by painting-eye)
  var lic = localStorage.getItem('pe_license');
  if (lic) window.parent.postMessage({type:'license', key:lic}, '*');
  function hideOwnUI(){
    ['perm','modeLabel','sBar','act','bBar'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    // Hide ALL non-canvas elements
    document.querySelectorAll('body > *:not(canvas)').forEach(function(el){
      el.style.display = 'none';
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', hideOwnUI);
  } else {
    hideOwnUI();
  }
}
</script>
</body>
</html>
