<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ink Marbling — 墨流し</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,'PingFang SC',sans-serif}
canvas{display:block;width:100vw;height:100vh}
.toolbar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)}
.toolbar .ink{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.toolbar .ink.on{border-color:#fff}
.toolbar .btn{padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.toolbar .btn:active{background:rgba(255,255,255,.1)}
.toolbar .btn.on{background:#ff3b30;border-color:#ff3b30;color:#fff}
.top-hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,.25);font-size:12px;pointer-events:none;transition:opacity 1s}
.top-hint.hide{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top-hint" id="hint">拖拽生成漩涡 · 点击滴墨</div>
<div class="toolbar">
  <div class="ink on" style="background:#e74c3c" data-color="0"></div>
  <div class="ink" style="background:#3498db" data-color="1"></div>
  <div class="ink" style="background:#f1c40f" data-color="2"></div>
  <div class="ink" style="background:#2ecc71" data-color="3"></div>
  <div class="ink" style="background:#9b59b6" data-color="4"></div>
  <div class="ink" style="background:#e67e22" data-color="5"></div>
  <div class="ink" style="background:#fff" data-color="6"></div>
  <div class="btn" id="autoBtn">自动</div>
  <div class="btn" id="clearBtn">清空</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const VSH='varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
const SIM=256;
const COLORS=[[.906,.235,.235],[.204,.596,.859],[.945,.769,.059],[.18,.8,.443],[.608,.349,.714],[.902,.494,.133],[.95,.95,.95]];
let curC=0,autoM=false;
const ren=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:false});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
function RT(w,h){return new THREE.WebGLRenderTarget(w,h,{type:THREE.FloatType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:false})}
function PR(){return[RT(SIM,SIM),RT(SIM,SIM)]}
let vel=PR(),dye=PR(),tmp=RT(SIM,SIM),pr=PR(),ri=0;
function sw(){return 1-ri}
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const q=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null);
const s=new THREE.Scene();s.add(q);
function setMat(m){q.material=m;}
// Shaders
const aVelM=new THREE.ShaderMaterial({uniforms:{uV:{value:null},uS:{value:null},uR:{value:new THREE.Vector2(SIM,SIM)},uD:{value:.016},uDiss:{value:.98}},vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;uniform sampler2D uV,uS;uniform vec2 uR;uniform float uD,uDiss;void main(){vec2 d=uD*uR;vec2 uv=v-d*texture2D(uV,v).xy;gl_FragColor=uDiss*texture2D(uS,clamp(uv,0.0,1.0));}'});
const aDyM=new THREE.ShaderMaterial({uniforms:{uV:{value:null},uS:{value:null},uR:{value:new THREE.Vector2(SIM,SIM)},uD:{value:.016},uDiss:{value:.985}},vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;uniform sampler2D uV,uS;uniform vec2 uR;uniform float uD,uDiss;void main(){vec2 d=uD*uR;vec2 uv=v-d*texture2D(uV,v).xy;gl_FragColor=uDiss*texture2D(uS,clamp(uv,0.0,1.0));}'});
const vorM=new THREE.ShaderMaterial({uniforms:{uV:{value:null},uR:{value:new THREE.Vector2(SIM,SIM)},uD:{value:.016},uStr:{value:1.0}},vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;uniform sampler2D uV;uniform vec2 uR;uniform float uD,uStr;void main(){vec2 o=1.0/uR;float wl=texture2D(uV,v-vec2(o.x,0.0)).y,wr=texture2D(uV,v+vec2(o.x,0.0)).y;float wb=texture2D(uV,v-vec2(0.0,o.y)).x,wt=texture2D(uV,v+vec2(0.0,o.y)).x;float vort=wr-wl+wt-wb;vec2 g=vec2(abs(wt)-abs(wb),abs(wr)-abs(wl))*0.5;float l=length(g);vec2 f=l>0.001?normalize(g)*vort*uStr:vec2(0.0);vec2 vel=texture2D(uV,v).xy;gl_FragColor=vec4(vel+f*uD,0.0,0.0);}'});
const difM=new THREE.ShaderMaterial({uniforms:{uV:{value:null},uR:{value:new THREE.Vector2(SIM,SIM)},uA:{value:.001},uB:{value:4.0}},vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;uniform sampler2D uV;uniform vec2 uR;uniform float uA,uB;void main(){vec2 o=1.0/uR;vec2 vl=texture2D(uV,v-vec2(o.x,0.0)).xy,vr=texture2D(uV,v+vec2(o.x,0.0)).xy;vec2 vb=texture2D(uV,v-vec2(0.0,o.y)).xy,vt=texture2D(uV,v+vec2(0.0,o.y)).xy;vec2 vc=texture2D(uV,v).xy;gl_FragColor=vec4((vc+uA*(vl+vr+vb+vt))/uB,0.0,0.0);}'});
const divM=new THREE.ShaderMaterial({uniforms:{uV:{value:null},uR:{value:new THREE.Vector2(SIM,SIM)}},vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;uniform sampler2D uV;uniform vec2 uR;void main(){vec2 o=1.0/uR;float vl=texture2D(uV,v-vec2(o.x,0.0)).x,vr=texture2D(uV,v+vec2(o.x,0.0)).x;float vb=texture2D(uV,v-vec2(0.0,o.y)).y,vt=texture2D(uV,v+vec2(0.0,o.y)).y;gl_FragColor=vec4((vr-vl+vt-vb)*0.5,0.0,0.0,0.0);}'});
const prM=new THREE.ShaderMaterial({uniforms:{uP:{value:null},uDiv:{value:null},uR:{value:new THREE.Vector2(SIM,SIM)}},vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;uniform sampler2D uP,uDiv;uniform vec2 uR;void main(){vec2 o=1.0/uR;float pl=texture2D(uP,v-vec2(o.x,0.0)).x,pr=texture2D(uP,v+vec2(o.x,0.0)).x;float pb=texture2D(uP,v-vec2(0.0,o.y)).x,pt=texture2D(uP,v+vec2(0.0,o.y)).x;float d=texture2D(uDiv,v).x;gl_FragColor=vec4((pl+pr+pb+pt-d)*0.25,0.0,0.0,0.0);}'});
const pjM=new THREE.ShaderMaterial({uniforms:{uV:{value:null},uP:{value:null},uR:{value:new THREE.Vector2(SIM,SIM)}},vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;uniform sampler2D uV,uP;uniform vec2 uR;void main(){vec2 o=1.0/uR;vec2 v2=texture2D(uV,v).xy;float pl=texture2D(uP,v-vec2(o.x,0.0)).x,pr=texture2D(uP,v+vec2(o.x,0.0)).x;float pb=texture2D(uP,v-vec2(0.0,o.y)).x,pt=texture2D(uP,v+vec2(0.0,o.y)).x;gl_FragColor=vec4(v2-vec2(pr-pl,pt-pb)*0.5,0.0,0.0);}'});
const dspM=new THREE.ShaderMaterial({uniforms:{uD:{value:null}},vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;uniform sampler2D uD;void main(){vec3 c=texture2D(uD,v).rgb;gl_FragColor=vec4(mix(vec3(0.067,0.067,0.067),c,0.9+0.1*length(c)),1.0);}'});
const spM=new THREE.ShaderMaterial({uniforms:{uT:{value:null},uPos:{value:new THREE.Vector2(0.5,0.5)},uC:{value:new THREE.Vector3(1,0,0)},uRad:{value:0.03},uStr:{value:1.0},uIsV:{value:0}},vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;uniform sampler2D uT;uniform vec2 uPos;uniform vec3 uC;uniform float uRad,uStr;uniform int uIsV;void main(){vec4 cur=texture2D(uT,v);float d=length(v-uPos);float w=exp(-d*d/(uRad*uRad));if(uIsV==1){vec2 dir=normalize(v-uPos)*2.0;vec2 f=dir*w*uStr;gl_FragColor=vec4(cur.xy+f,0.0,0.0);}else{gl_FragColor=vec4(mix(cur.rgb,uC,w*uStr),cur.a);}}'});
const clrM=new THREE.ShaderMaterial({vertexShader:VSH,fragmentShader:'precision highp float;varying vec2 v;void main(){gl_FragColor=vec4(0.0);}'});
const clrS=new THREE.Scene();clrS.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),clrM));
function clearAll(){ren.setRenderTarget(null);setMat(clrM);[vel,dye,tmp,pr].flat().forEach(function(t){ren.setRenderTarget(t);ren.render(s,cam);});ren.setRenderTarget(null);}
clearAll();
// Splat helpers
function splat(x,y,r,s,c){
  var px=x/innerWidth,py=1-y/innerHeight;
  var col=COLORS[c];
  spM.uniforms.uT.value=dye[ri].texture;
  spM.uniforms.uPos.value.set(px,py);
  spM.uniforms.uC.value.set(col[0],col[1],col[2]);
  spM.uniforms.uRad.value=r;spM.uniforms.uStr.value=s*0.4;spM.uniforms.uIsV.value=0;
  setMat(spM);ren.setRenderTarget(dye[sw()]);ren.render(s,cam);ri=1-ri;
  spM.uniforms.uT.value=vel[ri].texture;
  spM.uniforms.uStr.value=s*0.15;spM.uniforms.uIsV.value=1;
  setMat(spM);ren.setRenderTarget(vel[sw()]);ren.render(s,cam);ri=1-ri;
}
function force(x,y,dx,dy,s){
  var px=x/innerWidth,py=1-y/innerHeight;
  spM.uniforms.uT.value=vel[ri].texture;
  spM.uniforms.uPos.value.set(px,py);
  spM.uniforms.uC.value.set(dx*s/innerWidth,-dy*s/innerHeight,0);
  spM.uniforms.uRad.value=0.025;spM.uniforms.uStr.value=1.0;spM.uniforms.uIsV.value=1;
  setMat(spM);ren.setRenderTarget(vel[sw()]);ren.render(s,cam);ri=1-ri;
  var col=COLORS[curC];
  spM.uniforms.uT.value=dye[ri].texture;
  spM.uniforms.uC.value.set(col[0],col[1],col[2]);
  spM.uniforms.uRad.value=0.012;spM.uniforms.uStr.value=0.12;spM.uniforms.uIsV.value=0;
  setMat(spM);ren.setRenderTarget(dye[sw()]);ren.render(s,cam);ri=1-ri;
}
// Simulation step
function step(dt){
  // 1. Advect vel
  aVelM.uniforms.uD.value=dt;
  aVelM.uniforms.uV.value=vel[ri].texture;
  aVelM.uniforms.uS.value=vel[ri].texture;
  setMat(aVelM);ren.setRenderTarget(vel[sw()]);ren.render(s,cam);ri=1-ri;
  // 2. Vorticity
  vorM.uniforms.uD.value=dt;
  vorM.uniforms.uV.value=vel[ri].texture;
  setMat(vorM);ren.setRenderTarget(vel[sw()]);ren.render(s,cam);ri=1-ri;
  // 3. Diffuse velocity
  for(var i=0;i<2;i++){
    difM.uniforms.uV.value=vel[ri].texture;
    setMat(difM);ren.setRenderTarget(vel[sw()]);ren.render(s,cam);ri=1-ri;
  }
  // 4. Divergence
  divM.uniforms.uV.value=vel[ri].texture;
  setMat(divM);ren.setRenderTarget(tmp);ren.render(s,cam);
  // 5. Pressure solve (8 Jacobi)
  setMat(clrM);ren.setRenderTarget(pr[0]);ren.render(s,cam);
  for(var i=0;i<8;i++){
    prM.uniforms.uP.value=pr[0].texture;
    prM.uniforms.uDiv.value=tmp.texture;
    setMat(prM);ren.setRenderTarget(pr[1]);ren.render(s,cam);
    var t=pr[0];pr[0]=pr[1];pr[1]=t;
  }
  // 6. Project
  pjM.uniforms.uV.value=vel[ri].texture;
  pjM.uniforms.uP.value=pr[0].texture;
  setMat(pjM);ren.setRenderTarget(vel[sw()]);ren.render(s,cam);ri=1-ri;
  // 7. Advect dye
  aDyM.uniforms.uD.value=dt;
  aDyM.uniforms.uV.value=vel[ri].texture;
  aDyM.uniforms.uS.value=dye[ri].texture;
  setMat(aDyM);ren.setRenderTarget(dye[sw()]);ren.render(s,cam);ri=1-ri;
  // 8. Display
  dspM.uniforms.uD.value=dye[ri].texture;
  setMat(dspM);ren.setRenderTarget(null);ren.render(s,cam);
}
// Interaction
var down=false,lx=0,ly=0,timer=0;
document.getElementById('c').addEventListener('pointerdown',function(e){
  down=true;lx=e.clientX;ly=e.clientY;
  splat(e.clientX,e.clientY,0.04,0.5,curC);
  document.getElementById('hint').classList.add('hide');
});
document.getElementById('c').addEventListener('pointermove',function(e){
  if(!down)return;
  var dx=e.clientX-lx,dy=e.clientY-ly;
  if(Math.abs(dx)+Math.abs(dy)>3){force(e.clientX,e.clientY,dx,dy,2);lx=e.clientX;ly=e.clientY;}
});
document.getElementById('c').addEventListener('pointerup',function(){down=false;});
document.getElementById('c').addEventListener('pointerleave',function(){down=false;});
// Toolbar
document.querySelectorAll('.ink').forEach(function(el){
  el.addEventListener('click',function(){
    document.querySelectorAll('.ink').forEach(function(e){e.classList.remove('on');});
    el.classList.add('on');curC=parseInt(el.dataset.color);
  });
});
document.getElementById('autoBtn').addEventListener('click',function(){autoM=!autoM;document.getElementById('autoBtn').classList.toggle('on');});
document.getElementById('clearBtn').addEventListener('click',clearAll);
// Initial drops
for(var i=0;i<6;i++){(function(i){setTimeout(function(){var x=Math.random()*innerWidth*0.6+innerWidth*0.2,y=Math.random()*innerHeight*0.6+innerHeight*0.2;splat(x,y,0.05,0.6,i%7);},i*300);})(i);}
// Loop
var lt=performance.now();
(function L(){
  try {
  var n=performance.now(),dt=Math.min((n-lt)/1000,0.05);lt=n;
  if(autoM){
    timer+=dt;
    if(timer>1.5){timer=0;var x=Math.random()*innerWidth*0.6+innerWidth*0.2,y=Math.random()*innerHeight*0.6+innerHeight*0.2;splat(x,y,0.03+0.04*Math.random(),0.3+0.5*Math.random(),curC);force(x,y,(Math.random()-0.5)*100,(Math.random()-0.5)*100,1.5+Math.random());curC=(curC+1)%7;document.querySelectorAll('.ink').forEach(function(e,i){e.classList.toggle('on',i===curC);});}
  }
  step(dt);
  }catch(e){console.error('LOOP:',e.message,e.stack);}
  requestAnimationFrame(L);
})();
window.addEventListener('resize',function(){ren.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
