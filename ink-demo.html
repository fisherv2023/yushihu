<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ink Marbling — 墨流し</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#111}
canvas{display:block;width:100vw;height:100vh}
.toolbar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)}
.toolbar .c{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.toolbar .c.on{border-color:#fff}
.toolbar .btn{padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;white-space:nowrap}
.toolbar .btn:active{background:rgba(255,255,255,.1)}
.toolbar .btn.on{background:#ff3b30;border-color:#ff3b30;color:#fff}
.hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,.2);font-size:12px;pointer-events:none;transition:opacity 1s}
.hint.h{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="h">拖拽 · 点击滴墨</div>
<div class="toolbar">
  <div class="c on" style="background:#e74c3c"></div>
  <div class="c" style="background:#3498db"></div>
  <div class="c" style="background:#f1c40f"></div>
  <div class="c" style="background:#2ecc71"></div>
  <div class="c" style="background:#9b59b6"></div>
  <div class="c" style="background:#e67e22"></div>
  <div class="c" style="background:#fff"></div>
  <div class="btn" id="a">自动</div>
  <div class="btn" id="r">清空</div>
</div>
<script>
const S=256,W=innerWidth,H=innerHeight;
const CV=document.getElementById('c');
const CX=CV.getContext('2d');
CV.width=W;CV.height=H;
// Simulation buffers (offscreen)
const B=document.createElement('canvas');B.width=S;B.height=S;
const BC=B.getContext('2d');
const DI=BC.createImageData(S,S);
const DP=DI.data;
// Velocity fields (two copies for ping-pong)
let V0=new Float32Array(S*S*2);
let V1=new Float32Array(S*S*2);
// Dye image
const D=BC.createImageData(S,S);
const P=D.data;
for(let i=3;i<P.length;i+=4)P[i]=255;
// Color presets
const CL=[[.906,.235,.235],[.204,.596,.859],[.945,.769,.059],[.18,.8,.443],[.608,.349,.714],[.902,.494,.133],[.95,.95,.95]];
let CC=0,AM=false,V=V0;
function IX(x,y){return(y*S+x)*2;}
function CP(v){return v<0?0:v>255?255:v|0}
// Ink drop
function INK(cx,cy,r,s,ci){
  const col=CL[ci%CL.length];
  const r2=r*r;
  for(let y=Math.max(0,cy-r|0);y<Math.min(S,cy+r+1|0);y++){
    for(let x=Math.max(0,cx-r|0);x<Math.min(S,cx+r+1|0);x++){
      const dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;
      if(d2>r2)continue;
      const w=Math.exp(-d2/r2*4);
      const pi=(y*S+x)*4;
      P[pi]=CP(P[pi]*(1-w*s)+col[0]*255*w*s);
      P[pi+1]=CP(P[pi+1]*(1-w*s)+col[1]*255*w*s);
      P[pi+2]=CP(P[pi+2]*(1-w*s)+col[2]*255*w*s);
    }
  }
}
// Force
function FR(cx,cy,fx,fy,s){
  const r=10,r2=r*r;
  for(let y=Math.max(0,cy-r|0);y<Math.min(S,cy+r+1|0);y++){
    for(let x=Math.max(0,cx-r|0);x<Math.min(S,cx+r+1|0);x++){
      const dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;
      if(d2>r2)continue;
      const w=Math.exp(-d2/r2*3);
      const vi=IX(x,y);
      V[vi]+=fx*w*s;V[vi+1]+=fy*w*s;
    }
  }
  INK(cx,cy,4,0.05,CC);
}
// Fluid step
function STEP(){
  // Advection (back-trace)
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const vi=IX(x,y);
    const sx=Math.max(0,Math.min(S-1,x-V[vi]*0.4));
    const sy=Math.max(0,Math.min(S-1,y-V[vi+1]*0.4));
    const si=IX(sx|0,sy|0);
    V1[vi]=V0[si]*0.985;V1[vi+1]=V0[si+1]*0.985;
  }
  let t=V0;V0=V1;V1=t;V=V0;
  // Diffusion (blur velocity)
  for(let p=0;p<2;p++){
    for(let y=1;y<S-1;y++)for(let x=1;x<S-1;x++){
      const vi=IX(x,y);
      let sx=0,sy=0,c=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const ni=IX(x+dx,y+dy);
        sx+=V0[ni];sy+=V0[ni+1];c++;
      }
      V1[vi]=sx/c*0.998;V1[vi+1]=sy/c*0.998;
    }
    t=V0;V0=V1;V1=t;V=V0;
  }
  // Divergence-free projection
  for(let it=0;it<3;it++){
    for(let y=1;y<S-1;y++)for(let x=1;x<S-1;x++){
      const vi=IX(x,y);
      const div=(V0[IX(x+1,y)]-V0[IX(x-1,y)]+V0[IX(x,y+1)+1]-V0[IX(x,y-1)+1])*0.25;
      // Correct the cell velocity to reduce divergence
      V0[vi]-=div*0.5;V0[vi+1]-=div*0.5;
      const ni=IX(x+1,y);
      V0[ni]+=div*0.25;
      V0[ni+1]+=0;
      const pi=IX(x,y+1);
      V0[pi]+=0;
      V0[pi+1]+=div*0.25;
    }
  }
  // Advect dye
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const vi=IX(x,y);
    const sx=Math.max(0,Math.min(S-1,x-V[vi]*0.3));
    const sy=Math.max(0,Math.min(S-1,y-V[vi+1]*0.3));
    const si=((sy|0)*S+(sx|0))*4;
    const di=(y*S+x)*4;
    DP[di]=P[si];DP[di+1]=P[si+1];DP[di+2]=P[si+2];DP[di+3]=255;
  }
  // Copy dye with slight dissipation
  for(let i=0;i<P.length;i+=4){
    P[i]=DP[i]*0.995;P[i+1]=DP[i+1]*0.995;P[i+2]=DP[i+2]*0.995;
  }
  // Render to screen (upscale with nearest-neighbor)
  BC.putImageData(D,0,0);
  CX.imageSmoothingEnabled=false;
  CX.drawImage(B,0,0,W,H);
}
// Clear
function CLR(){
  V0.fill(0);V1.fill(0);V=V0;
  for(let i=0;i<P.length;i+=4){P[i]=0;P[i+1]=0;P[i+2]=0;}
}
// Interaction
let dn=false,lx=0,ly=0;
CV.addEventListener('pointerdown',e=>{
  dn=true;lx=e.clientX;ly=e.clientY;
  INK(e.clientX/S*W|0,e.clientY/S*H|0,8,0.6,CC);
  document.getElementById('h').classList.add('h');
});
CV.addEventListener('pointermove',e=>{
  if(!dn)return;
  const dx=e.clientX-lx,dy=e.clientY-ly;
  if(Math.abs(dx)+Math.abs(dy)>2){
    FR(lx/S*W|0,ly/S*H|0,dx,dy,0.15);
    lx=e.clientX;ly=e.clientY;
  }
});
CV.addEventListener('pointerup',()=>{dn=false;});
CV.addEventListener('pointerleave',()=>{dn=false;});
// Toolbar
document.querySelectorAll('.c').forEach((el,i)=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.c').forEach(e=>e.classList.remove('on'));
    el.classList.add('on');CC=i;
  });
});
document.getElementById('a').addEventListener('click',()=>{AM=!AM;document.getElementById('a').classList.toggle('on');});
document.getElementById('r').addEventListener('click',CLR);
// Initial
CLR();
for(let i=0;i<5;i++){let t=i;setTimeout(()=>{const x=Math.random()*S*.6+S*.2,y=Math.random()*S*.6+S*.2;INK(x,y,12,0.6,i);},t*400);}
// Loop
let lt=performance.now(),tm=0;
(function L(){
  const n=performance.now(),dt=Math.min((n-lt)/1000,.033);lt=n;
  if(AM){
    tm+=dt;
    if(tm>1.2){tm=0;const x=Math.random()*S*.6+S*.2,y=Math.random()*S*.6+S*.2;INK(x,y,8+6*Math.random(),.3+.5*Math.random(),CC);FR(x,y,(Math.random()-.5)*20,(Math.random()-.5)*20,.12);CC=(CC+1)%7;document.querySelectorAll('.c').forEach((e,i)=>e.classList.toggle('on',i===CC));}
  }
  STEP();
  requestAnimationFrame(L);
})();
window.addEventListener('resize',()=>{CV.width=innerWidth;CV.height=innerHeight;});
</script>
</body>
</html>
