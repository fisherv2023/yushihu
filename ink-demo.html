<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ink Marbling — 墨流し</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.tb{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)}
.tb .c{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.tb .c.on{border-color:#fff}
.tb .b{padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;white-space:nowrap}
.tb .b:active{background:rgba(255,255,255,.1)}
.tb .b.on{background:#ff3b30;border-color:#ff3b30;color:#fff}
.h{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;color:rgba(255,255,255,.2);font-size:12px;pointer-events:none}
</style>
</head>
<body>
<canvas></canvas>
<div class="h" id="h">拖拽漩涡 · 点击滴墨</div>
<div class="tb">
  <div class="c on" style="background:#e74c3c"></div>
  <div class="c" style="background:#3498db"></div>
  <div class="c" style="background:#f1c40f"></div>
  <div class="c" style="background:#2ecc71"></div>
  <div class="c" style="background:#9b59b6"></div>
  <div class="c" style="background:#e67e22"></div>
  <div class="c" style="background:#fff"></div>
  <div class="b" id="a">自动</div>
  <div class="b" id="r">清空</div>
</div>

<script>const dat={GUI:function(){return{add:function(){return this},addFolder:function(){return this}}}};</script>
<script src="fluid-sim.js"></script>
<script>
// Color palette
var COL = [
  [255,80,40], [40,140,255], [255,210,0],
  [0,210,120], [170,30,255], [255,120,10],
  [255,255,255]
];
var CI=0, AM=false;

// Approximate generateColor (original uses HSV to RGB)
function generateColor() {
  var c = COL[CI];
  return {r:c[0]/255, g:c[1]/255, b:c[2]/255};
}

// Toolbar
document.querySelectorAll('.c').forEach(function(el,i){
  el.addEventListener('click',function(e){
    e.stopPropagation();
    CI=i;
    document.querySelectorAll('.c').forEach(function(x){x.classList.remove('on');});
    el.classList.add('on');
    document.getElementById('h').style.opacity=0;
  });
});

document.getElementById('a').addEventListener('click',function(e){
  e.stopPropagation(); AM=!AM;
  document.getElementById('a').classList.toggle('on',AM);
});

document.getElementById('r').addEventListener('click',function(e){
  e.stopPropagation(); location.reload();
});

// Auto mode — inject random splats + cycle colors
var AT=0, origRAF=requestAnimationFrame;
requestAnimationFrame=function(cb){
  if(AM){
    if(++AT>80){AT=0;
      CI=(CI+1)%COL.length;
      document.querySelectorAll('.c').forEach(function(x,i){x.classList.toggle('on',i===CI);});
      splatStack.push(parseInt(Math.random()*3)+2);
    }
  }
  origRAF.call(window,cb);
};

// Hide hint on interaction
(function(){
  var f=function(){document.getElementById('h').style.opacity=0;};
  document.addEventListener('pointerdown',f,{once:true});
})();
</script>
</body>
</html>
