<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ink Marbling — 墨流し</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.tb{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)}
.tb .c{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.tb .c.on{border-color:#fff}
.tb .b{padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;white-space:nowrap}
.tb .b:active{background:rgba(255,255,255,.1)}
.tb .b.on{background:#ff3b30;border-color:#ff3b30;color:#fff}
.h{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,.2);font-size:12px;pointer-events:none}
.h.hide{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="h" id="h">拖拽漩涡 · 点击滴墨</div>
<div class="tb">
  <div class="c on" style="background:#e74c3c"></div><div class="c" style="background:#3498db"></div>
  <div class="c" style="background:#f1c40f"></div><div class="c" style="background:#2ecc71"></div>
  <div class="c" style="background:#9b59b6"></div><div class="c" style="background:#e67e22"></div>
  <div class="c" style="background:#fff"></div>
  <div class="b" id="a">自动</div><div class="b" id="r">清空</div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
const S=256,W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:false});
r.setSize(W,H);r.setPixelRatio(Math.min(devicePixelRatio,2));
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const sc=new THREE.Scene();const me=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null);sc.add(me);
function use(m){me.material=m;}
const VS='varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
function mat(fs,us){return new THREE.ShaderMaterial({uniforms:us,vertexShader:VS,fragmentShader:'precision highp float;varying vec2 v;'+fs});}
const RT=(w,h)=>new THREE.WebGLRenderTarget(w,h,{type:THREE.FloatType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:false});
const PR=()=>[RT(S,S),RT(S,S)];
let V0=PR(),V1=PR(),D0=PR(),D1=PR(),TMP=RT(S,S),PS0=RT(S,S),PS1=RT(S,S);
const R2=new THREE.Vector2(S,S);
// Advection: reads vel from A, reads source from B, writes to output
const ad=mat('uniform sampler2D A,B;uniform vec2 R;uniform float D;void main(){vec2 uv=v-D*R*texture2D(A,v).xy;gl_FragColor=texture2D(B,clamp(uv,0.,1.));}',{A:{value:null},B:{value:null},R:{value:R2},D:{value:.016}});
// Vorticity
const vo=mat('uniform sampler2D A;uniform vec2 R;uniform float S;void main(){vec2 o=1./R;float L=texture2D(A,v-vec2(o.x,0.)).y,R=texture2D(A,v+vec2(o.x,0.)).y,B=texture2D(A,v-vec2(0.,o.y)).x,T=texture2D(A,v+vec2(0.,o.y)).x;float vr=R-L+T-B;vec2 g=vec2(abs(T)-abs(B),abs(R)-abs(L));vec2 f=length(g)>.001?normalize(g)*vr*S:vec2(0.);gl_FragColor=vec4(texture2D(A,v).xy+f,0.,0.);}',{A:{value:null},R:{value:R2},S:{value:2.0}});
// Divergence
const di=mat('uniform sampler2D A;uniform vec2 R;void main(){vec2 o=1./R;gl_FragColor=vec4(.5*(texture2D(A,v+vec2(o.x,0.)).x-texture2D(A,v-vec2(o.x,0.)).x+texture2D(A,v+vec2(0.,o.y)).y-texture2D(A,v-vec2(0.,o.y)).y),0.,0.,0.);}',{A:{value:null},R:{value:R2}});
// Pressure Jacobi
const pj=mat('uniform sampler2D A,B;uniform vec2 R;void main(){vec2 o=1./R;float p=(texture2D(A,v+vec2(o.x,0.)).x+texture2D(A,v-vec2(o.x,0.)).x+texture2D(A,v+vec2(0.,o.y)).x+texture2D(A,v-vec2(0.,o.y)).x-texture2D(B,v).x)*.25;gl_FragColor=vec4(p,0.,0.,0.);}',{A:{value:null},B:{value:null},R:{value:R2}});
// Project
const pc=mat('uniform sampler2D A,B;uniform vec2 R;void main(){vec2 o=1./R;vec2 v2=texture2D(A,v).xy;float L=texture2D(B,v-vec2(o.x,0.)).x,R=texture2D(B,v+vec2(o.x,0.)).x,B=texture2D(B,v-vec2(0.,o.y)).x,T=texture2D(B,v+vec2(0.,o.y)).x;gl_FragColor=vec4(v2-vec2(R-L,T-B)*.5,0.,0.);}',{A:{value:null},B:{value:null},R:{value:R2}});
// Display
const dp=mat('uniform sampler2D A;void main(){vec3 c=texture2D(A,v).rgb;gl_FragColor=vec4(mix(vec3(.05),c*1.2,min(1.,length(c)*2.)),1.);}',{A:{value:null}});
// Clear
const cl=mat('void main(){gl_FragColor=vec4(0.);}',{});
const cS=new THREE.Scene();cS.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),cl));
function clear(){use(cl);[V0,V1,D0,D1,TMP,PS0,PS1].forEach(t=>{r.setRenderTarget(t);r.render(cS,cam);});r.setRenderTarget(null);use(dp);}
clear();
// Ink splat
const ik=mat('uniform sampler2D A;uniform vec2 B;uniform vec3 C;uniform float D,E;void main(){vec4 c=texture2D(A,v);float d=length(v-B);float w=exp(-d*d/(D*D));gl_FragColor=vec4(mix(c.rgb,C,w*E),1.);}',{A:{value:null},B:{value:new THREE.Vector2(.5,.5)},C:{value:new THREE.Vector3(1,0,0)},D:{value:.03},E:{value:.5}});
// Force splat
const fc=mat('uniform sampler2D A;uniform vec2 B,C;uniform float D,E;void main(){vec4 cv=texture2D(A,v);float d=length(v-B);float w=exp(-d*d/(D*D));gl_FragColor=vec4(cv.xy+C*w*E,0.,0.);}',{A:{value:null},B:{value:new THREE.Vector2(.5,.5)},C:{value:new THREE.Vector2(0,0)},D:{value:.03},E:{value:.5}});

const CL=[[.906,.235,.235],[.204,.596,.859],[.945,.769,.059],[.18,.8,.443],[.608,.349,.714],[.902,.494,.133],[.95,.95,.95]];
let CC=0,AM=false,DN=false,LX=0,LY=0,AT=0;
// step — uses dedicated ping-pong: V0↔V1 for velocity, D0↔D1 for dye
let Vr=0,Vw=1,Dr=0,Dw=1;
function step(){
  // Advect velocity: Vr→Vw, swap
  ad.uniforms.A.value=V0.texture;ad.uniforms.B.value=Vr?V1.texture:V0.texture;
  use(ad);r.setRenderTarget(Vw?V1:V0);r.render(sc,cam);
  // Vorticity on Vw
  vo.uniforms.A.value=Vw?V1.texture:V0.texture;
  use(vo);r.setRenderTarget(Vr?V1:V0);r.render(sc,cam);
  // Divergence of Vr
  di.uniforms.A.value=Vr?V1.texture:V0.texture;
  use(di);r.setRenderTarget(TMP);r.render(sc,cam);
  // Pressure solve
  use(cl);r.setRenderTarget(PS0);r.render(cS,cam);
  for(let i=0;i<15;i++){
    pj.uniforms.A.value=PS0.texture;pj.uniforms.B.value=TMP.texture;
    use(pj);r.setRenderTarget(PS1);r.render(sc,cam);
    let t=PS0;PS0=PS1;PS1=t;
  }
  // Project: Vr with pressure → Vw
  pc.uniforms.A.value=Vr?V1.texture:V0.texture;pc.uniforms.B.value=PS0.texture;
  use(pc);r.setRenderTarget(Vw?V1:V0);r.render(sc,cam);
  // Swap Vr↔Vw (velocity is now in what was Vw)
  let t=Vr;Vr=Vw;Vw=t;
  // Advect dye: Dr using Vr → Dw, swap
  ad.uniforms.A.value=Vr?V1.texture:V0.texture;
  ad.uniforms.B.value=Dr?D1.texture:D0.texture;
  use(ad);r.setRenderTarget(Dw?D1:D0);r.render(sc,cam);
  t=Dr;Dr=Dw;Dw=t;
  // Display Dr
  dp.uniforms.A.value=Dr?D1.texture:D0.texture;
  use(dp);r.setRenderTarget(null);r.render(sc,cam);
}
// Splat: add to D0+D1 and V0+V1 (no swap tracking needed since we write in-place-ish)
function ink(x,y,rd,st,ci){
  const px=x/W,py=1-y/H,c=CL[ci%CL.length];
  // Write new ink to BOTH dye buffers (so either Dr/Dw can read it)
  ik.uniforms.A.value=D0.texture;ik.uniforms.B.value.set(px,py);
  ik.uniforms.C.value.set(c[0],c[1],c[2]);ik.uniforms.D.value=rd;ik.uniforms.E.value=st;
  use(ik);r.setRenderTarget(D1);r.render(sc,cam);
  // Write to both velocity buffers
  fc.uniforms.A.value=V0.texture;fc.uniforms.B.value.set(px,py);
  fc.uniforms.D.value=rd*.6;fc.uniforms.E.value=st*.15;
  use(fc);r.setRenderTarget(V1);r.render(sc,cam);
}
function force(x,y,dx,dy,s){
  const px=x/W,py=1-y/H;
  fc.uniforms.A.value=V0.texture;fc.uniforms.B.value.set(px,py);
  fc.uniforms.C.value.set(dx*s/W,-dy*s/H);fc.uniforms.D.value=.02;fc.uniforms.E.value=1.;
  use(fc);r.setRenderTarget(V1);r.render(sc,cam);
  const c=CL[CC];
  ik.uniforms.A.value=D0.texture;ik.uniforms.B.value.set(px,py);
  ik.uniforms.C.value.set(c[0],c[1],c[2]);ik.uniforms.D.value=.015;ik.uniforms.E.value=.15;
  use(ik);r.setRenderTarget(D1);r.render(sc,cam);
}
// Events
document.getElementById('c').addEventListener('pointerdown',e=>{
  DN=true;LX=e.clientX;LY=e.clientY;ink(LX,LY,.04,.5,CC);
  document.getElementById('h').classList.add('hide');
});
document.getElementById('c').addEventListener('pointermove',e=>{
  if(!DN)return;
  const dx=e.clientX-LX,dy=e.clientY-LY;
  if(Math.abs(dx)+Math.abs(dy)>2){force(LX,LY,dx,dy,1.5);LX=e.clientX;LY=e.clientY;}
});
['pointerup','pointerleave'].forEach(ev=>document.getElementById('c').addEventListener(ev,()=>{DN=false;}));
// Toolbar
document.querySelectorAll('.c').forEach((el,i)=>el.addEventListener('click',()=>{
  document.querySelectorAll('.c').forEach(e=>e.classList.remove('on'));el.classList.add('on');CC=i;
}));
document.getElementById('a').addEventListener('click',()=>{AM=!AM;document.getElementById('a').classList.toggle('on',AM);});
document.getElementById('r').addEventListener('click',clear);
// Init
function initDrops(){for(let i=0;i<6;i++)setTimeout(()=>{ink(Math.random()*W*.6+W*.2,Math.random()*H*.6+H*.2,.05,.6,i);},i*300);}
initDrops();
// Render loop
let LT=performance.now();
(function L(){
  const n=performance.now(),dt=Math.min((n-LT)/1000,.033);LT=n;
  ad.uniforms.D.value=dt;
  if(AM){AT+=dt;if(AT>1.2){AT=0;ink(Math.random()*W*.6+W*.2,Math.random()*H*.6+H*.2,.04,.4,CC);CC=(CC+1)%7;document.querySelectorAll('.c').forEach((e,i)=>e.classList.toggle('on',i===CC));}}
  step();
  requestAnimationFrame(L);
})();
window.addEventListener('resize',()=>r.setSize(innerWidth,innerHeight));
</script>
</body>
</html>
