<!DOCTYPE html>

<style>

canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
.perm{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);backdrop-filter:blur(20px)}

.panel{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.12)}
.panel button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}

<body>
<canvas id="c"></canvas>
<div class="perm" id="perm">
  <div class="title">Ink Flow</div>
  <div class="desc">GPU fluid simulation — edges bleed ink</div>
  <button class="btn" id="permBtn">Allow Camera</button>
</div>
<div class="status" id="status"></div>
<div class="panel" id="panel" style="display:none">
  <button id="btnSave" title="保存">⤓</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ════════════════════════════════════════════
   Ink Flow v2 — Edge-driven Stable Fluids
   Camera edges → continuous dye + velocity bleed
   ════════════════════════════════════════════ */

const CFG = {
  SIM_RES: 128,
  DYE_MAX: 512,
  PRESSURE_ITER: 20,
  VEL_DISSIPATION: 0.25,
  DYE_DISSIPATION: 0.005,
  CURL: 14,
  SPLAT_RADIUS: 0.004,
  SPLAT_FORCE: 4000,
  EDGE_DYE: 0.5,          // edge → dye strength
  EDGE_VEL: 3.5,          // edge → perpendicular velocity
  DARK_DYE: 0.15,         // dark areas → dye
};

const PAPER = new THREE.Color('#efeae0');
const INK_COLORS = {
  sumi:    new THREE.Color('#1a1a1f'),
  shu:     new THREE.Color('#c8372d'),
  ai:      new THREE.Color('#16407a'),
  matsuba: new THREE.Color('#2e6e52'),
};

function inkAbsorption(c, strength) {
  const e = 0.012;
  return new THREE.Vector3(
    -Math.log(Math.max(c.r, e)) * strength,
    -Math.log(Math.max(c.g, e)) * strength,
    -Math.log(Math.max(c.b, e)) * strength
  );
}

// ── Renderer ──
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true, antialias: false, alpha: false, depth: false, stencil: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;

const camera3D = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const scene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
scene.add(quad);

// ── FBO helpers ──
function makeRT(w, h) {
  return new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
    format: THREE.RGBAFormat, type: THREE.HalfFloatType, depthBuffer: false,
  });
}
function makeDoubleFBO(w, h) {
  return {
    read: makeRT(w, h), write: makeRT(w, h),
    texel: new THREE.Vector2(1 / w, 1 / h),
    swap() { const t = this.read; this.read = this.write; this.write = t; },
    resize(nw, nh) { this.read.setSize(nw, nh); this.write.setSize(nw, nh); this.texel.set(1 / nw, 1 / nh); },
  };
}

function simSizes() {
  const aspect = innerWidth / innerHeight;
  const sim = CFG.SIM_RES;
  const dm = Math.min(CFG.DYE_MAX, Math.max(innerWidth, innerHeight));
  return aspect >= 1
    ? { sw: Math.round(sim * aspect), sh: sim, dw: dm, dh: Math.round(dm / aspect) }
    : { sw: sim, sh: Math.round(sim / aspect), dw: Math.round(dm * aspect), dh: dm };
}

let S = simSizes();
const velocity  = makeDoubleFBO(S.sw, S.sh);
const dye       = makeDoubleFBO(S.dw, S.dh);
const pressure  = makeDoubleFBO(S.sw, S.sh);
const curlRT    = makeRT(S.sw, S.sh);
const divergeRT = makeRT(S.sw, S.sh);

// ── Shaders ──
const VERT = `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;
function prog(frag, u = {}) {
  return new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: frag, uniforms: u, depthTest: false, depthWrite: false });
}

// ---- Simulation passes ----
const advectMat = prog(`precision highp float;varying vec2 vUv;uniform sampler2D uVelocity,uSource;uniform vec2 uTexel;uniform float uDt,uDissipation;
void main(){vec2 c=vUv-uDt*texture2D(uVelocity,vUv).xy*uTexel;gl_FragColor=texture2D(uSource,c)/(1.+uDissipation*uDt);}`, {
  uVelocity:{value:null},uSource:{value:null},uTexel:{value:new THREE.Vector2()},uDt:{value:0},uDissipation:{value:0},
});

const splatMat = prog(`precision highp float;varying vec2 vUv;uniform sampler2D uTarget;uniform float uAspect,uRadius;uniform vec2 uPoint;uniform vec3 uColor;
void main(){vec2 p=vUv-uPoint;p.x*=uAspect;gl_FragColor=vec4(texture2D(uTarget,vUv).rgb+exp(-dot(p,p)/uRadius)*uColor,1.);}`, {
  uTarget:{value:null},uAspect:{value:1},uRadius:{value:.001},uPoint:{value:new THREE.Vector2()},uColor:{value:new THREE.Vector3()},
});

const curlMat = prog(`precision highp float;varying vec2 vUv;uniform sampler2D uVelocity;uniform vec2 uTexel;
void main(){float L=texture2D(uVelocity,vUv-vec2(uTexel.x,0.)).y,R=texture2D(uVelocity,vUv+vec2(uTexel.x,0.)).y,B=texture2D(uVelocity,vUv-vec2(0.,uTexel.y)).x,T=texture2D(uVelocity,vUv+vec2(0.,uTexel.y)).x;gl_FragColor=vec4(.5*(R-L-T+B),0.,0.,1.);}`, {
  uVelocity:{value:null},uTexel:{value:new THREE.Vector2()},
});

const vorticityMat = prog(`precision highp float;varying vec2 vUv;uniform sampler2D uVelocity,uCurl;uniform vec2 uTexel;uniform float uCurlStrength,uDt;
void main(){float L=texture2D(uCurl,vUv-vec2(uTexel.x,0.)).x,R=texture2D(uCurl,vUv+vec2(uTexel.x,0.)).x,B=texture2D(uCurl,vUv-vec2(0.,uTexel.y)).x,T=texture2D(uCurl,vUv+vec2(0.,uTexel.y)).x,C=texture2D(uCurl,vUv).x;vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=uCurlStrength*C;f.y*=-1.;vec2 v=texture2D(uVelocity,vUv).xy+f*uDt;gl_FragColor=vec4(clamp(v,-1e3,1e3),0.,1.);}`, {
  uVelocity:{value:null},uCurl:{value:null},uTexel:{value:new THREE.Vector2()},uCurlStrength:{value:0},uDt:{value:0},
});

const divergeMat = prog(`precision highp float;varying vec2 vUv;uniform sampler2D uVelocity;uniform vec2 uTexel;
void main(){float L=texture2D(uVelocity,vUv-vec2(uTexel.x,0.)).x,R=texture2D(uVelocity,vUv+vec2(uTexel.x,0.)).x,B=texture2D(uVelocity,vUv-vec2(0.,uTexel.y)).y,T=texture2D(uVelocity,vUv+vec2(0.,uTexel.y)).y;vec2 C=texture2D(uVelocity,vUv).xy;if(vUv.x-uTexel.x<0.)L=-C.x;if(vUv.x+uTexel.x>1.)R=-C.x;if(vUv.y-uTexel.y<0.)B=-C.y;if(vUv.y+uTexel.y>1.)T=-C.y;gl_FragColor=vec4(.5*(R-L+T-B),0.,0.,1.);}`, {
  uVelocity:{value:null},uTexel:{value:new THREE.Vector2()},
});

const pressureMat = prog(`precision highp float;varying vec2 vUv;uniform sampler2D uPressure,uDivergence;uniform vec2 uTexel;
void main(){float L=texture2D(uPressure,vUv-vec2(uTexel.x,0.)).x,R=texture2D(uPressure,vUv+vec2(uTexel.x,0.)).x,B=texture2D(uPressure,vUv-vec2(0.,uTexel.y)).x,T=texture2D(uPressure,vUv+vec2(0.,uTexel.y)).x;float d=texture2D(uDivergence,vUv).x;gl_FragColor=vec4((L+R+B+T-d)*.25,0.,0.,1.);}`, {
  uPressure:{value:null},uDivergence:{value:null},uTexel:{value:new THREE.Vector2()},
});

const gradientMat = prog(`precision highp float;varying vec2 vUv;uniform sampler2D uPressure,uVelocity;uniform vec2 uTexel;
void main(){float L=texture2D(uPressure,vUv-vec2(uTexel.x,0.)).x,R=texture2D(uPressure,vUv+vec2(uTexel.x,0.)).x,B=texture2D(uPressure,vUv-vec2(0.,uTexel.y)).x,T=texture2D(uPressure,vUv+vec2(0.,uTexel.y)).x;vec2 v=texture2D(uVelocity,vUv).xy-vec2(R-L,T-B);gl_FragColor=vec4(v,0.,1.);}`, {
  uPressure:{value:null},uVelocity:{value:null},uTexel:{value:new THREE.Vector2()},
});

const clearMat = prog(`precision highp float;varying vec2 vUv;uniform sampler2D uTexture;uniform float uValue;
void main(){gl_FragColor=uValue*texture2D(uTexture,vUv);}`, {
  uTexture:{value:null},uValue:{value:.8},
});

// ---- Camera → edge-driven dye deposit ----
const cameraDyeMat = prog(`precision highp float;varying vec2 vUv;
uniform sampler2D uDye,uCamera;
uniform vec2 uCamTexel;
uniform float uEdgeDye,uDarkDye,uDissipation;

float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}

float sobel(vec2 uv,vec2 t){
  float tl=lum(texture2D(uCamera,uv+vec2(-t.x,t.y)).rgb);
  float tc=lum(texture2D(uCamera,uv+vec2(0.,t.y)).rgb);
  float tr=lum(texture2D(uCamera,uv+vec2(t.x,t.y)).rgb);
  float ml=lum(texture2D(uCamera,uv+vec2(-t.x,0.)).rgb);
  float mr=lum(texture2D(uCamera,uv+vec2(t.x,0.)).rgb);
  float bl=lum(texture2D(uCamera,uv+vec2(-t.x,-t.y)).rgb);
  float bc=lum(texture2D(uCamera,uv+vec2(0.,-t.y)).rgb);
  float br=lum(texture2D(uCamera,uv+vec2(t.x,-t.y)).rgb);
  float gx=-tl-2.*ml-bl+tr+2.*mr+br;
  float gy=-tl-2.*tc-tr+bl+2.*bc+br;
  return sqrt(gx*gx+gy*gy);
}

void main(){
  vec3 dye=texture2D(uDye,vUv).rgb;
  float edge=sobel(vUv,uCamTexel);
  float dark=1.-lum(texture2D(uCamera,vUv).rgb);

  // Edge regions deposit heavy ink; dark regions deposit light ink
  float ink=edge*uEdgeDye+dark*uDarkDye;

  // Smooth edge response (avoid harsh binary)
  ink=ink/(ink+.3);

  vec3 nd=dye+vec3(ink);
  nd*=1.-uDissipation;
  gl_FragColor=vec4(max(nd,0.),1.);
}`, {
  uDye:{value:null},uCamera:{value:null},uCamTexel:{value:new THREE.Vector2()},
  uEdgeDye:{value:.5},uDarkDye:{value:.15},uDissipation:{value:.01},
});

// ---- Camera → edge perpendicular velocity ----
const cameraVelMat = prog(`precision highp float;varying vec2 vUv;
uniform sampler2D uVelocity,uCamera;
uniform vec2 uCamTexel;
uniform float uEdgeVel;

float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}

void main(){
  vec2 vel=texture2D(uVelocity,vUv).xy;

  // Sobel
  float tl=lum(texture2D(uCamera,vUv+vec2(-uCamTexel.x,uCamTexel.y)).rgb);
  float tr=lum(texture2D(uCamera,vUv+vec2(uCamTexel.x,uCamTexel.y)).rgb);
  float ml=lum(texture2D(uCamera,vUv+vec2(-uCamTexel.x,0.)).rgb);
  float mr=lum(texture2D(uCamera,vUv+vec2(uCamTexel.x,0.)).rgb);
  float bl=lum(texture2D(uCamera,vUv+vec2(-uCamTexel.x,-uCamTexel.y)).rgb);
  float br=lum(texture2D(uCamera,vUv+vec2(uCamTexel.x,-uCamTexel.y)).rgb);
  float gx=-tl-2.*ml-bl+tr+2.*mr+br;
  float gx2=-tl+tr-bl+br;
  float gy=-tl-2.*tl-tr+bl+2.*bl+br;
  // Fixed: proper Sobel Gy
  float tc=lum(texture2D(uCamera,vUv+vec2(0.,uCamTexel.y)).rgb);
  float bc=lum(texture2D(uCamera,vUv+vec2(0.,-uCamTexel.y)).rgb);
  float gy2=-tl-2.*tc-tr+bl+2.*bc+br;

  float edge=sqrt(gx*gx+gy2*gy2);

  // Perpendicular direction (rotate gradient 90°)
  // Edge tangent = (gx, gy). Perpendicular = (-gy, gx) or (gy, -gx)
  // Push outward from edge — use normalized perpendicular
  vec2 dir=vec2(-gy2,gx);
  float len=length(dir);
  if(len>1e-6)dir/=len;

  vel+=dir*edge*uEdgeVel;
  gl_FragColor=vec4(clamp(vel,-1e3,1e3),0.,1.);
}`, {
  uVelocity:{value:null},uCamera:{value:null},uCamTexel:{value:new THREE.Vector2()},
  uEdgeVel:{value:3.5},
});

// ---- Display ----
const displayMat = prog(`precision highp float;varying vec2 vUv;
uniform sampler2D uDye,uCamera;uniform vec3 uPaper;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

void main(){
  vec3 A=texture2D(uDye,vUv).rgb*2.8;
  vec3 ink=uPaper*exp(-A);
  vec3 cam=texture2D(uCamera,vUv).rgb;

  // Ink density determines blend
  float d=1.-exp(-length(A)*.5);
  vec3 col=mix(cam,ink,d);

  // Paper grain where ink is present
  float grain=hash(vUv*420.)*.012+hash(vUv*180.)*.008;
  col+=grain*d;

  // Vignette
  vec2 uv2=vUv*(1.-vUv.yx);
  float vig=pow(uv2.x*uv2.y*15.,.15);
  col*=.92+.08*vig;

  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`, {
  uDye:{value:null},uCamera:{value:null},
  uPaper:{value:new THREE.Vector3(PAPER.r,PAPER.g,PAPER.b)},
});

function blit(mat, target) {
  quad.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(scene, camera3D);
}

// ── Splat helpers ──
function splatVelocity(x, y, fx, fy, r = 1) {
  splatMat.uniforms.uTarget.value = velocity.read.texture;
  splatMat.uniforms.uAspect.value = innerWidth / innerHeight;
  splatMat.uniforms.uPoint.value.set(x, y);
  splatMat.uniforms.uRadius.value = CFG.SPLAT_RADIUS * r;
  splatMat.uniforms.uColor.value.set(fx, fy, 0);
  blit(splatMat, velocity.write);
  velocity.swap();
}
function splatDye(x, y, a, r = 1) {
  splatMat.uniforms.uTarget.value = dye.read.texture;
  splatMat.uniforms.uAspect.value = innerWidth / innerHeight;
  splatMat.uniforms.uPoint.value.set(x, y);
  splatMat.uniforms.uRadius.value = CFG.SPLAT_RADIUS * r;
  splatMat.uniforms.uColor.value.copy(a);
  blit(splatMat, dye.write);
  dye.swap();
}

// ── Camera ──
let video, videoTexture, stream;

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video = document.createElement('video');
    video.srcObject = stream;
    video.playsInline = true;
    await video.play();
    videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.SRGBColorSpace;
    document.getElementById('perm').style.display = 'none';
    document.getElementById('panel').style.display = 'flex';
  } catch (err) {
    console.error('Camera:', err);
  }
}
document.getElementById('permBtn').addEventListener('click', startCam);

// ── Pointer ──
const ptr = { down: false, x: 0, y: 0, px: 0, py: 0, moved: false };

function toUV(e) {
  const r = renderer.domElement.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: 1 - (e.clientY - r.top) / r.height };
}

canvas.addEventListener('pointerdown', e => {
  const p = toUV(e);
  ptr.down = true; ptr.moved = false;
  ptr.x = ptr.px = p.x; ptr.y = ptr.py = p.y;
  splatDye(p.x, p.y, inkAbsorption(INK_COLORS.sumi, .3), 2.5);
  splatVelocity(p.x, p.y, (Math.random()-.5)*160, (Math.random()-.5)*160, 2.5);
});
canvas.addEventListener('pointermove', e => {
  const p = toUV(e);
  ptr.px = ptr.x; ptr.py = ptr.y;
  ptr.x = p.x; ptr.y = p.y;
  ptr.moved = true;
});
addEventListener('pointerup', () => { ptr.down = false; });
addEventListener('pointercancel', () => { ptr.down = false; });

function applyPointer() {
  if (!ptr.moved) return;
  ptr.moved = false;
  const dx = ptr.x - ptr.px, dy = ptr.y - ptr.py;
  if (Math.abs(dx) + Math.abs(dy) < 1e-6) return;
  splatVelocity(ptr.x, ptr.y, dx * CFG.SPLAT_FORCE, dy * CFG.SPLAT_FORCE, ptr.down ? 3. : 1.8);
  if (ptr.down) {
    const s = Math.min(Math.hypot(dx, dy) * 25, 1);
    splatDye(ptr.x, ptr.y, inkAbsorption(INK_COLORS.sumi, .08 + s * .14), 1.2);
  }
}

// ── Simulation step ──
function step(dt) {
  // --- Edge-driven camera deposit (dye) ---
  if (videoTexture) {
    const camW = video.videoWidth || 640, camH = video.videoHeight || 480;
    cameraDyeMat.uniforms.uDye.value = dye.read.texture;
    cameraDyeMat.uniforms.uCamera.value = videoTexture;
    cameraDyeMat.uniforms.uCamTexel.value.set(1 / camW, 1 / camH);
    cameraDyeMat.uniforms.uEdgeDye.value = CFG.EDGE_DYE;
    cameraDyeMat.uniforms.uDarkDye.value = CFG.DARK_DYE;
    cameraDyeMat.uniforms.uDissipation.value = .01;
    blit(cameraDyeMat, dye.write);
    dye.swap();

    // --- Edge-driven velocity ---
    cameraVelMat.uniforms.uVelocity.value = velocity.read.texture;
    cameraVelMat.uniforms.uCamera.value = videoTexture;
    cameraVelMat.uniforms.uCamTexel.value.set(1 / camW, 1 / camH);
    cameraVelMat.uniforms.uEdgeVel.value = CFG.EDGE_VEL;
    blit(cameraVelMat, velocity.write);
    velocity.swap();
  }

  // --- Curl ---
  curlMat.uniforms.uVelocity.value = velocity.read.texture;
  curlMat.uniforms.uTexel.value.copy(velocity.texel);
  blit(curlMat, curlRT);

  // --- Vorticity ---
  vorticityMat.uniforms.uVelocity.value = velocity.read.texture;
  vorticityMat.uniforms.uCurl.value = curlRT.texture;
  vorticityMat.uniforms.uTexel.value.copy(velocity.texel);
  vorticityMat.uniforms.uCurlStrength.value = CFG.CURL;
  vorticityMat.uniforms.uDt.value = dt;
  blit(vorticityMat, velocity.write);
  velocity.swap();

  // --- Divergence ---
  divergeMat.uniforms.uVelocity.value = velocity.read.texture;
  divergeMat.uniforms.uTexel.value.copy(velocity.texel);
  blit(divergeMat, divergeRT);

  // --- Pressure solve ---
  clearMat.uniforms.uTexture.value = pressure.read.texture;
  blit(clearMat, pressure.write); pressure.swap();
  pressureMat.uniforms.uDivergence.value = divergeRT.texture;
  pressureMat.uniforms.uTexel.value.copy(velocity.texel);
  for (let i = 0; i < CFG.PRESSURE_ITER; i++) {
    pressureMat.uniforms.uPressure.value = pressure.read.texture;
    blit(pressureMat, pressure.write);
    pressure.swap();
  }

  // --- Gradient subtract ---
  gradientMat.uniforms.uPressure.value = pressure.read.texture;
  gradientMat.uniforms.uVelocity.value = velocity.read.texture;
  gradientMat.uniforms.uTexel.value.copy(velocity.texel);
  blit(gradientMat, velocity.write);
  velocity.swap();

  // --- Advect velocity ---
  advectMat.uniforms.uVelocity.value = velocity.read.texture;
  advectMat.uniforms.uSource.value = velocity.read.texture;
  advectMat.uniforms.uTexel.value.copy(velocity.texel);
  advectMat.uniforms.uDt.value = dt;
  advectMat.uniforms.uDissipation.value = CFG.VEL_DISSIPATION;
  blit(advectMat, velocity.write);
  velocity.swap();

  // --- Advect dye ---
  advectMat.uniforms.uVelocity.value = velocity.read.texture;
  advectMat.uniforms.uSource.value = dye.read.texture;
  advectMat.uniforms.uTexel.value.copy(dye.texel);
  advectMat.uniforms.uDissipation.value = CFG.DYE_DISSIPATION;
  blit(advectMat, dye.write);
  dye.swap();
}

// ── Main loop ──
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 1 / 30);
  if (dt <= 0) return;

  applyPointer();
  step(dt);

  displayMat.uniforms.uDye.value = dye.read.texture;
  displayMat.uniforms.uCamera.value = videoTexture;
  blit(displayMat, null);

  if (now % 3000 < 20) {
    document.getElementById('status').textContent =
      `vel:${S.sw}×${S.sh} dye:${S.dw}×${S.dh} ${(dt*1000).toFixed(0)}ms edges→ink`;
  }
}

// ── Save ──
document.getElementById('btnSave').addEventListener('click', () => {
  renderer.render(scene, camera3D);
  const link = document.createElement('a');
  link.download = 'ink-flow-' + Date.now() + '.png';
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();
});

// ── Resize ──
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  S = simSizes();
  velocity.resize(S.sw, S.sh);
  pressure.resize(S.sw, S.sh);
  curlRT.setSize(S.sw, S.sh);
  divergeRT.setSize(S.sw, S.sh);
  dye.resize(S.dw, S.dh);
});

requestAnimationFrame(frame);
</script>
</body>
</html>
