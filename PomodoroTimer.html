<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>番茄时钟 - Pomodoro Timer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 2rem 1rem;
      transition: background 0.5s;
    }
    body.break { background: #1a1a2e; }

    .container {
      max-width: 400px; width: 100%; text-align: center;
    }

    .label {
      font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.2em; color: #666; margin-bottom: 1.5rem;
    }

    .timer-ring {
      position: relative; width: 260px; height: 260px;
      margin: 0 auto 2rem;
    }
    .timer-ring svg { transform: rotate(-90deg); }
    .timer-ring .bg { fill: none; stroke: #1e1e1e; stroke-width: 6; }
    .timer-ring .progress {
      fill: none; stroke: #f0f0f0; stroke-width: 6;
      stroke-linecap: round; stroke-dasharray: 754;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    .timer-text {
      position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .timer-text .time {
      font-size: 3.8rem; font-weight: 300; letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
    }
    .timer-text .state {
      font-size: 0.75rem; color: #888; margin-top: 0.25rem;
      text-transform: uppercase; letter-spacing: 0.1em;
    }

    .tabs {
      display: flex; gap: 0.25rem; background: #1a1a1a;
      border-radius: 10px; padding: 4px; margin-bottom: 2rem;
    }
    .tab {
      flex: 1; padding: 0.6rem 0; font-size: 0.8rem;
      border: none; background: transparent; color: #666;
      border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .tab.active { background: #2a2a2a; color: #fff; }

    .main-btn {
      width: 54px; height: 54px; border-radius: 50%; border: none;
      font-size: 1.4rem; cursor: pointer; margin: 0 0.5rem;
      transition: all 0.2s; background: #f0f0f0; color: #0f0f0f;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .main-btn:hover { transform: scale(1.05); }
    .main-btn.reset { background: #2a2a2a; color: #888; font-size: 0.9rem; }

    .btn-row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; }

    .bgm-section { margin-top: 2rem; }
    .bgm-section .bgm-title {
      font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.15em; color: #555; margin-bottom: 0.75rem;
    }
    .bgm-row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .bgm-btn {
      padding: 0.5rem 0.8rem; font-size: 0.75rem; border: 1px solid #2a2a2a;
      border-radius: 20px; background: transparent; color: #888;
      cursor: pointer; transition: 0.2s;
    }
    .bgm-btn:hover, .bgm-btn.active { background: #2a2a2a; color: #fff; }

    @media (max-width: 400px) {
      .timer-ring { width: 220px; height: 220px; }
      .timer-ring svg { width: 220px; height: 220px; }
      .timer-text .time { font-size: 3rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="label">FOCUS</div>

    <div class="timer-ring">
      <svg width="260" height="260" viewBox="0 0 260 260">
        <circle class="bg" cx="130" cy="130" r="120" />
        <circle class="progress" id="progress" cx="130" cy="130" r="120" />
      </svg>
      <div class="timer-text">
        <div class="time" id="timer">25:00</div>
        <div class="state" id="state">WORK</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-mode="work" onclick="setMode('work')">专注</button>
      <button class="tab" data-mode="break" onclick="setMode('break')">休息</button>
    </div>

    <div class="btn-row">
      <button class="main-btn reset" onclick="resetTimer()" title="重置">↺</button>
      <button class="main-btn" id="playBtn" onclick="toggleTimer()">▶</button>
    </div>

    <div style="margin-bottom: 1.5rem;">
      <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:#666;margin-bottom:0.25rem;">
        <span>专注 <span id="workLabel">25</span> min</span>
        <span>休息 <span id="breakLabel">5</span> min</span>
      </div>
      <div style="display:flex;gap:0.5rem;">
        <input type="range" id="workTime" min="1" max="60" value="25" step="1" oninput="updateDurations()" style="flex:1;accent-color:#f0f0f0;">
        <input type="range" id="breakTime" min="1" max="30" value="5" step="1" oninput="updateDurations()" style="flex:1;accent-color:#f0f0f0;">
      </div>
    </div>

    <div class="bgm-section">
      <div class="bgm-title">背景白噪音</div>
      <div class="bgm-row" id="bgmRow">
        <button class="bgm-btn" data-bgm="rain" onclick="playBgm('rain', this)">雨声</button>
        <button class="bgm-btn" data-bgm="forest" onclick="playBgm('forest', this)">森林</button>
        <button class="bgm-btn" data-bgm="ocean" onclick="playBgm('ocean', this)">海浪</button>
        <button class="bgm-btn" data-bgm="piano" onclick="playBgm('piano', this)">钢琴</button>
      </div>
    </div>
  </div>

  <audio id="dingSound" src="https://yushihu.top/ding.mp3"></audio>
  <audio id="bgmPlayer" loop></audio>

  <script>
    // -- state --
    const durations = { work: 25 * 60, break: 5 * 60 };
    let mode = 'work';
    let remaining = durations.work;
    let timer = null;
    let isRunning = false;

    // -- DOM --
    const timerEl = document.getElementById('timer');
    const stateEl = document.getElementById('state');
    const progressEl = document.getElementById('progress');
    const playBtn = document.getElementById('playBtn');
    const bodyEl = document.body;
    const ding = document.getElementById('dingSound');
    const bgm = document.getElementById('bgmPlayer');
    const CIRCUMFERENCE = 2 * Math.PI * 120; // ~754

    const bgmSources = {
      rain: 'https://yushihu.top/rain.mp3',
      forest: 'https://yushihu.top/forest.mp3',
      ocean: 'https://yushihu.top/ocean.mp3',
      piano: 'https://yushihu.top/piano.mp3',
    };

    // -- display --
    function updateDisplay() {
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      timerEl.textContent = `${m}:${s}`;
      stateEl.textContent = mode === 'work' ? 'FOCUS' : 'BREAK';
    }

    function updateProgress() {
      const total = mode === 'work' ? durations.work : durations.break;
      const ratio = remaining / total;
      progressEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
    }

    // -- timer --
    function tick() {
      if (remaining > 0) {
        remaining--;
        updateDisplay();
        updateProgress();
      } else {
        ding.play();
        clearInterval(timer);
        isRunning = false;
        mode = mode === 'work' ? 'break' : 'work';
        remaining = mode === 'work' ? durations.work : durations.break;
        applyMode();
        updateDisplay();
        updateProgress();
        startTimer();
      }
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      playBtn.textContent = '⏸';
      timer = setInterval(tick, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      isRunning = false;
      playBtn.textContent = '▶';
    }

    function toggleTimer() {
      isRunning ? pauseTimer() : startTimer();
    }

    function resetTimer() {
      pauseTimer();
      remaining = durations[mode];
      updateDisplay();
      updateProgress();
    }

    // -- mode --
    function setMode(m) {
      if (isRunning) pauseTimer();
      mode = m;
      remaining = durations[mode];
      updateDisplay();
      updateProgress();
      applyMode();
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.mode === m);
      });
    }

    function applyMode() {
      if (mode === 'break') {
        bodyEl.classList.add('break');
        stateEl.textContent = 'BREAK';
      } else {
        bodyEl.classList.remove('break');
        stateEl.textContent = 'FOCUS';
      }
    }

    // -- bgm --
    let activeBgm = null;
    function playBgm(type, btn) {
      if (activeBgm === type) { stopBgm(); return; }
      const src = bgmSources[type];
      if (!src) return;
      bgm.src = src; bgm.play();
      activeBgm = type;
      document.querySelectorAll('.bgm-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function stopBgm() {
      bgm.pause(); bgm.src = '';
      activeBgm = null;
      document.querySelectorAll('.bgm-btn').forEach(b => b.classList.remove('active'));
    }

    function updateDurations() {
      const w = parseInt(document.getElementById('workTime').value);
      const b = parseInt(document.getElementById('breakTime').value);
      document.getElementById('workLabel').textContent = w;
      document.getElementById('breakLabel').textContent = b;
      durations.work = w * 60;
      durations.break = b * 60;
      if (!isRunning) { remaining = durations[mode]; updateDisplay(); updateProgress(); }
    }

    // -- init --
    progressEl.style.strokeDasharray = CIRCUMFERENCE;
    progressEl.style.strokeDashoffset = 0;
    updateDisplay();
  </script>
</body>
</html>
