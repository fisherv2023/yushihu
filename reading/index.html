<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="中英双语阅读 · yushihu.top">
<title>双语阅读 · yushihu.top</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Serif SC","Songti SC",Georgia,serif;background:#f5f0e8;color:#2c2416;min-height:100vh}
.bookshelf{max-width:720px;margin:0 auto;padding:60px 20px}
.bookshelf h1{text-align:center;font-size:2em;margin-bottom:12px;color:#1a3a4a;letter-spacing:4px}
.bookshelf .sub{text-align:center;color:#888;margin-bottom:48px;font-size:.9em}
.bk{display:flex;gap:24px;background:#fff;border-radius:8px;padding:28px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:.2s;margin-bottom:16px}
.bk:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.1)}
.bk .cv{flex-shrink:0;width:100px;height:140px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.82em;letter-spacing:3px;text-align:center;line-height:1.5}
.bk .info{flex:1}
.bk h2{font-size:1.4em;margin-bottom:6px;color:#1a3a4a}
.bk .author{color:#666;font-size:.95em;margin-bottom:10px}
.bk .desc{color:#999;font-size:.85em;line-height:1.6}
.toc{max-width:600px;margin:60px auto;padding:0 20px}
.toc h2{text-align:center;margin-bottom:8px;color:#1a3a4a}
.toc .back{display:block;text-align:center;color:#2d7a9e;text-decoration:none;margin-bottom:32px;font-size:.9em}
.toc a.ci{display:block;padding:16px 20px;margin-bottom:8px;background:#fff;border-radius:6px;text-decoration:none;color:#2c2416;font-size:1.05em;box-shadow:0 1px 6px rgba(0,0,0,.04);transition:.2s}
.toc a.ci:hover{background:#eaf4f8}
.reader{max-width:720px;margin:0 auto;padding:40px 20px 80px}
.r-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.r-nav a{color:#2d7a9e;text-decoration:none;font-size:.9em}
.r-nav span{color:#888;font-size:.9em}
.toolbar{display:flex;justify-content:center;gap:10px;margin-bottom:28px}
.toolbar button{padding:6px 16px;background:#fff;border:1px solid #c5dde8;border-radius:4px;cursor:pointer;color:#2d7a9e;font-size:.82em;font-family:inherit;transition:.2s}
.toolbar button:hover{background:#eaf4f8}
.reader h2{font-size:1.6em;color:#1a3a4a;margin-bottom:32px;text-align:center}
.hint{text-align:center;color:#aaa;font-size:.8em;margin-bottom:20px}
.pb{margin-bottom:20px;padding:16px 20px;background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.03)}
.pe{font-family:Georgia,"Times New Roman",serif;font-size:1.05em;line-height:1.9;color:#333;text-indent:2em}
.tz{display:inline-block;margin-top:8px;padding:4px 14px;background:transparent;border:1px solid #d4d0c4;border-radius:3px;cursor:pointer;color:#8a7e6e;font-size:.78em;font-family:inherit;transition:.2s;letter-spacing:1px}
.tz:hover{background:#f0ebe0;border-color:#c0b898;color:#5a4e3e}
.pz{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #e0d8c8;font-size:.95em;line-height:1.9;color:#5a4e3e;text-indent:2em}
.pz.on{display:block}
.tz.on{background:#f0ebe0;border-color:#c0b898;color:#5a4e3e}
.r-bottom{display:flex;justify-content:space-between;margin-top:40px;flex-wrap:wrap;gap:8px}
.r-bottom a,.r-bottom button{padding:10px 20px;background:#1a4a6e;color:#fff;border:none;border-radius:4px;cursor:pointer;text-decoration:none;font-size:.9em;font-family:inherit}
.r-bottom a:hover,.r-bottom button:hover{background:#2d7a9e}
.foot{text-align:center;padding:24px;color:#aaa;font-size:.8em}
.foot a{color:#2d7a9e;text-decoration:none}
@media(max-width:500px){.bk{flex-direction:column;align-items:center;text-align:center}.reader{padding:20px 12px 60px}.pb{padding:12px 14px}}
</style>
</head>
<body>

<div id="v-bookshelf" class="bookshelf">
  <h1>双语阅读</h1>
  <p class="sub">中英对照 · 逐段精读</p>
  <div class="bk" onclick="openBook('oldman.json','老人与海','The Old Man and the Sea','Ernest Hemingway · 海明威','海明威最负盛名的中篇小说。一个古巴老渔夫在湾流中与一条巨大的马林鱼搏斗的故事。1954年获诺贝尔文学奖。','#1a4a6e','#2d7a9e')">
    <div class="cv" style="background:linear-gradient(135deg,#1a4a6e,#2d7a9e)">老人<br>与海</div>
    <div class="info">
      <h2>The Old Man and the Sea</h2>
      <p class="author">Ernest Hemingway · 海明威</p>
      <p class="desc">海明威最负盛名的中篇小说。一个古巴老渔夫在湾流中与一条巨大的马林鱼搏斗的故事。1954年获诺贝尔文学奖。</p>
    </div>
  </div>
</div>

<div id="v-toc" class="toc" style="display:none">
  <h2 id="toc-title"></h2>
  <a class="back" href="#" onclick="S('bookshelf');return false">← 返回</a>
  <div id="toc-list"></div>
</div>

<div id="v-reader" class="reader" style="display:none">
  <div class="r-nav">
    <a href="#" onclick="S('toc');return false">← 目录</a>
    <span id="indicator"></span>
    <span></span>
  </div>
  <div class="toolbar">
    <button onclick="expandAll()">全部展开</button>
    <button onclick="collapseAll()">全部收起</button>
  </div>
  <h2 id="ch-title"></h2>
  <p class="hint">← → 键翻章节</p>
  <div id="ch-content"></div>
  <div class="r-bottom">
    <button id="btn-prev" onclick="go(-1)">← 上一章</button>
    <button id="btn-next" onclick="go(1)">下一章 →</button>
  </div>
</div>

<div class="foot"><a href="https://yushihu.top">yushihu.top</a> · 双语阅读</div>

<script>
var B=[], cur=0;

function S(v){['bookshelf','toc','reader'].forEach(function(id){document.getElementById('v-'+id).style.display=id===v?'block':'none'});}

function openBook(jsonFile, title, etitle, author, desc, c1, c2){
  document.getElementById('toc-title').textContent=title;
  fetch(jsonFile).then(function(r){return r.json()}).then(function(data){
    B=data;
    var h='';
    for(var i=0;i<B.length;i++) h+='<a class="ci" href="#" onclick="R('+i+');return false">'+B[i].t+'</a>';
    document.getElementById('toc-list').innerHTML=h;
    S('toc');
  });
}

function R(i){
  cur=i; var ch=B[i];
  document.getElementById('ch-title').textContent=ch.t;
  document.getElementById('indicator').textContent='第 '+(cur+1)+' / '+B.length+' 章';
  var h='';
  for(var j=0;j<ch.p.length;j++) h+='<div class="pb"><div class="pe">'+ch.p[j].en+'</div><button class="tz" onclick="T(this,'+j+')">译文</button><div class="pz" id="z-'+j+'">'+ch.p[j].zh+'</div></div>';
  document.getElementById('ch-content').innerHTML=h;
  document.getElementById('btn-prev').style.visibility=cur===0?'hidden':'visible';
  document.getElementById('btn-next').style.visibility=cur>=B.length-1?'hidden':'visible';
  S('reader'); window.scrollTo(0,0);
}

function T(btn,j){var d=document.getElementById('z-'+j);d.classList.toggle('on');btn.classList.toggle('on')}
function go(d){var n=cur+d;if(n>=0&&n<B.length)R(n)}
function expandAll(){var zs=document.querySelectorAll('.pz');for(var i=0;i<zs.length;i++)zs[i].classList.add('on');var bs=document.querySelectorAll('.tz');for(var i=0;i<bs.length;i++)bs[i].classList.add('on')}
function collapseAll(){var zs=document.querySelectorAll('.pz');for(var i=0;i<zs.length;i++)zs[i].classList.remove('on');var bs=document.querySelectorAll('.tz');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on')}

document.addEventListener('keydown',function(e){
  if(document.getElementById('v-reader').style.display==='block'){
    if(e.key==='ArrowRight'){e.preventDefault();go(1)}
    else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}
  }
});
</script>
</body>
</html>
