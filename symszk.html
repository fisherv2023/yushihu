<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2026年沈阳中考美术综合分计算器</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }
    label {
      flex: 1 0 150px;
    }
    input {
      flex: 1 0 200px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .result {
      font-size: 1.1em;
      margin: 10px 0;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #2c3e50;
      color: white;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.9rem;
      color: #aaa;
    }
    footer a {
      text-decoration: none;
      color: #aaa;
    }
    footer a:hover {
      color: #888;
    }

    /* ==================== 新增 AI 部分样式 ==================== */
    #aiButton {
      display: block;
      margin: 30px auto;
      padding: 14px 28px;
      background: linear-gradient(135deg, #0066ff, #00ccff);
      color: white;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,102,255,0.3);
    }
    #aiButton:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,102,255,0.4);
    }
    #aiResult {
      margin: 20px 0;
      padding: 20px;
      background: white;
      border-radius: 12px;
      border: 1px solid #eee;
      min-height: 120px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>2026年沈阳中考美术综合分计算器</h1>
<p style="text-align: center; font-size: 1.1rem; color: #666; margin-top: -10px; margin-bottom: 30px;">
    艺贝少儿美术教育，助力沈阳美术中考！
</p>
 <h2>计算综合成绩</h2>
  <div class="input-group">
    <label for="cultureScore">文化课成绩（满分790）：</label>
    <input type="number" id="cultureScore" min="90" max="790" value="650" placeholder="输入文化课分数">
  </div>
  <div class="input-group">
    <label for="artScore">专业课成绩（满分100）：</label>
    <input type="number" id="artScore" min="0" max="100" value="80" placeholder="输入专业课分数">
  </div>
  <div class="result">
    <p>综合分：<span id="newScore">-</span></p>
  </div>
  <hr>
  <h2>倒推文化课成绩</h2>
  <div class="input-group">
    <label for="inputNewScore">综合分：</label>
    <input type="number" id="inputNewScore" placeholder="输入综合分">
  </div>
  <div class="input-group">
    <label for="inputArtScore">专业课成绩：</label>
    <input type="number" id="inputArtScore" placeholder="输入专业课成绩">
  </div>
  <div class="result">
    <p>所需文化课成绩：<span id="requiredCultureScore">-</span></p>
  </div>
  <hr>
  <h2 style="text-align: center;">沈阳部分招收美术特长生的高中名单</h2>
<table>
    <thead>
      <tr>
        <th>学校代号</th>
        <th>学校名称</th>
        <th>招生人数</th>
        <th>文化课提档线（含体育&实验）</th>
        <th>25年最低综合分</th>
        <th>备注</th>
      </tr>
    </thead>
    <tbody>
      <!-- 你的表格内容保持不变 -->
      <tr>
        <td>1601</td>
        <td>东北育才悲鸿美术学校</td>
        <td>240</td>
        <td>638</td>
        <td>568.6</td>
        <td></td>
      </tr>
      <!-- ... 其他表格行保持不变 ... -->
    </tbody>
  </table>

  <!-- ==================== 新增 AI 按钮和结果区域 ==================== -->
  <button id="aiButton" onclick="generateAIAdvice()">
    🤖 生成 DeepSeek AI 志愿填报参考意见
  </button>
  
  <div id="aiResult" style="display:none;"></div>

  <footer>
    <a href="https://www.xiaohongshu.com/user/profile/5e79c4a90000000001004be7">开发整理 by 艺贝少儿美术教育</a>
  </footer>

  <script>
    function calculateNewScore() {
      const c = parseFloat(document.getElementById('cultureScore').value);
      const a = parseFloat(document.getElementById('artScore').value);
      if (isNaN(c) || isNaN(a)) return;
      const newS = ((c - 90) * 0.6) + (a * 2.8);
      document.getElementById('newScore').textContent = newS.toFixed(1);
    }
    function calculateRequiredCultureScore() {
      const newS = parseFloat(document.getElementById('inputNewScore').value);
      const a = parseFloat(document.getElementById('inputArtScore').value);
      if (isNaN(newS) || isNaN(a)) return;
      const c = ((newS - (a * 2.8)) / 0.6) + 90;
      document.getElementById('requiredCultureScore').textContent = c.toFixed(1);
    }
    document.getElementById('cultureScore').addEventListener('input', calculateNewScore);
    document.getElementById('artScore').addEventListener('input', calculateNewScore);
    document.getElementById('inputNewScore').addEventListener('input', calculateRequiredCultureScore);
    document.getElementById('inputArtScore').addEventListener('input', calculateRequiredCultureScore);
    calculateNewScore();

    // ==================== 新增 DeepSeek 调用代码 ====================
    async function generateAIAdvice() {
      const resultDiv = document.getElementById('aiResult');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<p style="color:#0066ff;">正在生成专业志愿参考意见，请稍等 5-15 秒...</p>';

      const culture = document.getElementById('cultureScore').value || '未知';
      const art = document.getElementById('artScore').value || '未知';
      const composite = document.getElementById('newScore').textContent || '未知';

      const prompt = `我是2026年沈阳中考美术生，文化课${culture}分，专业课${art}分，综合分约${composite}分。
请结合当前沈阳美术生招生政策和高中情况，给出详细的志愿填报参考意见，包括：
1. 冲刺院校（风险较高但值得尝试）
2. 稳妥院校
3. 保底院校
4. 填报策略和注意事项`;

      try {
        const res = await fetch('https://deepseek-volunteer.yuyang918.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        
        if (data.success) {
          resultDiv.innerHTML = `<strong>DeepSeek AI 志愿参考意见：</strong><br><br>${data.content.replace(/\n/g, '<br>')}`;
        } else {
          resultDiv.innerHTML = `<span style="color:red;">生成失败：${data.error || '未知错误'}</span>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<span style="color:red;">网络错误，请稍后再试（${err.message})</span>`;
      }
    }
  </script>
</body>
</html>
