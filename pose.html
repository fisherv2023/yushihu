<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pose Mannequin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;font-family:-apple-system,sans-serif}
canvas{display:block}
#ui{position:fixed;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10;flex-wrap:wrap;padding:0 12px}
#ui button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);
  padding:10px 18px;border-radius:22px;font-size:13px;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#ui button:active{background:rgba(255,255,255,.28)}
#ui button.accent{background:#e94560;border-color:#e94560}
#status{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.55);
  font-size:11px;z-index:10;pointer-events:none;text-align:center}
#fileInput{display:none}
</style>
</head>
<body>
<div id="status">drag to rotate · pinch to zoom</div>
<div id="ui">
  <button id="btnA">A-Pose</button>
  <button id="btnT">T-Pose</button>
  <button id="btnWalk">Walk</button>
  <button id="btnPhoto" class="accent">Detect Pose</button>
</div>
<input type="file" id="fileInput" accept="image/*">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 3, 10);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 20);
camera.position.set(0, 1.3, 4);
camera.lookAt(0, 0.9, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1.0; controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI * 0.7;
controls.update();

// ── Lights ──
scene.add(new THREE.AmbientLight(0x8899bb, 1.8));
const sun = new THREE.DirectionalLight(0xffffff, 3.5);
sun.position.set(3, 5, 4); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 20;
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -2; sun.shadow.bias = -0.0002;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x4466aa, 1.2);
rim.position.set(-2, 3, -2); scene.add(rim);
const fill = new THREE.DirectionalLight(0x6688bb, 0.8);
fill.position.set(0, 0.5, -4); scene.add(fill);

const gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ color: 0x2a2a3e, roughness: 0.9 })
);
gnd.rotation.x = -Math.PI/2; gnd.position.y = -0.01; gnd.receiveShadow = true;
scene.add(gnd);

// ── Materials ──
const skin = new THREE.MeshStandardMaterial({ color: 0xe8d5c4, roughness: 0.4, metalness: 0.02 });
const jMat = new THREE.MeshStandardMaterial({ color: 0xc9a08c, roughness: 0.3, metalness: 0.1 });
const dark = new THREE.MeshStandardMaterial({ color: 0x5c4a3a, roughness: 0.5 });

// ── Helpers ──
function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || skin);
  m.castShadow = true; m.receiveShadow = true; return m;
}
function cyl(r, h, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), mat || skin);
  m.castShadow = true; m.receiveShadow = true; return m;
}
function sph(r) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), jMat);
  m.castShadow = true; return m;
}
// Bone = Group with pivot at proximal joint, mesh extends in +Y
function bone(name) {
  const g = new THREE.Group();
  g.name = name;
  g.userData.boneName = name;
  return g;
}

// ── Build FK Hierarchy ──
// root sits at world origin
const root = new THREE.Group();
scene.add(root);
const B = {}; // name → bone Group

// --- Lower body (attached to root at hip level) ---

// Left leg: hip → knee → ankle → foot
B.lUpLeg = bone('lUpLeg');
B.lUpLeg.position.set(-0.1, 0.84, 0);  // hip position
B.lUpLeg.add(sph(0.06));
B.lUpLeg.add(cyl(0.06, 0.4, skin).translateY(0.2));
B.lUpLeg.add(sph(0.05).translateY(0.4));

B.lLoLeg = bone('lLoLeg');
B.lLoLeg.position.set(0, 0.4, 0);  // at knee
B.lLoLeg.add(cyl(0.05, 0.38, skin).translateY(0.19));
B.lLoLeg.add(sph(0.04).translateY(0.38));

B.lFoot = bone('lFoot');
B.lFoot.position.set(0, 0.38, 0);  // at ankle
B.lFoot.rotation.set(Math.PI/2, 0, 0);  // foot points forward
B.lFoot.add(box(0.07, 0.04, 0.13, dark).translateY(0.02).translateZ(0.06));

B.lUpLeg.add(B.lLoLeg);
B.lLoLeg.add(B.lFoot);
root.add(B.lUpLeg);

// Right leg
B.rUpLeg = bone('rUpLeg');
B.rUpLeg.position.set(0.1, 0.84, 0);
B.rUpLeg.add(sph(0.06));
B.rUpLeg.add(cyl(0.06, 0.4, skin).translateY(0.2));
B.rUpLeg.add(sph(0.05).translateY(0.4));

B.rLoLeg = bone('rLoLeg');
B.rLoLeg.position.set(0, 0.4, 0);
B.rLoLeg.add(cyl(0.05, 0.38, skin).translateY(0.19));
B.rLoLeg.add(sph(0.04).translateY(0.38));

B.rFoot = bone('rFoot');
B.rFoot.position.set(0, 0.38, 0);
B.rFoot.rotation.set(Math.PI/2, 0, 0);
B.rFoot.add(box(0.07, 0.04, 0.13, dark).translateY(0.02).translateZ(0.06));

B.rUpLeg.add(B.rLoLeg);
B.rLoLeg.add(B.rFoot);
root.add(B.rUpLeg);

// --- Upper body (hips group → abdomen → chest → neck → head + arms) ---

B.hips = bone('hips');
B.hips.position.set(0, 0.84, 0);
root.add(B.hips);

// Abdomen (on top of hips)
B.abdomen = bone('abdomen');
B.abdomen.add(box(0.26, 0.22, 0.15, skin).translateY(0.11));
B.hips.add(B.abdomen);

// Chest (on top of abdomen)
B.chest = bone('chest');
B.chest.position.set(0, 0.22, 0);
B.chest.add(box(0.28, 0.30, 0.16, skin).translateY(0.15));
B.abdomen.add(B.chest);

// Neck (on top of chest)
B.neck = bone('neck');
B.neck.position.set(0, 0.30, 0);
B.neck.add(cyl(0.04, 0.08, skin).translateY(0.04));
B.chest.add(B.neck);

// Head (on top of neck)
B.head = bone('head');
B.head.position.set(0, 0.08, 0);
B.head.add(box(0.16, 0.18, 0.18, skin).translateY(0.09));
B.neck.add(B.head);

// Left arm (attached to chest at shoulder)
B.lUpArm = bone('lUpArm');
B.lUpArm.position.set(-0.14, 0.30, 0);  // left shoulder
B.lUpArm.add(sph(0.05));
B.lUpArm.add(cyl(0.04, 0.28, skin).translateY(0.14));
B.lUpArm.add(sph(0.04).translateY(0.28));

B.lLoArm = bone('lLoArm');
B.lLoArm.position.set(0, 0.28, 0);  // at elbow
B.lLoArm.add(cyl(0.035, 0.24, skin).translateY(0.12));
B.lLoArm.add(sph(0.035).translateY(0.24));

B.lHand = bone('lHand');
B.lHand.position.set(0, 0.24, 0);  // at wrist
B.lHand.add(sph(0.04));

B.lUpArm.add(B.lLoArm);
B.lLoArm.add(B.lHand);
B.chest.add(B.lUpArm);

// Right arm
B.rUpArm = bone('rUpArm');
B.rUpArm.position.set(0.14, 0.30, 0);
B.rUpArm.add(sph(0.05));
B.rUpArm.add(cyl(0.04, 0.28, skin).translateY(0.14));
B.rUpArm.add(sph(0.04).translateY(0.28));

B.rLoArm = bone('rLoArm');
B.rLoArm.position.set(0, 0.28, 0);
B.rLoArm.add(cyl(0.035, 0.24, skin).translateY(0.12));
B.rLoArm.add(sph(0.035).translateY(0.24));

B.rHand = bone('rHand');
B.rHand.position.set(0, 0.24, 0);
B.rHand.add(sph(0.04));

B.rUpArm.add(B.rLoArm);
B.rLoArm.add(B.rHand);
B.chest.add(B.rUpArm);

// ── Pose presets (local rotations only) ──

function resetPose() {
  for (const k in B) B[k].rotation.set(0, 0, 0);
  // Leg roots point DOWN (+Y mesh rotated 180° around X)
  B.lUpLeg.rotation.set(Math.PI, 0, 0);
  B.rUpLeg.rotation.set(Math.PI, 0, 0);
  // Feet point forward
  B.lFoot.rotation.set(Math.PI/2, 0, 0);
  B.rFoot.rotation.set(Math.PI/2, 0, 0);
}

function setApose() {
  resetPose();
  // Arms hang down at slight angle
  B.lUpArm.rotation.set(0.15, 0, -0.15);
  B.rUpArm.rotation.set(0.15, 0, 0.15);
  B.lLoArm.rotation.set(-0.1, 0, 0);
  B.rLoArm.rotation.set(-0.1, 0, 0);
}

function setTpose() {
  resetPose();
  B.lUpArm.rotation.set(0, 0, -Math.PI/2);
  B.rUpArm.rotation.set(0, 0, Math.PI/2);
  B.lLoArm.rotation.set(0, 0, -Math.PI/2);
  B.rLoArm.rotation.set(0, 0, Math.PI/2);
}

function setWalk() {
  resetPose();
  // Arm swing
  B.lUpArm.rotation.set(-0.5, 0, -0.15);
  B.lLoArm.rotation.set(0.3, 0, 0);
  B.rUpArm.rotation.set(0.35, 0, 0.15);
  B.rLoArm.rotation.set(-0.3, 0, 0);
  // Leg stride — base π + offset (legs already point down from resetPose)
  B.lUpLeg.rotation.x = Math.PI + 0.35;
  B.lLoLeg.rotation.x = 0 - 0.55;   // bend knee
  B.rUpLeg.rotation.x = Math.PI - 0.3;
  B.rLoLeg.rotation.x = 0 + 0.15;
  B.chest.rotation.set(0.08, 0, 0);
  B.abdomen.rotation.set(0.05, 0, 0);
}

// ── MediaPipe ──
let poseLandmarker = null;

async function loadMediaPipe() {
  if (poseLandmarker) return poseLandmarker;
  const status = document.getElementById('status');
  status.textContent = 'loading vision WASM...';
  const { PoseLandmarker, FilesetResolver } = await import(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/+esm'
  );
  status.textContent = 'loading model...';
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm'
  );
  try {
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: './pose_landmarker_lite.task', delegate: 'GPU' },
      runningMode: 'IMAGE', numPoses: 1
    });
  } catch(e) {
    console.warn('GPU fail → CPU:', e.message);
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: './pose_landmarker_lite.task', delegate: 'CPU' },
      runningMode: 'IMAGE', numPoses: 1
    });
  }
  return poseLandmarker;
}

async function detectAndPose(img) {
  const status = document.getElementById('status');
  try {
    const lm = await loadMediaPipe();
    status.textContent = 'detecting pose...';
    const results = lm.detect(img);
    console.log('MP results:', results);
    if (!results.landmarks || !results.landmarks.length) {
      status.textContent = 'no person found — try clearer photo';
      return;
    }
    const pts = results.landmarks[0];
    console.log('Landmarks:', pts.length, 'pts');
    applyLandmarks(pts);
    status.textContent = 'pose applied — drag to rotate';
  } catch(e) {
    console.error('Pose error:', e);
    status.textContent = 'error: ' + (e.message || 'failed').slice(0, 50);
  }
}

function applyLandmarks(lm) {
  const get = i => lm[i] || { x: 0.5, y: 0.5, z: 0 };
  const v = i => {
    const p = get(i);
    return new THREE.Vector3(
      (p.x - 0.5) * 2.8,
      (1 - p.y) * 3.8 + 0.25,
      p.z * 2.0
    );
  };

  const lSh = v(11), rSh = v(12);
  const lEl = v(13), rEl = v(14);
  const lWr = v(15), rWr = v(16);
  const lHi = v(23), rHi = v(24);
  const lKn = v(25), rKn = v(26);
  const lAn = v(27), rAn = v(28);

  // Position hips group at hip midpoint
  const hiMid = lHi.clone().add(rHi).multiplyScalar(0.5);
  B.hips.position.copy(hiMid);

  // Position leg roots at hip joints (relative to hips group)
  B.lUpLeg.position.copy(B.hips.worldToLocal(lHi.clone()));
  B.rUpLeg.position.copy(B.hips.worldToLocal(rHi.clone()));

  // Orient each bone along the direction to its child joint
  orientBone(B.lUpArm, B.lUpArm.getWorldPosition(new THREE.Vector3()), lEl);
  orientBone(B.lLoArm, B.lLoArm.getWorldPosition(new THREE.Vector3()), lWr);
  orientBone(B.rUpArm, B.rUpArm.getWorldPosition(new THREE.Vector3()), rEl);
  orientBone(B.rLoArm, B.rLoArm.getWorldPosition(new THREE.Vector3()), rWr);

  orientBone(B.lUpLeg, B.lUpLeg.getWorldPosition(new THREE.Vector3()), lKn);
  orientBone(B.lLoLeg, B.lLoLeg.getWorldPosition(new THREE.Vector3()), lAn);
  orientBone(B.rUpLeg, B.rUpLeg.getWorldPosition(new THREE.Vector3()), rKn);
  orientBone(B.rLoLeg, B.rLoLeg.getWorldPosition(new THREE.Vector3()), rAn);
}

function orientBone(bone, from, to) {
  const dir = to.clone().sub(from);
  if (dir.length() < 0.01) return;
  dir.normalize();
  // Clamp: prevent arms/legs from bending backwards
  const up = new THREE.Vector3(0, 1, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(up, dir);
  // Convert to local rotation
  const parentQ = bone.parent ? bone.parent.getWorldQuaternion(new THREE.Quaternion()) : new THREE.Quaternion();
  const localQ = parentQ.clone().invert().multiply(q);
  localQ.normalize();
  bone.quaternion.slerp(localQ, 0.7); // smooth blend
}

// ── Buttons ──
document.getElementById('btnA').onclick = () => { setApose(); document.getElementById('status').textContent = 'A-Pose'; };
document.getElementById('btnT').onclick = () => { setTpose(); document.getElementById('status').textContent = 'T-Pose'; };
document.getElementById('btnWalk').onclick = () => { setWalk(); document.getElementById('status').textContent = 'Walk'; };
document.getElementById('btnPhoto').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => detectAndPose(img);
  img.src = URL.createObjectURL(f);
};

// ── Render ──
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Debug
window.__B = B;
window.__root = root;
console.log('FK mannequin ready:', Object.keys(B).length, 'bones');

// Start
setApose();
document.getElementById('status').textContent = 'A-Pose · drag to rotate';
</script>
</body>
</html>
