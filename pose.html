<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pose Mannequin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;font-family:-apple-system,sans-serif}
canvas{display:block}
#ui{position:fixed;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10;flex-wrap:wrap;padding:0 12px}
#ui button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);
  padding:10px 18px;border-radius:22px;font-size:13px;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .2s}
#ui button:active{background:rgba(255,255,255,.28)}
#ui button.accent{background:#e94560;border-color:#e94560}
#status{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.55);
  font-size:11px;z-index:10;pointer-events:none;text-align:center}
#fileInput{display:none}
</style>
</head>
<body>
<div id="status">drag to rotate · pinch to zoom</div>
<div id="ui">
  <button id="btnA">A-Pose</button>
  <button id="btnT">T-Pose</button>
  <button id="btnWalk">Walk</button>
  <button id="btnPhoto" class="accent">Detect Pose</button>
</div>
<input type="file" id="fileInput" accept="image/*">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 3, 10);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 20);
camera.position.set(0, 1.5, 4);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.7;
controls.update();

// ── Lights ──
scene.add(new THREE.AmbientLight(0x8899bb, 1.8));
const sun = new THREE.DirectionalLight(0xffffff, 3.5);
sun.position.set(3, 5, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 20;
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -2;
sun.shadow.bias = -0.0002;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x4466aa, 1.2).translateX(-2).translateY(3).translateZ(-2));
scene.add(new THREE.DirectionalLight(0x6688bb, 0.8).translateZ(-4));

// Ground
const gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ color: 0x2a2a3e, roughness: 0.9 })
);
gnd.rotation.x = -Math.PI/2; gnd.position.y = -0.01; gnd.receiveShadow = true;
scene.add(gnd);

// ── Materials ──
const skin = new THREE.MeshStandardMaterial({ color: 0xe8d5c4, roughness: 0.4, metalness: 0.02 });
const joint = new THREE.MeshStandardMaterial({ color: 0xc9a08c, roughness: 0.3, metalness: 0.1 });
const dark = new THREE.MeshStandardMaterial({ color: 0x5c4a3a, roughness: 0.5 });

// ── Build Mannequin (flat hierarchy, all children of root) ──
const root = new THREE.Group();
scene.add(root);
const bones = {}; // name → Group

function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || skin);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(r, h, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), mat || skin);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function sphere(r, mat) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat || joint);
  m.castShadow = true;
  return m;
}

function makeBone(name) {
  const g = new THREE.Group();
  bones[name] = g;
  root.add(g);
  return g;
}

// Head: box + neck cylinder
bones.head = makeBone('head');
bones.head.add(box(0.16, 0.18, 0.18, skin).translateY(0.09));

// Neck
bones.neck = makeBone('neck');
bones.neck.add(cyl(0.04, 0.08, skin).translateY(0.04));

// Torso upper (chest)
bones.chest = makeBone('chest');
bones.chest.add(box(0.28, 0.3, 0.16, skin).translateY(0.15));

// Torso lower (abdomen)
bones.abdomen = makeBone('abdomen');
bones.abdomen.add(box(0.26, 0.22, 0.15, skin).translateY(0.11));

// Left upper arm (pivot at shoulder)
bones.lUpArm = makeBone('lUpArm');
bones.lUpArm.add(sphere(0.05, joint).translateY(0));
bones.lUpArm.add(cyl(0.04, 0.28, skin).translateY(0.14));
bones.lUpArm.add(sphere(0.04, joint).translateY(0.28));
// Left forearm (pivot at elbow)
bones.lLoArm = makeBone('lLoArm');
bones.lLoArm.add(cyl(0.035, 0.24, skin).translateY(0.12));
bones.lLoArm.add(sphere(0.035, joint).translateY(0.24));
// Left hand
bones.lHand = makeBone('lHand');
bones.lHand.add(sphere(0.04, joint));

// Right arm
bones.rUpArm = makeBone('rUpArm');
bones.rUpArm.add(sphere(0.05, joint));
bones.rUpArm.add(cyl(0.04, 0.28, skin).translateY(0.14));
bones.rUpArm.add(sphere(0.04, joint).translateY(0.28));
bones.rLoArm = makeBone('rLoArm');
bones.rLoArm.add(cyl(0.035, 0.24, skin).translateY(0.12));
bones.rLoArm.add(sphere(0.035, joint).translateY(0.24));
bones.rHand = makeBone('rHand');
bones.rHand.add(sphere(0.04, joint));

// Left upper leg (pivot at hip)
bones.lUpLeg = makeBone('lUpLeg');
bones.lUpLeg.add(sphere(0.06, joint));
bones.lUpLeg.add(cyl(0.06, 0.4, skin).translateY(0.2));
bones.lUpLeg.add(sphere(0.05, joint).translateY(0.4));
// Left lower leg (pivot at knee)
bones.lLoLeg = makeBone('lLoLeg');
bones.lLoLeg.add(cyl(0.05, 0.38, skin).translateY(0.19));
bones.lLoLeg.add(sphere(0.04, joint).translateY(0.38));
// Left foot
bones.lFoot = makeBone('lFoot');
bones.lFoot.add(box(0.07, 0.04, 0.13, dark).translateZ(0.04).translateY(0.02));

// Right leg
bones.rUpLeg = makeBone('rUpLeg');
bones.rUpLeg.add(sphere(0.06, joint));
bones.rUpLeg.add(cyl(0.06, 0.4, skin).translateY(0.2));
bones.rUpLeg.add(sphere(0.05, joint).translateY(0.4));
bones.rLoLeg = makeBone('rLoLeg');
bones.rLoLeg.add(cyl(0.05, 0.38, skin).translateY(0.19));
bones.rLoLeg.add(sphere(0.04, joint).translateY(0.38));
bones.rFoot = makeBone('rFoot');
bones.rFoot.add(box(0.07, 0.04, 0.13, dark).translateZ(0.04).translateY(0.02));

// ── Default A-Pose ──
function place(name, x, y, z, rx, ry, rz) {
  const b = bones[name];
  b.position.set(x, y, z);
  b.rotation.set(rx || 0, ry || 0, rz || 0);
}

function setApose() {
  // Head + neck
  place('head', 0, 1.5, 0, 0, 0, 0);
  place('neck', 0, 1.38, 0, 0, 0, 0);
  // Torso
  place('chest', 0, 1.12, 0, 0, 0, 0);
  place('abdomen', 0, 0.84, 0, 0, 0, 0);
  // Left arm: hanging down at slight angle
  place('lUpArm', -0.16, 1.36, 0, 0.15, 0, -0.35);
  place('lLoArm', -0.16, 1.36 - 0.28, 0, -0.1, 0, 0);
  place('lHand', -0.16, 1.36 - 0.28 - 0.24, 0);
  // Right arm
  place('rUpArm', 0.16, 1.36, 0, 0.15, 0, 0.35);
  place('rLoArm', 0.16, 1.36 - 0.28, 0, -0.1, 0, 0);
  place('rHand', 0.16, 1.36 - 0.28 - 0.24, 0);
  // Left leg
  place('lUpLeg', -0.1, 0.84, 0, 0, 0, 0);
  place('lLoLeg', -0.1, 0.84 - 0.4, 0, 0, 0, 0);
  place('lFoot', -0.1, 0.84 - 0.4 - 0.38, 0, 1.57, 0, 0);
  // Right leg
  place('rUpLeg', 0.1, 0.84, 0, 0, 0, 0);
  place('rLoLeg', 0.1, 0.84 - 0.4, 0, 0, 0, 0);
  place('rFoot', 0.1, 0.84 - 0.4 - 0.38, 0, 1.57, 0, 0);
}

function setTpose() {
  setApose();
  place('lUpArm', -0.16, 1.36, 0, 0, 0, -Math.PI/2);
  place('lLoArm', -0.16 - 0.28, 1.36, 0, 0, 0, -Math.PI/2);
  place('lHand', -0.16 - 0.28 - 0.24, 1.36, 0);
  place('rUpArm', 0.16, 1.36, 0, 0, 0, Math.PI/2);
  place('rLoArm', 0.16 + 0.28, 1.36, 0, 0, 0, Math.PI/2);
  place('rHand', 0.16 + 0.28 + 0.24, 1.36, 0);
}

function setWalk() {
  setApose();
  place('lUpArm', -0.16, 1.36, 0, -0.5, 0, -0.3);
  place('lLoArm', -0.16, 1.08, 0, 0.4, 0, 0);
  place('rUpArm', 0.16, 1.36, 0, 0.35, 0, 0.3);
  place('rLoArm', 0.16, 1.08, 0, -0.35, 0, 0);
  place('lUpLeg', -0.1, 0.84, 0, 0.3, 0, 0);
  place('lLoLeg', -0.1, 0.84 - 0.4, 0, -0.45, 0, 0);
  place('rUpLeg', 0.1, 0.84, 0, -0.25, 0, 0);
  place('rLoLeg', 0.1, 0.84 - 0.4, 0, 0.1, 0, 0);
}

// ── MediaPipe ──
let poseLandmarker = null;

async function loadMediaPipe() {
  if (poseLandmarker) return poseLandmarker;
  const status = document.getElementById('status');
  status.textContent = 'loading vision model...';
  const { PoseLandmarker, FilesetResolver } = await import(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/+esm'
  );
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm'
  );
  try {
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: './pose_landmarker_lite.task', delegate: 'GPU' },
      runningMode: 'IMAGE', numPoses: 1
    });
  } catch(e) {
    console.warn('GPU fail, CPU:', e.message);
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: './pose_landmarker_lite.task', delegate: 'CPU' },
      runningMode: 'IMAGE', numPoses: 1
    });
  }
  return poseLandmarker;
}

async function detectAndPose(img) {
  const status = document.getElementById('status');
  try {
    const lm = await loadMediaPipe();
    status.textContent = 'detecting...';
    const results = lm.detect(img);
    if (!results.landmarks || !results.landmarks.length) {
      status.textContent = 'no person found — try clearer photo';
      return;
    }
    const pts = results.landmarks[0];
    console.log('detected', pts.length, 'landmarks');
    applyLandmarks(pts);
    status.textContent = 'pose applied — drag to rotate';
  } catch(e) {
    console.error(e);
    status.textContent = 'error: ' + (e.message || 'failed').slice(0, 40);
  }
}

function applyLandmarks(lm) {
  const get = i => lm[i] || { x: 0.5, y: 0.5, z: 0 };
  const v = i => {
    const p = get(i);
    // Normalized → meters (rough), centered
    return new THREE.Vector3(
      (p.x - 0.5) * 3,
      (1 - p.y) * 4.2 + 0.2,
      p.z * 2.5
    );
  };

  // MediaPipe indices:
  // 0=nose, 7=L-ear, 8=R-ear, 11=L-shoulder, 12=R-shoulder
  // 13=L-elbow, 14=R-elbow, 15=L-wrist, 16=R-wrist
  // 23=L-hip, 24=R-hip, 25=L-knee, 26=R-knee, 27=L-ankle, 28=R-ankle

  const nose = v(0), lEar = v(7), rEar = v(8);
  const headPos = nose.clone().add(lEar).add(rEar).multiplyScalar(1/3).add(new THREE.Vector3(0, 0.06, 0));

  const lSh = v(11), rSh = v(12);
  const lEl = v(13), rEl = v(14);
  const lWr = v(15), rWr = v(16);
  const lHi = v(23), rHi = v(24);
  const lKn = v(25), rKn = v(26);
  const lAn = v(27), rAn = v(28);

  const shMid = lSh.clone().add(rSh).multiplyScalar(0.5);
  const hiMid = lHi.clone().add(rHi).multiplyScalar(0.5);

  // Place head
  setWorld('head', headPos, 0, 0, 0);
  setWorld('neck', shMid.clone().add(new THREE.Vector3(0, 0.02, 0)), 0, 0, 0);

  // Torso
  const tDir = shMid.clone().sub(hiMid);
  const tLen = tDir.length();
  const tMid = hiMid.clone().add(tDir.clone().multiplyScalar(0.6));
  const tLow = hiMid.clone().add(tDir.clone().multiplyScalar(0.25));
  setWorldLook('chest', tMid, tDir);
  setWorldLook('abdomen', tLow, tDir);

  // Arms
  setWorldLook('lUpArm', lSh, lEl.clone().sub(lSh));
  setWorldLook('lLoArm', lEl, lWr.clone().sub(lEl));
  setWorld('lHand', lWr, 0, 0, 0);
  setWorldLook('rUpArm', rSh, rEl.clone().sub(rSh));
  setWorldLook('rLoArm', rEl, rWr.clone().sub(rEl));
  setWorld('rHand', rWr, 0, 0, 0);

  // Legs
  setWorldLook('lUpLeg', lHi, lKn.clone().sub(lHi));
  setWorldLook('lLoLeg', lKn, lAn.clone().sub(lKn));
  setWorld('lFoot', lAn, Math.PI/2, 0, 0);
  setWorldLook('rUpLeg', rHi, rKn.clone().sub(rHi));
  setWorldLook('rLoLeg', rKn, rAn.clone().sub(rKn));
  setWorld('rFoot', rAn, Math.PI/2, 0, 0);
}

function setWorld(name, pos, rx, ry, rz) {
  const b = bones[name];
  root.remove(b);
  b.position.copy(pos);
  b.rotation.set(rx, ry, rz);
  root.add(b);
}

function setWorldLook(name, pos, dir) {
  const b = bones[name];
  root.remove(b);
  b.position.copy(pos);
  if (dir.length() > 0.005) {
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    b.quaternion.copy(q);
  } else {
    b.rotation.set(0, 0, 0);
  }
  root.add(b);
}

// ── Photo ──
document.getElementById('btnPhoto').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => detectAndPose(img);
  img.src = URL.createObjectURL(f);
};

// ── Buttons ──
document.getElementById('btnA').onclick = () => { setApose(); document.getElementById('status').textContent = 'A-Pose'; };
document.getElementById('btnT').onclick = () => { setTpose(); document.getElementById('status').textContent = 'T-Pose'; };
document.getElementById('btnWalk').onclick = () => { setWalk(); document.getElementById('status').textContent = 'Walk'; };

// ── Render ──
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Start
setApose();
// Debug: expose for console inspection
window.__root = root;
window.__bones = bones;
console.log('Mannequin ready, bones:', Object.keys(bones).join(', '));
</script>
</body>
</html>
