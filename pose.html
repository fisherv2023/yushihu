<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pose to 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
canvas{display:block}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:10;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.top-bar span{color:rgba(255,255,255,.5);font-size:13px;font-weight:500;letter-spacing:.15em}

/* Dropdown menu */
.menu-wrap{position:relative}
.menu-btn{padding:0 14px;height:38px;border-radius:19px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;letter-spacing:.05em;white-space:nowrap;line-height:1}
.menu-drop{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;display:none;flex-direction:column;gap:2px;min-width:120px}
.menu-drop.show{display:flex}
.menu-item{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.6);backdrop-filter:blur(10px);color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;transition:.2s;text-align:center;white-space:nowrap}
.menu-item:hover,.menu-item.active{color:#fff;border-color:rgba(255,255,255,.5)}

.timeline{position:fixed;bottom:120px;left:16px;right:16px;z-index:10;display:flex;align-items:center;gap:10px}
.timeline input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.2);border-radius:2px}
.timeline input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff}
.timeline .t-label{color:rgba(255,255,255,.4);font-size:11px;min-width:40px;text-align:center}

/* Bottom bar - 2:1:2 ratio with center fixed */
.bottom-bar{position:fixed;bottom:48px;left:0;right:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.bar-l{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.bar-c{display:flex;justify-content:center}
.bar-r{display:flex;justify-content:flex-start;align-items:center;gap:8px}
.btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.btn svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.btn.fill svg{fill:#fff}
.btn:active{background:rgba(255,255,255,.1)}

#loading{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;flex-direction:column}
#loading .txt{color:#fff;font-size:13px;letter-spacing:.1em;margin-bottom:10px}
#loading .bar-wrap{width:160px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#loading .bar-fill{height:100%;background:#fff;border-radius:2px;width:0;transition:width .3s}
</style>
</head>
<body>
<div id="loading"><div class="txt">Loading model...</div><div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div></div>
<div class="top-bar"><span>POSE</span></div>
<div class="timeline">
  <span class="t-label" id="tl">0.0s</span>
  <input type="range" id="timeline" min="0" max="100" value="0" step="1">
  <span class="t-label" id="td">0.0s</span>
</div>
<div class="bottom-bar">
  <div class="bar-l">
    <button class="btn" onclick="history.back()"><svg viewBox="0 0 24 24"><path d="M19 12H5m7-7l-7 7 7 7"/></svg></button>
    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">Standing ▾</button>
      <div class="menu-drop" id="menuDrop"></div>
    </div>
  </div>
  <div class="bar-c">
    <button class="btn fill" id="pp" onclick="tp()">
      <svg id="pi" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      <svg id="pl" viewBox="0 0 24 24" style="display:none"><polygon points="6,3 20,12 6,21"/></svg>
    </button>
  </div>
  <div class="bar-r">
    <button class="btn" id="bgBtn" onclick="cycleBg()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></button>
    <button class="btn fill" onclick="sv()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

const loading=document.getElementById('loading'),lt=loading.querySelector('.txt'),barFill=document.getElementById('barFill');
const menuBtn=document.getElementById('menuBtn'),menuDrop=document.getElementById('menuDrop');
const ti=document.getElementById('timeline'),tl=document.getElementById('tl'),td=document.getElementById('td');
let sc,ca,re,co,md=null,mx=null,cp=null,ps=false;

// LoadingManager for progress bar
let progressInterval=null;
const loadMgr=new THREE.LoadingManager();
loadMgr.onStart=()=>{barFill.style.width='0%';barFill.style.transition='none';progressInterval=setInterval(()=>{let w=parseFloat(barFill.style.width);if(w<90)barFill.style.width=(w+2)+'%'},100)};
loadMgr.onLoad=()=>{barFill.style.width='100%';barFill.style.transition='width .3s';clearInterval(progressInterval);setTimeout(()=>loading.style.display='none',200)};
loadMgr.onError=()=>{clearInterval(progressInterval)};

const ANIMS=[['Standing','models/poses/Standing_Idle.fbx'],['Sitting','models/poses/Sitting_Gun_Motion.fbx'],['Kneeling','models/poses/Kneeling_Down.fbx'],['Crouching','models/poses/Crouching.fbx'],['Walking','models/poses/Walking.fbx'],['Breakdance','models/poses/Breakdance.fbx'],['Golf','models/poses/Golf.fbx'],['Kick','models/poses/Kick.fbx'],['Lying','models/poses/Lying.fbx'],['Salute','models/poses/Salute.fbx'],['Standing Up','models/poses/Standing_Up.fbx'],['Dancing','models/poses/Hip_Hop_Dancing.fbx']];

sc=new THREE.Scene();sc.background=new THREE.Color(0x0a0a0f);
ca=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,20);ca.position.set(0,1,3.5);ca.lookAt(0,.5,0);
re=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
re.setPixelRatio(Math.min(devicePixelRatio,2));re.setSize(innerWidth,innerHeight);document.body.appendChild(re.domElement);
co=new OrbitControls(ca,re.domElement);co.enableDamping=true;co.dampingFactor=.12;co.target.set(0,.5,0);co.minDistance=1.5;co.maxDistance=6;co.update();
sc.add(new THREE.AmbientLight(0xffffff,.5));
let key=new THREE.DirectionalLight(0xffeedd,.9);key.position.set(2,3,2);sc.add(key);
let rim=new THREE.DirectionalLight(0xccddff,.4);rim.position.set(-1,1,-1);sc.add(rim);
let fill=new THREE.DirectionalLight(0xffffff,.3);fill.position.set(0,1,1);sc.add(fill);
window.addEventListener('resize',()=>{ca.aspect=innerWidth/innerHeight;ca.updateProjectionMatrix();re.setSize(innerWidth,innerHeight)});
function an(){requestAnimationFrame(an);co.update();if(mx&&!ps)mx.update(.016);re.render(sc,ca)}an();
window.sv=function(){let a=document.createElement('a');a.download='pose.png';a.href=re.domElement.toDataURL('image/png');a.click()};

// Build dropdown menu
menuDrop.innerHTML=ANIMS.map(([n],i)=>`<div class="menu-item${i?'':''}" data-idx="${i}" onclick="sl(${i})">${n}</div>`).join('');
window.toggleMenu=function(){menuDrop.classList.toggle('show')};

window.sl=async function(i){
 menuBtn.textContent=ANIMS[i][0]+' ▾';
 menuDrop.querySelectorAll('.menu-item').forEach(e=>e.classList.remove('active'));
 menuDrop.querySelector(`[data-idx="${i}"]`)?.classList.add('active');
 menuDrop.classList.remove('show');
 loading.style.display='flex';lt.textContent=ANIMS[i][0];barFill.style.width='2%';
 if(md){sc.remove(md);md=null;mx=null;cp=null}
 try{
  let fbx=await new FBXLoader(loadMgr).loadAsync(ANIMS[i][1]);
  md=fbx;let b=new THREE.Box3().setFromObject(md),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
  md.scale.setScalar(1.5/Math.max(s.x,s.y,s.z));md.position.y=-c.y*md.scale.y;sc.add(md);
  if(fbx.animations?.length>0){
   mx=new THREE.AnimationMixer(md);cp=fbx.animations[0];
   let a=mx.clipAction(cp);a.play();ps=false;
   ti.max=Math.round(cp.duration*100);
   let st=Math.min(1,cp.duration*.2);
   ti.value=Math.round(st*100);mx.setTime(st);mx.update(0);
   td.textContent=cp.duration.toFixed(1)+'s';tl.textContent=st.toFixed(1)+'s';
   document.getElementById('pi').style.display='';document.getElementById('pl').style.display='none';
  }
  loading.style.display='none';
 }catch(e){lt.textContent='Error: '+e.message}
};

ti.addEventListener('input',()=>{if(!mx||!cp)return;ps=true;document.getElementById('pi').style.display='none';document.getElementById('pl').style.display='';mx.setTime(+ti.value/100);mx.update(0);tl.textContent=(+ti.value/100).toFixed(1)+'s'});
window.tp=function(){ps=!ps;document.getElementById('pi').style.display=ps?'none':'';document.getElementById('pl').style.display=ps?'':'none'};

let bgIdx=0;
const BGS=['#0a0a0f','#444','#f0f0f0'];
window.cycleBg=function(){bgIdx=(bgIdx+1)%3;sc.background=new THREE.Color(BGS[bgIdx]);document.getElementById('bgBtn').classList.toggle('fill',bgIdx>0)};

// Double-tap hide UI
let lastTap=0;
document.addEventListener('click',e=>{
 if(e.target.closest('.btn,.menu-btn,.menu-item,#timeline'))return;
 let now=Date.now();
 if(now-lastTap<300){
  let els=[document.querySelector('.top-bar'),document.querySelector('.menu-wrap'),document.querySelector('.timeline'),document.querySelector('.bottom-bar')];
  let hid=els[0].style.display==='none';
  els.forEach(el=>el.style.display=hid?'':'none');
 }
 lastTap=now;
});

// Close menu on outside click
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))menuDrop.classList.remove('show')});

sl(0);
</script>
</body>
</html>
