<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pose to 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
canvas{display:block}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.top-bar span{color:rgba(255,255,255,.5);font-size:13px;font-weight:500;letter-spacing:.15em}
.top-bar button{color:rgba(255,255,255,.5);font-size:13px;font-weight:500;cursor:pointer;background:none;border:none;padding:4px 8px;letter-spacing:.1em}

/* Animation selector */
.anim-bar{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
.anim-tab{padding:6px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,.4);font-size:11px;cursor:pointer;letter-spacing:.05em;transition:.2s}
.anim-tab.active{border-color:rgba(255,255,255,.5);color:#fff}

/* Timeline */
.timeline{position:fixed;bottom:120px;left:16px;right:16px;z-index:10;display:flex;align-items:center;gap:10px}
.timeline input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none}
.timeline input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;cursor:pointer}
.timeline .time-label{color:rgba(255,255,255,.4);font-size:11px;min-width:40px;text-align:center}

/* Bottom bar */
.bottom-bar{position:fixed;bottom:48px;left:0;right:0;z-index:10;display:flex;justify-content:center;align-items:center;gap:12px;padding:0 16px}
.aux-btn{padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;letter-spacing:.05em;user-select:none;-webkit-user-select:none;transition:all .2s}
.aux-btn:active{background:rgba(255,255,255,.1)}
.aux-btn.primary{border-color:rgba(255,255,255,.5);color:#fff}

#loading{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;flex-direction:column}
#loading .sp{width:28px;height:28px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .txt{color:#fff;margin-top:14px;font-size:13px;letter-spacing:.1em}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div><div class="txt">Loading...</div></div>
<div class="top-bar"><span>POSE</span><button onclick="history.back()">EXIT</button></div>
<div class="anim-bar" id="animBar"></div>
<div class="timeline">
  <span class="time-label" id="timeLabel">0.0s</span>
  <input type="range" id="timeline" min="0" max="100" value="0" step="1">
  <span class="time-label" id="durLabel">0.0s</span>
</div>
<div class="bottom-bar">
  <button class="aux-btn" onclick="history.back()">EXIT</button>
  <button class="aux-btn primary" onclick="saveImg()">SAVE</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

const loading=document.getElementById('loading');
const loadingTxt=loading.querySelector('.txt');
const animBar=document.getElementById('animBar');
const timeline=document.getElementById('timeline');
const timeLabel=document.getElementById('timeLabel');
const durLabel=document.getElementById('durLabel');

let scene,camera,renderer,controls,currentModel=null,mixer=null,currentClip=null;
const ANIMS=[
  {name:'Crouching',file:'models/poses/Crouching.fbx'},
  {name:'Sitting',file:'models/poses/Sitting_Gun_Motion.fbx'},
  {name:'Standing',file:'models/poses/Standing_Idle.fbx'},
];

// Init scene
scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a0f);
camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,20);
camera.position.set(0,1.2,3);camera.lookAt(0,.6,0);
renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.12;
controls.target.set(0,.6,0);controls.update();
scene.add(new THREE.AmbientLight(0xffffff,.7));
let dl=new THREE.DirectionalLight(0xffffff,.5);dl.position.set(1,3,2);scene.add(dl);
scene.add(new THREE.GridHelper(3,30,0x222,0x111).translateY(-.7));
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

function animate(){requestAnimationFrame(animate);controls.update();if(mixer)mixer.update(0.016);renderer.render(scene,camera);}
animate();

window.saveImg=function(){
 let a=document.createElement('a');a.download='pose.png';a.href=renderer.domElement.toDataURL('image/png');a.click();
};

// Build animation buttons
animBar.innerHTML=ANIMS.map((a,i)=>`<button class="anim-tab${i===0?' active':''}" data-idx="${i}" onclick="selectAnim(${i})">${a.name}</button>`).join('');

window.selectAnim=async function(idx){
 animBar.querySelectorAll('.anim-tab').forEach(t=>t.classList.remove('active'));
 animBar.querySelector(`[data-idx="${idx}"]`)?.classList.add('active');
 loading.style.display='flex';
 loadingTxt.textContent='Loading: '+ANIMS[idx].name;
 if(currentModel){scene.remove(currentModel);currentModel=null;mixer=null}
 try{
  let fbx=await new FBXLoader().loadAsync(ANIMS[idx].file);
  currentModel=fbx;
  let box=new THREE.Box3().setFromObject(currentModel);
  let size=box.getSize(new THREE.Vector3());
  let center=box.getCenter(new THREE.Vector3());
  currentModel.scale.setScalar(1.8/Math.max(size.x,size.y,size.z));
  currentModel.position.y=-center.y*currentModel.scale.y;
  scene.add(currentModel);
  if(fbx.animations&&fbx.animations.length>0){
   mixer=new THREE.AnimationMixer(currentModel);
   currentClip=fbx.animations[0];
   let action=mixer.clipAction(currentClip);
   action.play();
   timeline.max=Math.round(currentClip.duration*100);
   timeline.value=0;
   durLabel.textContent=currentClip.duration.toFixed(1)+'s';
   timeLabel.textContent='0.0s';
   mixer.setTime(0);
  }
  loading.style.display='none';
 }catch(e){loadingTxt.textContent='Error: '+e.message;console.warn(e)}
};

timeline.addEventListener('input',()=>{
 if(!mixer||!currentClip)return;
 let t=+timeline.value/100;
 mixer.setTime(t);
 timeLabel.textContent=t.toFixed(1)+'s';
});

// Load first animation
selectAnim(0);
</script>
</body>
</html>
