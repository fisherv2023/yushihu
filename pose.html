<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pose Mannequin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;font-family:-apple-system,sans-serif}
canvas{display:block}
#ui{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:10}
#ui button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);
  padding:10px 20px;border-radius:24px;font-size:14px;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .2s}
#ui button:active,#ui button.on{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.4)}
#ui button.accent{background:#e94560;border-color:#e94560}
#status{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);
  font-size:12px;z-index:10;pointer-events:none}
#fileInput{display:none}
</style>
</head>
<body>
<div id="status">🖐 drag to rotate · pinch to zoom</div>
<div id="ui">
  <button id="btnTPose">T-Pose</button>
  <button id="btnAPose">A-Pose</button>
  <button id="btnWalk">Walk</button>
  <button id="btnRandom">Random</button>
  <button id="btnPhoto" class="accent">📷 Detect Pose</button>
</div>
<input type="file" id="fileInput" accept="image/*" capture="environment">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene setup ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 2, 8);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 20);
camera.position.set(0, 1.6, 3.5);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI * 0.75;
controls.update();

// ── Lighting ──
const ambient = new THREE.AmbientLight(0x8899bb, 1.5);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffffff, 3);
key.position.set(3, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0001;
scene.add(key);

const rim = new THREE.DirectionalLight(0x4466aa, 1.5);
rim.position.set(-2, 3, -2);
scene.add(rim);

const fill = new THREE.DirectionalLight(0x6688bb, 1);
fill.position.set(0, 1, -3);
scene.add(fill);

// ── Ground ──
const groundGeo = new THREE.PlaneGeometry(10, 10);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3e, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// ── Material ──
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8d5c4, roughness: 0.35, metalness: 0.05 });
const jointMat = new THREE.MeshStandardMaterial({ color: 0xc9a98c, roughness: 0.3, metalness: 0.1 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x5c4a3a, roughness: 0.5 });

// ── Helper: create body segment ──
function createSegment(w, h, d, mat) {
  const geo = new THREE.CapsuleGeometry(w, h - w*2, 4, 8);
  const mesh = new THREE.Mesh(geo, mat || bodyMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createJoint(r, mat) {
  const geo = new THREE.SphereGeometry(r, 16, 12);
  const mesh = new THREE.Mesh(geo, mat || jointMat);
  mesh.castShadow = true;
  return mesh;
}

// ── Build mannequin ──
const parts = {}; // name → THREE.Group (pivot at bottom center)
const mannequin = new THREE.Group();
scene.add(mannequin);

// Helper: create a bone segment as a Group (pivot at bottom, length extends up)
function boneSegment(length, radius, mat) {
  const g = new THREE.Group();
  const mesh = createSegment(radius, length, radius*2, mat);
  mesh.position.y = length / 2;
  g.add(mesh);
  // Add joint at top and bottom
  const jTop = createJoint(radius * 1.15, jointMat);
  jTop.position.y = length;
  g.add(jTop);
  const jBot = createJoint(radius * 1.05, jointMat);
  jBot.position.y = 0;
  g.add(jBot);
  g.userData = { length, radius };
  return g;
}

// Head  
const headG = new THREE.Group();
const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 18), bodyMat);
head.position.y = 0.12;
head.castShadow = true;
headG.add(head);
headG.position.set(0, 1.52, 0);
mannequin.add(headG);
parts.head = headG;

// Neck
const neck = boneSegment(0.08, 0.04, bodyMat);
neck.position.set(0, 1.38, 0);
mannequin.add(neck);
parts.neck = neck;

// Torso (upper + lower)
const torsoUpper = boneSegment(0.25, 0.07, bodyMat);
torsoUpper.position.set(0, 1.13, 0);
mannequin.add(torsoUpper);
parts.spine = torsoUpper;

const torsoLower = boneSegment(0.2, 0.08, bodyMat);
torsoLower.position.set(0, 0.93, 0);
mannequin.add(torsoLower);
parts.hips = torsoLower;

// Left arm (upper + lower)
const lUpperArm = boneSegment(0.28, 0.04, bodyMat);
lUpperArm.position.set(-0.22, 1.38, 0);
lUpperArm.rotation.z = -0.15;
mannequin.add(lUpperArm);
parts.lShoulder = lUpperArm;

const lForearm = boneSegment(0.24, 0.035, bodyMat);
lForearm.position.set(0, 0.28, 0);
lUpperArm.add(lForearm);
parts.lElbow = lForearm;

const lHand = new THREE.Group();
const lHandMesh = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 8), jointMat);
lHandMesh.position.y = 0.24;
lHand.add(lHandMesh);
lForearm.add(lHand);
parts.lWrist = lHand;

// Right arm
const rUpperArm = boneSegment(0.28, 0.04, bodyMat);
rUpperArm.position.set(0.22, 1.38, 0);
rUpperArm.rotation.z = 0.15;
mannequin.add(rUpperArm);
parts.rShoulder = rUpperArm;

const rForearm = boneSegment(0.24, 0.035, bodyMat);
rForearm.position.set(0, 0.28, 0);
rUpperArm.add(rForearm);
parts.rElbow = rForearm;

const rHand = new THREE.Group();
const rHandMesh = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 8), jointMat);
rHandMesh.position.y = 0.24;
rHand.add(rHandMesh);
rForearm.add(rHand);
parts.rWrist = rHand;

// Left leg
const lUpperLeg = boneSegment(0.4, 0.06, bodyMat);
lUpperLeg.position.set(-0.1, 0.93, 0);
lUpperLeg.rotation.x = -0.05;
mannequin.add(lUpperLeg);
parts.lHip = lUpperLeg;

const lLowerLeg = boneSegment(0.38, 0.05, bodyMat);
lLowerLeg.position.set(0, 0.4, 0);
lUpperLeg.add(lLowerLeg);
parts.lKnee = lLowerLeg;

const lFoot = new THREE.Group();
const lFootMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.04, 0.14), darkMat);
lFootMesh.position.set(0, 0.02, 0.04);
lFootMesh.castShadow = true;
lFoot.add(lFootMesh);
lFoot.position.set(0, 0.38, 0);
lLowerLeg.add(lFoot);
parts.lAnkle = lFoot;

// Right leg
const rUpperLeg = boneSegment(0.4, 0.06, bodyMat);
rUpperLeg.position.set(0.1, 0.93, 0);
rUpperLeg.rotation.x = -0.05;
mannequin.add(rUpperLeg);
parts.rHip = rUpperLeg;

const rLowerLeg = boneSegment(0.38, 0.05, bodyMat);
rLowerLeg.position.set(0, 0.4, 0);
rUpperLeg.add(rLowerLeg);
parts.rKnee = rLowerLeg;

const rFoot = new THREE.Group();
const rFootMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.04, 0.14), darkMat);
rFootMesh.position.set(0, 0.02, 0.04);
rFootMesh.castShadow = true;
rFoot.add(rFootMesh);
rFoot.position.set(0, 0.38, 0);
rLowerLeg.add(rFoot);
parts.rAnkle = rFoot;

// ── Pose functions ──
function resetAll() {
  mannequin.position.set(0, 0, 0);
  headG.position.set(0, 1.52, 0);
  headG.rotation.set(0, 0, 0);
  neck.rotation.set(0, 0, 0);
  neck.position.set(0, 1.38, 0);
  torsoUpper.rotation.set(0, 0, 0);
  torsoUpper.position.set(0, 1.13, 0);
  torsoLower.rotation.set(0, 0, 0);
  torsoLower.position.set(0, 0.93, 0);
  lUpperArm.rotation.set(0, 0, -0.15);
  lUpperArm.position.set(-0.22, 1.38, 0);
  lForearm.rotation.set(0, 0, 0);
  lHand.rotation.set(0, 0, 0);
  rUpperArm.rotation.set(0, 0, 0.15);
  rUpperArm.position.set(0.22, 1.38, 0);
  rForearm.rotation.set(0, 0, 0);
  rHand.rotation.set(0, 0, 0);
  lUpperLeg.rotation.set(-0.05, 0, 0);
  lUpperLeg.position.set(-0.1, 0.93, 0);
  lLowerLeg.rotation.set(0, 0, 0);
  lFoot.rotation.set(0, 0, 0);
  rUpperLeg.rotation.set(-0.05, 0, 0);
  rUpperLeg.position.set(0.1, 0.93, 0);
  rLowerLeg.rotation.set(0, 0, 0);
  rFoot.rotation.set(0, 0, 0);
}

function tPose() {
  resetAll();
  lUpperArm.rotation.set(0, 0, -Math.PI/2);
  rUpperArm.rotation.set(0, 0, Math.PI/2);
  lForearm.rotation.set(0, 0, 0);
  rForearm.rotation.set(0, 0, 0);
}

function aPose() {
  resetAll();
  lUpperArm.rotation.set(0.3, 0, -0.6);
  rUpperArm.rotation.set(0.3, 0, 0.6);
  lForearm.rotation.set(-0.2, 0, 0);
  rForearm.rotation.set(-0.2, 0, 0);
  lUpperLeg.rotation.set(-0.05, -0.05, -0.05);
  rUpperLeg.rotation.set(-0.05, 0.05, 0.05);
  lLowerLeg.rotation.set(0.1, 0, 0);
  rLowerLeg.rotation.set(0.1, 0, 0);
}

function walkPose() {
  resetAll();
  // Torso lean forward slightly
  torsoUpper.rotation.x = 0.1;
  // Arms swing
  lUpperArm.rotation.set(-0.6, 0, -0.3);
  rUpperArm.rotation.set(0.4, 0, 0.3);
  lForearm.rotation.set(0.3, 0, 0);
  rForearm.rotation.set(-0.4, 0, 0);
  // Legs stride
  lUpperLeg.rotation.set(0.3, 0, 0);
  lLowerLeg.rotation.set(-0.5, 0, 0);
  rUpperLeg.rotation.set(-0.3, 0, 0);
  rLowerLeg.rotation.set(0.1, 0, 0);
}

function randomPose() {
  resetAll();
  const rng = () => (Math.random() - 0.5) * 2;
  lUpperArm.rotation.set(rng()*1.2, rng()*0.8, rng()*1.2 - 0.3);
  rUpperArm.rotation.set(rng()*1.2, rng()*0.8, rng()*1.2 + 0.3);
  lForearm.rotation.set(rng()*1.5, 0, 0);
  rForearm.rotation.set(rng()*1.5, 0, 0);
  lUpperLeg.rotation.set(rng()*1, rng()*0.3, rng()*0.3);
  rUpperLeg.rotation.set(rng()*1, rng()*0.3, rng()*0.3);
  lLowerLeg.rotation.set(Math.max(0, rng() * 1.2), 0, 0);
  rLowerLeg.rotation.set(Math.max(0, rng() * 1.2), 0, 0);
  torsoUpper.rotation.set(rng()*0.3, rng()*0.2, 0);
  headG.rotation.set(rng()*0.3, rng()*0.4, 0);
}

// ── MediaPipe Pose Detection ──
async function loadMediaPipe() {
  const { PoseLandmarker, FilesetResolver, DrawingUtils } = await import(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/+esm'
  );
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm'
  );
  const poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task',
      delegate: 'GPU'
    },
    runningMode: 'IMAGE',
    numPoses: 1
  });
  return poseLandmarker;
}

async function detectPoseFromImage(imageElement) {
  const status = document.getElementById('status');
  status.textContent = '🔍 detecting pose...';
  try {
    const poseLandmarker = await loadMediaPipe();
    const results = poseLandmarker.detect(imageElement);
    if (results.landmarks && results.landmarks.length > 0) {
      const landmarks = results.landmarks[0];
      applyMediaPipePose(landmarks);
      status.textContent = '✅ pose applied · drag to rotate';
    } else {
      status.textContent = '⚠️ no person detected';
    }
  } catch (err) {
    console.error('Pose detection error:', err);
    status.textContent = '❌ detection failed';
  }
}

function applyMediaPipePose(landmarks) {
  // MediaPipe landmarks: 33 points, normalized 0-1 (x,y) + z (depth)
  // We'll map key landmarks to our mannequin joints
  // Indices: 11=left shoulder, 12=right shoulder, 13=left elbow, 14=right elbow
  // 15=left wrist, 16=right wrist, 23=left hip, 24=right hip
  // 25=left knee, 26=right knee, 27=left ankle, 28=right ankle
  // 0=nose, 7=left ear, 8=right ear

  resetAll();

  const get = (i) => landmarks[i] || { x: 0.5, y: 0.5, z: 0 };

  // Convert normalized coords to scene space (centered, flipped Y)
  function toVec(i) {
    const lm = get(i);
    return new THREE.Vector3(
      (lm.x - 0.5) * 2.5,
      (1 - lm.y) * 3.5 + 0.3,
      (lm.z) * 2
    );
  }

  // Head
  const nose = toVec(0);
  const lEar = toVec(7);
  const rEar = toVec(8);
  const headMid = nose.clone().add(lEar).add(rEar).multiplyScalar(1/3);
  headMid.y += 0.05;
  
  // Shoulders & hips
  const lSh = toVec(11);
  const rSh = toVec(12);
  const lHip = toVec(23);
  const rHip = toVec(24);
  const shMid = lSh.clone().add(rSh).multiplyScalar(0.5);
  const hipMid = lHip.clone().add(rHip).multiplyScalar(0.5);

  // Elbows, wrists
  const lElb = toVec(13);
  const rElb = toVec(14);
  const lWr = toVec(15);
  const rWr = toVec(16);

  // Knees, ankles
  const lKn = toVec(25);
  const rKn = toVec(26);
  const lAnk = toVec(27);
  const rAnk = toVec(28);

  // ── Position mannequin and apply rotations ──
  
  // Torso: from hipMid to shMid
  const torsoVec = shMid.clone().sub(hipMid);
  const torsoLen = torsoVec.length();
  torsoUpper.position.copy(hipMid);
  torsoLower.position.copy(hipMid);
  // Rotate torso to point toward shoulders
  torsoUpper.rotation.set(0, 0, 0);
  if (torsoLen > 0.01) {
    const up = new THREE.Vector3(0, 1, 0);
    const quat = new THREE.Quaternion().setFromUnitVectors(up, torsoVec.normalize());
    torsoUpper.quaternion.copy(quat);
    torsoLower.quaternion.copy(quat);
  }

  // Head
  headG.position.copy(headMid);

  // Left arm: shoulder → elbow → wrist
  positionBone(lUpperArm, lSh, lElb, 0.28);
  positionBone(lForearm, lElb, lWr, 0.24);

  // Right arm
  positionBone(rUpperArm, rSh, rElb, 0.28);
  positionBone(rForearm, rElb, rWr, 0.24);

  // Left leg: hip → knee → ankle
  positionBone(lUpperLeg, lHip, lKn, 0.4);
  positionBone(lLowerLeg, lKn, lAnk, 0.38);

  // Right leg
  positionBone(rUpperLeg, rHip, rKn, 0.4);
  positionBone(rLowerLeg, rKn, rAnk, 0.38);

  // Adjust torso position based on shMid
  const scale = shMid.clone().sub(hipMid).length() / (0.25 + 0.2);
  torsoUpper.scale.set(1, Math.max(0.3, scale), 1);
  torsoLower.scale.set(1, Math.max(0.3, scale * 0.8), 1);
}

function positionBone(bone, from, to, expectedLen) {
  const dir = to.clone().sub(from);
  const len = dir.length();
  bone.position.copy(from);
  if (len > 0.01) {
    const up = new THREE.Vector3(0, 1, 0);
    const quat = new THREE.Quaternion().setFromUnitVectors(up, dir.normalize());
    bone.quaternion.copy(quat);
    // Scale to match
    const s = len / expectedLen;
    bone.scale.set(1, Math.max(0.3, s), 1);
  }
}

// ── Photo upload ──
document.getElementById('btnPhoto').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => detectPoseFromImage(img);
  img.src = URL.createObjectURL(file);
});

// ── Buttons ──
document.getElementById('btnTPose').addEventListener('click', tPose);
document.getElementById('btnAPose').addEventListener('click', aPose);
document.getElementById('btnWalk').addEventListener('click', walkPose);
document.getElementById('btnRandom').addEventListener('click', randomPose);

// Mark active button
document.querySelectorAll('#ui button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#ui button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });
});

// ── Render ──
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Start in A-pose
aPose();
document.getElementById('btnAPose').classList.add('on');
</script>
</body>
</html>
