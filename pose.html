<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=UTF-8>
<meta name=viewport content='width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover'>
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<title>Pose to 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:pan-x pan-y pinch-zoom}
#vf{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
#vf video{width:100%;height:100%;object-fit:cover}
#ve{position:fixed;inset:0;z-index:2;display:none}
#ve canvas{display:block}
.bottom-bar{position:fixed;bottom:48px;left:0;right:0;z-index:10;display:flex;justify-content:center;align-items:center;gap:12px;padding:0 16px}
.exit-btn{padding:6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;letter-spacing:.05em;user-select:none;-webkit-user-select:none}
.cap-btn{position:relative;width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none;-webkit-user-select:none}
.cap-inner{position:absolute;top:5px;left:5px;width:44px;height:44px;border-radius:50%;background:#fff}
.aux-btn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.45;transition:.2s;font-size:13px;color:#fff}
.aux-btn svg{width:16px;height:16px;fill:#fff}
.act-row{position:fixed;bottom:128px;left:50%;transform:translateX(-50%);z-index:10;display:none;gap:8px}
.act-row.show{display:flex}
.act-btn{padding:6px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;cursor:pointer;color:#fff;user-select:none;-webkit-user-select:none}
#pr{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column}
#pr .sp{width:28px;height:28px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#pr .txt{color:#fff;margin-top:14px;font-size:13px;letter-spacing:.1em}
#fi{display:none}
</style>
</head>
<body>
<div id=vf><video id=vi playsinline autoplay muted></video></div>
<div id=ve></div>
<div id=pr><div class=sp></div><div class=txt>Processing...</div></div>
<div style="position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))"><span style="color:rgba(255,255,255,.5);font-size:13px;font-weight:500;letter-spacing:.15em">POSE</span><span></span></div>
<div class=bottom-bar>
<button class=exit-btn onclick=history.back()>EXIT</button>
<div class=cap-btn id=cb onclick=capture()><div class=cap-inner></div></div>
<div class=aux-btn id=ub onclick="document.getElementById('fi').click()"><svg viewBox='0 0 24 24'><path d='M24 19H21V23H19V19H16L20 15L24 19ZM21.0078 3C21.5555 3 21.9999 3.44482 22 3.99316V13H20V5H4V18.999L14 9L17 12V14.8291L14 11.8281L6.82715 19H14V21H2.99219C2.44451 21 2.00013 20.5552 2 20.0068V3.99316C2.00013 3.44463 2.45577 3 2.99219 3H21.0078ZM8 7C9.10457 7 10 7.89543 10 9C10 10.1046 9.10457 11 8 11C6.89543 11 6 10.1046 6 9C6 7.89543 6.89543 7 8 7Z'/></svg></div>
</div>
<div class=act-row id=act>
<button class=act-btn onclick=retake()>retake</button>
<button class=act-btn onclick=save()>save</button>
</div>
<input type=file id=fi accept=image/* onchange=upload(event)>
<script type=importmap>
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type=module>
import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const vf=document.getElementById('vf'),ve=document.getElementById('ve'),vi=document.getElementById('vi'),pr=document.getElementById('pr'),cb=document.getElementById('cb'),act=document.getElementById('act');
let sc,ca,re,co,md=null,bones={},pd,v3=THREE.Vector3,q=THREE.Quaternion;

function i3(){sc=new THREE.Scene();sc.background=new THREE.Color(0x0a0a0f);ca=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,20);ca.position.set(0,1.2,3);ca.lookAt(0,.6,0);re=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});re.setPixelRatio(Math.min(window.devicePixelRatio,2));re.setSize(innerWidth,innerHeight);ve.appendChild(re.domElement);co=new OrbitControls(ca,re.domElement);co.enableDamping=true;co.dampingFactor=.12;co.target.set(0,.6,0);co.update();sc.add(new THREE.AmbientLight(0xffffff,.7));let d=new THREE.DirectionalLight(0xffffff,.6);d.position.set(1,3,2);sc.add(d);let d2=new THREE.DirectionalLight(0xffffff,.4);d2.position.set(-1,1,-1);sc.add(d2);window.addEventListener('resize',()=>{ca.aspect=innerWidth/innerHeight;ca.updateProjectionMatrix();re.setSize(innerWidth,innerHeight)});an()}

function an(){requestAnimationFrame(an);if(co)co.update();if(re)re.render(sc,ca)}

async function loadModel(){try{let loader=new GLTFLoader();let gltf=await loader.loadAsync('models/rig-human.glb');md=gltf.scene;let box=new THREE.Box3().setFromObject(md);let size=box.getSize(new v3());let center=box.getCenter(new v3());md.scale.setScalar(1.8/Math.max(size.x,size.y,size.z));md.position.y=-center.y*md.scale.y;bones={};md.traverse(o=>{if(o.isBone){bones[o.name]=o}});sc.add(md);console.log('Bones:',Object.keys(bones))}catch(e){console.warn(e);md=null}}

function toPos(lm,i,sc=2.5){let p=lm[i];return new v3((p.x-.5)*sc,-(p.y-.5)*sc+.15,(p.z-.5)*sc)}

function applyPose(lm){
 if(!md||Object.keys(bones).length<3)return;

 let toP=(i,s=2.5)=>{let p=lm[i];return new v3((p.x-.5)*s,-(p.y-.5)*s+.15,(p.z-.5)*s)};

 let getBone=(needles,side)=>{
  let n=needles.toLowerCase().split('|');
  let matches=[];
  for(let[k,b]of Object.entries(bones)){
   let nk=k.toLowerCase();
   let hit=n.some(pat=>nk.includes(pat));
   if(!hit)continue;
   if(side===undefined){matches.push(b)}
   else if(side==='L'&&(nk.includes('_l')||nk.includes('_l_')||nk.includes('left')))matches.push(b);
   else if(side==='R'&&(nk.includes('_r')||nk.includes('_r_')||nk.includes('right')))matches.push(b);
  }
  return matches[0]||null;
 };

 let setBone=(bone,worldPos)=>{
  if(!bone)return;
  let pw=new v3();
  if(bone.parent&&bone.parent.isBone)bone.parent.getWorldPosition(pw);
  let local=worldPos.clone().sub(pw);
  let dist=local.length();
  if(dist<.001)return;
  let dir=local.normalize();
  bone.quaternion.copy(new q().setFromUnitVectors(new v3(0,1,0),dir));
  bone.position.set(0,dist,0);
 };

 let lmPos={};[0,11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>lmPos[i]=toP(i));

 // Hips
 let hiMid=new v3().addVectors(toP(23),toP(24)).multiplyScalar(.5);
 setBone(getBone('pelvis'),hiMid);

 // Spine
 let shMid=new v3().addVectors(toP(11),toP(12)).multiplyScalar(.5);
 let spineMid=new v3().addVectors(shMid,hiMid).multiplyScalar(.5);
 setBone(getBone('spine_01|spine'),spineMid);

 // Head
 setBone(getBone('head|neck'),toP(0,2.5));

 // Arms
 setBone(getBone('upperarm|clavicle','L'),toP(11));
 setBone(getBone('upperarm|clavicle','R'),toP(12));
 setBone(getBone('lowerarm|forearm','L'),toP(13));
 setBone(getBone('lowerarm|forearm','R'),toP(14));
 setBone(getBone('hand','L'),toP(15));
 setBone(getBone('hand','R'),toP(16));

 // Legs
 setBone(getBone('thigh','L'),toP(23));
 setBone(getBone('thigh','R'),toP(24));
 setBone(getBone('calf|shin','L'),toP(25));
 setBone(getBone('calf|shin','R'),toP(26));
 setBone(getBone('foot','L'),toP(27));
 setBone(getBone('foot','R'),toP(28));
}

async function lp(){const{PoseLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm');const v=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');pd=await PoseLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'IMAGE',numPoses:1})}
async function dp(img){if(!pd)await lp();let r=pd.detect(img);return r.landmarks[0]||null}
function sv(){vf.style.display='none';ve.style.display='block';cb.style.display='none';act.classList.add('show')}
function sf(){vf.style.display='flex';ve.style.display='none';cb.style.display='flex';act.classList.remove('show')}
async function pi(img){
 pr.style.display='flex';
 await new Promise(r=>setTimeout(r,100));
 // Wait for model to be ready
 if(!md){document.getElementById('pr').querySelector('.txt').textContent='Loading 3D model...';}
 let tries=0;
 while(!md&&tries<50){await new Promise(r=>setTimeout(r,200));tries++}
 let lm=await dp(img);
 pr.style.display='none';
 if(!lm){alert('No pose detected in photo');return}
 if(!md){alert('3D model still loading. Please wait a moment and try again.');return}
 applyPose(lm);
 sv();
 co.target.set(0,.6,0);co.update();
}
window.capture=async()=>{let c=document.createElement('canvas');c.width=vi.videoWidth;c.height=vi.videoHeight;c.getContext('2d').drawImage(vi,0,0);let img=new Image();img.src=c.toDataURL();await new Promise(r=>img.onload=r);pi(img)}
window.upload=async e=>{let f=e.target.files[0];if(!f)return;let img=new Image();img.src=URL.createObjectURL(f);await new Promise(r=>img.onload=r);pi(img)}
window.retake=sf;
window.save=()=>{let a=document.createElement('a');a.download='pose.png';a.href=re.domElement.toDataURL('image/png');a.click()}
i3();loadModel();lp();
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}}).then(s=>{vi.srcObject=s;vi.play()}).catch(()=>{});
</script>
</body>
</html>
