<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pose to 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
canvas{display:block}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.top-bar span{color:rgba(255,255,255,.5);font-size:13px;font-weight:500;letter-spacing:.15em}
.anim-bar{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;overflow-x:auto;max-width:90vw;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.anim-bar::-webkit-scrollbar{display:none}
.anim-tab{padding:6px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);color:rgba(255,255,255,.4);font-size:11px;cursor:pointer;letter-spacing:.05em;transition:.2s;white-space:nowrap;flex-shrink:0}
.anim-tab.active{border-color:rgba(255,255,255,.5);color:#fff}
.timeline{position:fixed;bottom:120px;left:16px;right:16px;z-index:10;display:flex;align-items:center;gap:10px}
.timeline input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.2);border-radius:2px}
.timeline input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff}
.timeline .t-label{color:rgba(255,255,255,.4);font-size:11px;min-width:40px;text-align:center}
.bottom-bar{position:fixed;bottom:48px;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:0 24px}
.btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.btn svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.btn.fill svg{fill:#fff}
.btn:active{background:rgba(255,255,255,.1)}
#loading{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;flex-direction:column}
#loading .sp{width:28px;height:28px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .txt{color:#fff;margin-top:14px;font-size:13px;letter-spacing:.1em}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div><div class="txt">Loading model...</div></div>
<div class="top-bar"><span>POSE</span></div>
<div class="anim-bar" id="animBar"></div>
<div class="timeline">
  <span class="t-label">0.0s</span>
  <input type="range" id="timeline" min="0" max="100" value="0" step="1">
  <span class="t-label">0.0s</span>
</div>
<div class="bottom-bar">
  <button class="btn" onclick="history.back()"><svg viewBox="0 0 24 24"><path d="M19 12H5m7-7l-7 7 7 7"/></svg></button>
  <button class="btn fill" onclick="saveImg()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

const loading=document.getElementById('loading'),loadingTxt=loading.querySelector('.txt');
const animBar=document.getElementById('animBar');

let sc,ca,re,co,model=null,bones={},poseData=null,currentAnim=null;
let mixerFBX=null,clipFBX=null,paused=false,hasPose=false;

// Init scene
sc=new THREE.Scene();sc.background=new THREE.Color(0x0a0a0f);
ca=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,20);
ca.position.set(0,1,3.5);ca.lookAt(0,.5,0);
re=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
re.setPixelRatio(Math.min(devicePixelRatio,2));re.setSize(innerWidth,innerHeight);
document.body.appendChild(re.domElement);
co=new OrbitControls(ca,re.domElement);
co.enableDamping=true;co.dampingFactor=.12;co.target.set(0,.5,0);
co.minDistance=1.5;co.maxDistance=6;co.update();
sc.add(new THREE.AmbientLight(0xffffff,.7));
let dl=new THREE.DirectionalLight(0xffffff,.5);dl.position.set(1,3,2);sc.add(dl);
window.addEventListener('resize',()=>{ca.aspect=innerWidth/innerHeight;ca.updateProjectionMatrix();re.setSize(innerWidth,innerHeight)});

function anim(){requestAnimationFrame(anim);co.update();if(mixerFBX&&!paused)mixerFBX.update(.016);re.render(sc,ca)}
anim();

window.saveImg=function(){
 let a=document.createElement('a');a.download='pose.png';a.href=re.domElement.toDataURL('image/png');a.click();
};

// Load base model + pose data
async function init(){
 try{
  // Load xbot.glb
  let gltf=await new GLTFLoader().loadAsync('models/xbot.glb');
  model=gltf.scene;
  model.traverse(o=>{if(o.isBone){bones[o.name]=o;o.userData={restQ:o.quaternion.clone(),restP:o.position.clone()}}});
  let box=new THREE.Box3().setFromObject(model);
  let s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
  model.scale.setScalar(1.5/Math.max(s.x,s.y,s.z));
  model.position.y=-c.y*model.scale.y;
  sc.add(model);
  console.log('Model loaded:',Object.keys(bones).length,'bones');

  // Load pose data
  let r=await fetch('models/poses/quats.json');
  poseData=await r.json();
  hasPose=true;

  // Build UI
  let order=poseData.order||Object.keys(poseData.poses);
  animBar.innerHTML=order.map((k,i)=>`<button class="anim-tab${i===0?' active':''}" data-idx="${i}" data-key="${k}" onclick="sel('${k}')">${poseData.poses[k].emoji||''} ${poseData.poses[k].label||k}</button>`).join('');
  loading.style.display='none';

  // Apply first pose
  if(order.length>0)sel(order[0]);
 }catch(e){loadingTxt.textContent='Error: '+e.message;console.warn(e)}
}

window.sel=function(key){
 animBar.querySelectorAll('.anim-tab').forEach(e=>e.classList.remove('active'));
 animBar.querySelector(`[data-key="${key}"]`)?.classList.add('active');
 currentAnim=key;
 applyPose(poseData.poses[key]);
};

function applyPose(pose){
 if(!model||!pose||!pose.bones)return;
 // Reset all bones
 Object.values(bones).forEach(b=>{
  if(b.userData?.restQ)b.quaternion.copy(b.userData.restQ);
  else b.quaternion.identity();
  if(b.userData?.restP)b.position.copy(b.userData.restP);
 });
 // Apply pose quaternions
 Object.entries(pose.bones).forEach(([name,q])=>{
  let b=bones[name];if(!b)return;
  b.quaternion.set(q.x||0,q.y||0,q.z||0,q.w||1);
 });
}

// Fallback: load FBX for timeline scrub
window.loadFBX=async function(path){
 mixerFBX=null;clipFBX=null;
 try{
  let fbx=await new FBXLoader().loadAsync(path);
  if(model){sc.remove(model);model=fbx}
  let box=new THREE.Box3().setFromObject(model);
  let s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
  model.scale.setScalar(1.5/Math.max(s.x,s.y,s.z));
  model.position.y=-c.y*model.scale.y;
  sc.add(model);
  if(fbx.animations?.length>0){
   mixerFBX=new THREE.AnimationMixer(model);
   clipFBX=fbx.animations[0];
   let action=mixerFBX.clipAction(clipFBX);action.play();paused=true;
   document.getElementById('timeline').max=Math.round(clipFBX.duration*100);
   document.getElementById('timeline').value=0;
  }
 }catch(e){console.warn(e)}
};

document.getElementById('timeline').addEventListener('input',function(){
 if(!mixerFBX||!clipFBX)return;
 paused=true;
 mixerFBX.setTime(+this.value/100);mixerFBX.update(0);
});

init();
</script>
</body>
</html>
