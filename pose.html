<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=UTF-8>
<meta name=viewport content='width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover'>
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<title>Pose to 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:pan-x pan-y pinch-zoom}
#vf{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
#vf video{width:100%;height:100%;object-fit:cover}
#ve{position:fixed;inset:0;z-index:2;display:none}
#ve canvas{display:block}
.tb{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.tb span{color:rgba(255,255,255,.5);font-size:13px;font-weight:500;letter-spacing:.15em}
.tb button{color:rgba(255,255,255,.5);font-size:13px;font-weight:500;cursor:pointer;background:none;border:none;padding:4px 8px;letter-spacing:.1em}
.bb{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;align-items:center;gap:20px;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
.cb{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cb:active{transform:scale(.92);border-color:#fff}
.cb svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2}
.ab{color:#fff;font-size:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:8px 18px;cursor:pointer;letter-spacing:.1em}
#rb,#sb{display:none}
#pr{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column}
#pr div:first-child{width:28px;height:28px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#pr div:last-child{color:#fff;margin-top:14px;font-size:13px;letter-spacing:.1em}
#ht{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.35);font-size:12px;z-index:10;text-align:center;letter-spacing:.08em}
#fi{display:none}
</style>
</head>
<body>
<div id=vf><video id=vi playsinline autoplay muted></video></div>
<div id=ve></div>
<div id=pr><div></div><div>Processing...</div></div>
<div class=tb><span>POSE</span><button onclick=history.back()>EXIT</button></div>
<div class=bb>
<button class=cb id=ub><svg viewBox='0 0 24 24'><path d='M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4'/><polyline points='17 8 12 3 7 8'/><line x1=12 y1=3 x2=12 y2=15/></svg></button>
<button class=cb id=cb><svg viewBox='0 0 24 24'><path d='M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z'/><circle cx=12 cy=13 r=4/></svg></button>
<button class=ab id=rb>retake</button>
<button class=ab id=sb>save</button>
</div>
<div id=ht>Tap to capture &middot; Upload &middot; Rotate model</div>
<input type=file id=fi accept=image/*>
<script type=importmap>
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type=module>
import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const vf=document.getElementById('vf'),ve=document.getElementById('ve'),vi=document.getElementById('vi'),pr=document.getElementById('pr'),cb=document.getElementById('cb'),ub=document.getElementById('ub'),rb=document.getElementById('rb'),sb=document.getElementById('sb'),fi=document.getElementById('fi'),ht=document.getElementById('ht');
let sc,ca,re,co,model,skel,pd;

function i3(){sc=new THREE.Scene();sc.background=new THREE.Color(0x0a0a0f);ca=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,10);ca.position.set(0,.8,2.5);ca.lookAt(0,.3,0);re=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});re.setPixelRatio(Math.min(window.devicePixelRatio,2));re.setSize(innerWidth,innerHeight);ve.appendChild(re.domElement);co=new OrbitControls(ca,re.domElement);co.enableDamping=true;co.dampingFactor=.12;co.target.set(0,.3,0);co.update();sc.add(new THREE.AmbientLight(0x606080,.6));sc.add(new THREE.AmbientLight(0x404040,.4));let d=new THREE.DirectionalLight(0xffffff,1);d.position.set(1,3,2);sc.add(d);let d2=new THREE.DirectionalLight(0xffffff,.4);d2.position.set(-1,1,-1);sc.add(d2);let g=new THREE.GridHelper(3,20,0x222,0x111);g.position.y=-.8;sc.add(g);window.addEventListener('resize',()=>{ca.aspect=innerWidth/innerHeight;ca.updateProjectionMatrix();re.setSize(innerWidth,innerHeight)});an()}
function an(){requestAnimationFrame(an);if(co)co.update();if(re)re.render(sc,ca)}

const MP_MAP={0:'head',11:'upper_arm.L',12:'upper_arm.R',13:'forearm.L',14:'forearm.R',15:'hand.L',16:'hand.R',23:'thigh.L',24:'thigh.R',25:'shin.L',26:'shin.R',27:'foot.L',28:'foot.R'};
async function loadModel(){let loader=new GLTFLoader();let gltf=await loader.loadAsync('https://app.mesh2motion.org/models/model-human.glb');model=gltf.scene;skel={};model.traverse(o=>{if(o.isBone)skel[o.name]=o});sc.add(model)}

function applyPose(lm){
  if(!model||!skel)return;
  Object.entries(MP_MAP).forEach(([mpIdx,boneName])=>{
    let bone=skel[boneName];if(!bone)return;
    let p=lm[parseInt(mpIdx)];
    let pos=new THREE.Vector3((p.x-.5)*2.5,-(p.y-.5)*2.5,(p.z-.5)*2);
    bone.position.copy(pos);
  });
  if(skel['spine']&&skel['hips']){
    let shL=lm[11],shR=lm[12],hipL=lm[23],hipR=lm[24];
    let spinePos=new THREE.Vector3(((shL.x+shR.x)/2-.5)*2.5,-((shL.y+shR.y)/2-.5)*2.5+.2,((shL.z+shR.z)/2-.5)*2);
    let hipPos=new THREE.Vector3(((hipL.x+hipR.x)/2-.5)*2.5,-((hipL.y+hipR.y)/2-.5)*2.5+.2,((hipL.z+hipR.z)/2-.5)*2);
    skel['spine'].position.copy(spinePos);skel['hips'].position.copy(hipPos);
  }
  if(skel['head']){
    let n=lm[0];skel['head'].position.set((n.x-.5)*2.5,-(n.y-.5)*2.5+.15,(n.z-.5)*2);
  }
}

async function lp(){const{PoseLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm');const v=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');pd=await PoseLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'IMAGE',numPoses:1})}
async function dp(img){if(!pd)await lp();let r=pd.detect(img);return r.landmarks[0]||null}
function sv(){vf.style.display='none';ve.style.display='block';cb.style.display='none';ub.style.display='none';rb.style.display='inline-block';sb.style.display='inline-block';ht.style.display='none'}
function sf(){vf.style.display='flex';ve.style.display='none';cb.style.display='flex';ub.style.display='flex';rb.style.display='none';sb.style.display='none';ht.style.display='block'}
async function pi(img){pr.style.display='flex';await new Promise(r=>setTimeout(r,100));let lm=await dp(img);pr.style.display='none';if(!lm){alert('No pose detected');return}applyPose(lm);sv();co.target.set(0,.3,0);co.update()}
cb.addEventListener('click',async()=>{let c=document.createElement('canvas');c.width=vi.videoWidth;c.height=vi.videoHeight;c.getContext('2d').drawImage(vi,0,0);let img=new Image();img.src=c.toDataURL();await new Promise(r=>img.onload=r);pi(img)});
ub.addEventListener('click',()=>fi.click());
fi.addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;let img=new Image();img.src=URL.createObjectURL(f);await new Promise(r=>img.onload=r);pi(img)});
rb.addEventListener('click',sf);
sb.addEventListener('click',()=>{let a=document.createElement('a');a.download='pose.png';a.href=re.domElement.toDataURL('image/png');a.click()});
i3();loadModel();lp();
navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}}).then(s=>{vi.srcObject=s;vi.play()}).catch(()=>{});
</script>
</body>
</html>
