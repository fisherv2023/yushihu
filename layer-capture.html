<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Layer Capture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
.perm{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92)}
.perm .title{font-size:19px;font-weight:600;margin-bottom:6px}
.perm .desc{font-size:13px;opacity:.5;margin-bottom:22px;text-align:center}
.perm .btn{padding:13px 36px;border-radius:24px;border:none;background:#fff;color:#111;font-size:15px;font-weight:600;cursor:pointer}
.panel{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);padding:6px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.12)}
.panel button{height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:13px;cursor:pointer}
.panel button:active{background:rgba(255,255,255,.18)}
.panel button.primary{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.status{position:fixed;top:16px;right:16px;z-index:10;font-size:12px;opacity:.5}
.slider-row{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);z-index:10;display:none;align-items:center;gap:8px;width:60vw;max-width:240px}
.slider-row span{font-size:10px;opacity:.4}
.slider{appearance:none;-webkit-appearance:none;flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.15);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="perm" id="perm">
  <div class="title">Layer Capture</div>
  <div class="desc">Freeze frames • superimpose</div>
  <button class="btn" id="permBtn">Allow Camera</button>
</div>
<div class="status" id="status"></div>
<div class="slider-row" id="sliderRow">
  <span>淡</span>
  <input type="range" class="slider" id="layerSlider" min="1" max="10" value="6">
  <span>浓</span>
</div>
<div class="panel" id="panel" style="display:none">
  <button class="primary" id="btnCapture">● 捕获</button>
  <button id="btnUndo">↩</button>
  <button id="btnSave">保存</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const MAX_LAYERS = 8;
const LAYER_OPACITY = 0.6;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true, antialias: true, alpha: false, depth: false, stencil: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const camera3D = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const scene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
scene.add(quad);

// Layers
const layers = [];
let video, stream;

// Canvas-based video texture (avoid VideoTexture issues)
const vidCanvas = document.createElement('canvas');
const vidCtx = vidCanvas.getContext('2d');
let vidTex = null;

function getOpacity() {
  return parseFloat(document.getElementById('layerSlider').value) / 10;
}

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video = document.createElement('video');
    video.srcObject = stream; video.playsInline = true;
    await video.play();
    document.getElementById('perm').style.display = 'none';
    document.getElementById('panel').style.display = 'flex';
    document.getElementById('sliderRow').style.display = 'flex';
  } catch (err) { console.error(err); }
}
document.getElementById('permBtn').addEventListener('click', startCam);

// Capture
document.getElementById('btnCapture').addEventListener('click', () => {
  if (!video || !video.videoWidth || layers.length >= MAX_LAYERS) return;
  const w = video.videoWidth, h = video.videoHeight;
  const cap = document.createElement('canvas');
  cap.width = w; cap.height = h;
  cap.getContext('2d').drawImage(video, 0, 0, w, h);
  const tex = new THREE.CanvasTexture(cap);
  tex.colorSpace = THREE.NoColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  layers.push({ texture: tex, opacity: getOpacity() });
  updateStatus();
});

document.getElementById('btnUndo').addEventListener('click', () => {
  layers.pop();
  updateStatus();
});

function updateStatus() {
  document.getElementById('status').textContent = layers.length ? `已捕获: ${layers.length}` : '';
}

// Display shaders
const cameraMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `precision highp float;varying vec2 vUv;uniform sampler2D uTex;
void main(){gl_FragColor=texture2D(uTex,vUv);}`,
  uniforms: { uTex: { value: null } },
  depthTest: false, depthWrite: false,
});

const blendMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `precision highp float;varying vec2 vUv;
uniform sampler2D uBase,uLayer;uniform float uOp;
void main(){
  vec4 base=texture2D(uBase,vUv);
  vec4 layer=texture2D(uLayer,vUv);
  // Simple mix (replaces screen blend that went too bright)
  vec3 col=mix(base.rgb,layer.rgb,uOp);
  gl_FragColor=vec4(col,1.);
}`,
  uniforms: { uBase: { value: null }, uLayer: { value: null }, uOp: { value: LAYER_OPACITY } },
  depthTest: false, depthWrite: false,
});

function blit(mat, target) {
  quad.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(scene, camera3D);
}

// Ping-pong RTs
let rtA = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  format: THREE.RGBAFormat, depthBuffer: false,
});
let rtB = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  format: THREE.RGBAFormat, depthBuffer: false,
});

function render() {
  requestAnimationFrame(render);
  if (!video || !video.videoWidth) return;

  // Draw video → canvas → texture (bypass VideoTexture)
  vidCanvas.width = video.videoWidth;
  vidCanvas.height = video.videoHeight;
  vidCtx.drawImage(video, 0, 0);
  if (!vidTex) {
    vidTex = new THREE.CanvasTexture(vidCanvas);
    vidTex.colorSpace = THREE.NoColorSpace;
  } else {
    vidTex.needsUpdate = true;
  }

  // Always show all layers (slider controls opacity now)
  if (layers.length === 0) {
    // No layers: render camera directly to screen
    cameraMat.uniforms.uTex.value = vidTex;
    quad.material = cameraMat;
    renderer.setRenderTarget(null);
    renderer.render(scene, camera3D);
    return;
  }

  // With layers: composite
  // Pass 1: camera → rtA
  cameraMat.uniforms.uTex.value = vidTex;
  blit(cameraMat, rtA);

  // Each layer uses its own stored opacity from capture time
  let src = rtA, dst = rtB;
  let totalW = 1; // camera
  for (let i = 0; i < layers.length; i++) {
    const o = layers[i].opacity;
    totalW += o;
    const w = o / totalW;
    blendMat.uniforms.uBase.value = src.texture;
    blendMat.uniforms.uLayer.value = layers[i].texture;
    blendMat.uniforms.uOp.value = w;
    blit(blendMat, dst);
    const t = src; src = dst; dst = t;
  }

  // src now holds the final result
  quad.material = new THREE.MeshBasicMaterial({ map: src.texture });
  renderer.setRenderTarget(null);
  renderer.render(scene, camera3D);
}

// Save
document.getElementById('btnSave').addEventListener('click', () => {
  vidCanvas.width = video.videoWidth;
  vidCanvas.height = video.videoHeight;
  vidCtx.drawImage(video, 0, 0);
  vidTex.needsUpdate = true;

  // Progressive average: each layer weighted by its capture-time opacity
  cameraMat.uniforms.uTex.value = vidTex;
  blit(cameraMat, rtA);

  let src = rtA, dst = rtB;
  let totalW = 1;
  for (let i = 0; i < layers.length; i++) {
    const o = layers[i].opacity;
    totalW += o;
    const w = o / totalW;
    blendMat.uniforms.uBase.value = src.texture;
    blendMat.uniforms.uLayer.value = layers[i].texture;
    blendMat.uniforms.uOp.value = w;
    blit(blendMat, dst);
    const t = src; src = dst; dst = t;
  }

  quad.material = new THREE.MeshBasicMaterial({ map: src.texture });
  renderer.setRenderTarget(null);
  renderer.render(scene, camera3D);

  const link = document.createElement('a');
  link.download = 'layer-capture-' + Date.now() + '.png';
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();
});

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  rtA.setSize(innerWidth, innerHeight);
  rtB.setSize(innerWidth, innerHeight);
});

render();
</script>
</body>
</html>
