<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Layer Capture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
.perm{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);backdrop-filter:blur(20px)}
.perm .title{font-size:19px;font-weight:600;margin-bottom:6px}
.perm .desc{font-size:13px;opacity:.5;margin-bottom:22px;text-align:center}
.perm .btn{padding:13px 36px;border-radius:24px;border:none;background:#fff;color:#111;font-size:15px;font-weight:600;cursor:pointer}
.panel{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.12)}
.panel button{height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s}
.panel button:active{background:rgba(255,255,255,.18)}
.panel button.primary{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.status{position:fixed;top:16px;right:16px;z-index:10;font-size:12px;opacity:.5}
.slider-row{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);z-index:10;display:none;align-items:center;gap:8px;width:60vw;max-width:240px}
.slider-row span{font-size:10px;opacity:.4;min-width:16px}
.slider{appearance:none;-webkit-appearance:none;flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.15);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="perm" id="perm">
  <div class="title">Layer Capture</div>
  <div class="desc">Freeze frames as layers<br>superimpose on live camera</div>
  <button class="btn" id="permBtn">Allow Camera</button>
</div>
<div class="status" id="status"></div>
<div class="slider-row" id="sliderRow">
  <span>淡</span>
  <input type="range" class="slider" id="opacitySlider" min="1" max="10" value="5">
  <span>浓</span>
</div>
<div class="panel" id="panel" style="display:none">
  <button class="primary" id="btnCapture">● 捕获</button>
  <button id="btnUndo">↩</button>
  <button id="btnSave">保存</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const MAX_LAYERS = 8;

// Renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true, antialias: true, alpha: false, depth: false, stencil: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
const camera3D = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const scene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
scene.add(quad);

// Layers: each is { texture, opacity }
const layers = [];
let video, videoTexture, stream;

function getOpacity() {
  return parseFloat(document.getElementById('opacitySlider').value) / 10;
}

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video = document.createElement('video');
    video.srcObject = stream; video.playsInline = true;
    await video.play();
    videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.SRGBColorSpace;
    document.getElementById('perm').style.display = 'none';
    document.getElementById('panel').style.display = 'flex';
    document.getElementById('sliderRow').style.display = 'flex';
  } catch (err) { console.error('Camera:', err); }
}
document.getElementById('permBtn').addEventListener('click', startCam);

// Capture: freeze current frame as a layer
document.getElementById('btnCapture').addEventListener('click', () => {
  if (!video || !video.videoWidth || layers.length >= MAX_LAYERS) return;

  const w = video.videoWidth, h = video.videoHeight;
  const capCanvas = document.createElement('canvas');
  capCanvas.width = w; capCanvas.height = h;
  capCanvas.getContext('2d').drawImage(video, 0, 0, w, h);

  const tex = new THREE.CanvasTexture(capCanvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  layers.push({ texture: tex, opacity: getOpacity() });
  updateStatus();
});

document.getElementById('btnUndo').addEventListener('click', () => {
  layers.pop();
  updateStatus();
});

function updateStatus() {
  document.getElementById('status').textContent = layers.length ? `Layers: ${layers.length}` : '';
}

// Display: live camera → composite layers → screen
const displayMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `precision highp float;varying vec2 vUv;uniform sampler2D uCamera;
void main(){gl_FragColor=vec4(texture2D(uCamera,vUv).rgb,1.);}`,
  uniforms: { uCamera: { value: null } },
  depthTest: false, depthWrite: false,
});

const layerBlendMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader: `precision highp float;varying vec2 vUv;
uniform sampler2D uBase,uLayer;uniform float uOpacity;
void main(){
  vec3 base=texture2D(uBase,vUv).rgb;
  vec3 layer=texture2D(uLayer,vUv).rgb;
  gl_FragColor=vec4(mix(base,layer,uOpacity),1.);
}`,
  uniforms: { uBase: { value: null }, uLayer: { value: null }, uOpacity: { value: 0.5 } },
  depthTest: false, depthWrite: false,
});

function blit(mat, target) {
  quad.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(scene, camera3D);
}

// Ping-pong RTs for compositing (reading+writing same RT = undefined WebGL behavior)
let compA = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  format: THREE.RGBAFormat, depthBuffer: false,
});
let compB = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  format: THREE.RGBAFormat, depthBuffer: false,
});

function composite(displayTex, layersArr, flip) {
  let src = flip ? compB : compA;
  let dst = flip ? compA : compB;

  // Pass 1: camera → dst
  displayMat.uniforms.uCamera.value = displayTex;
  blit(displayMat, dst);

  // Pass 2-N: composite each layer, ping-pong
  for (let i = 0; i < layersArr.length; i++) {
    const layer = layersArr[i];
    const isLast = i === layersArr.length - 1;
    const read = (i % 2 === 0) ? dst : src;
    const write = (i % 2 === 0) ? src : dst;

    layerBlendMat.uniforms.uBase.value = read.texture;
    layerBlendMat.uniforms.uLayer.value = layer.texture;
    layerBlendMat.uniforms.uOpacity.value = layer.opacity;
    blit(layerBlendMat, write);

    if (isLast) {
      // Final result lives in 'write'
      if (write === compB) {
        // Swap so compA always holds final result
        const t = compA; compA = compB; compB = t;
      }
    }
  }

  return compA;
}

function render() {
  requestAnimationFrame(render);
  if (!videoTexture) return;
  videoTexture.needsUpdate = true;

  const final = composite(videoTexture, layers, false);
  // Blit to screen
  quad.material = new THREE.MeshBasicMaterial({ map: final.texture });
  renderer.setRenderTarget(null);
  renderer.render(scene, camera3D);
}

// Save
document.getElementById('btnSave').addEventListener('click', () => {
  videoTexture.needsUpdate = true;
  const final = composite(videoTexture, layers, true);
  quad.material = new THREE.MeshBasicMaterial({ map: final.texture });
  renderer.setRenderTarget(null);
  renderer.render(scene, camera3D);

  const link = document.createElement('a');
  link.download = 'layer-capture-' + Date.now() + '.png';
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();
});

// Resize
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  compA.setSize(innerWidth, innerHeight);
  compB.setSize(innerWidth, innerHeight);
});

render();
</script>
</body>
</html>
